package: models
output: ../models.gen.go
generate:
  models: true
output-options:
  # to make sure that all types are generated
  skip-prune: true
  nullable-type: true
compatibility:
  always-prefix-enum-values: true
import-mapping:
  ../../pkg/go-syndication/schema/types.yaml: github.com/immanent-tech/go-syndication/types
  api.yaml: '-'
