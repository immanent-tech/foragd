openapi: '3.0.3'
info:
  version: 1.0.0
  title: Common Models
  description: >
    Contains common fields and objects that are shared and reused through the application.
  license:
    name: "AGPL 3.0"
    idenfiier: AGPL-3.0-or-later
  contact:
    name: "Immanent Tech"
components:
  schemas:
    # Common Fields.
    Timestamp:
      description: is when the document was created.
      x-go-type: 'time.Time'
      x-oapi-codegen-extra-tags:
        json: '@timestamp'
        validate: 'required'
    CreatedAt:
      description: records when the object was created in the database.
      x-go-type: 'time.Time'
      x-oapi-codegen-extra-tags:
        json: 'created_at'
        validate: 'required'
    UpdatedAt:
      description: records when the object was last updated in the database.
      x-go-type: 'time.Time'
      x-oapi-codegen-extra-tags:
        json: 'updated_at,omitempty'
        validate: 'omitnil'
    DeletedAt:
      description: records when the object was deleted.
      x-go-type: 'time.Time'
      x-oapi-codegen-extra-tags:
        json: 'deleted_at,omitempty'
        validate: 'omitnil'
      deprecated: true
    LastFetched:
      description: >
        indicates when an object was last fetched.
      x-go-type: time.Time
      x-oapi-codegen-extra-tags:
        json: 'last_fetched,omitempty'
    URL:
      description: is a URL.
      type: string
      x-go-name: URL
      x-oapi-codegen-extra-tags:
        validate: 'omitempty,url'
        json: 'url'
    RemoteImage:
      description: >
        contains details about a remote image.
      type: object
      properties:
        title:
          description: >
            the description of the image
          type: string
        url:
          $ref: '#/components/schemas/URL'
    Mark:
      description: >
        applies the given mark action to objects.
      type: string
      enum: ['read', 'unread']
      x-oapi-codegen-extra-tags:
        form: 'mark'
        validate: 'oneof=read unread'
    State:
      description: >
        Tracks the state of an object.
      type: string
      enum: ['read', 'unread', 'saved']
      default: 'unread'
      x-oapi-codegen-extra-tags:
        json: 'state'
        validate: 'oneof=read unread saved'
    FeedID:
      description: is the unique ID of a feed.
      type: string
      x-go-name: FeedID
      x-oapi-codegen-extra-tags:
        validate: 'required,startswith=feed_'
        json: 'feed_id'
        form: 'feed_id'
    ItemID:
      description: is the unique ID of an item.
      type: string
      x-go-name: ItemID
      x-oapi-codegen-extra-tags:
        validate: 'required,startswith=item_'
        json: 'item_id'
        form: 'item_id'
    SubscriptionID:
      description: is the unique ID of a subscription.
      type: string
      x-go-name: SubscriptionID
      x-oapi-codegen-extra-tags:
        validate: 'required,startswith=sub_'
        json: 'subscription_id'
        form: 'subscription_id'
    EmailSenderID:
      description: >
        is an email address that sends emails.
      type: string
      x-go-name: EmailSenderID
      x-oapi-codegen-extra-tags:
        form: 'email_sender_id'
        validate: 'required,email'
    ObjectID:
      description: represents an ID of any user-facing object.
      type: string
      x-go-name: ObjectID
      x-oapi-codegen-extra-tags:
        validate: 'required,startswith=sub_|startswith=item_'
        json: 'id'
        form: 'id'
    ObjectType:
      description: represents the type of any user-facing object.
      type: string
      enum: ['subscription','article']
      x-oapi-codegen-extra-tags:
        validate: 'required,oneof=subscription article'
        json: 'object'
        form: 'object'
    SourceType:
      description: >
        indicates what type of source the object came from.
      type: string
      enum: ['RSS', 'Atom', 'JSONFeed', 'Email']
    UserID:
      description: is the unique ID of a user.
      type: string
      x-go-name: UserID
      x-oapi-codegen-extra-tags:
        json: 'user_id'
        validate: 'required,startswith=user_'
        form: 'user_id'
    Nickname:
      description: >
        is an optional friendly name.
      type: string
      x-oapi-codegen-extra-tags:
        form: 'nickname'
    StoredImage:
      description: >
        is an image stored locally (i.e., the binary data to represent the image).
      type: object
      required:
        - data
      properties:
        data:
          x-go-type: image.Image
    Category:
      description: >
        represents a taxonomy applied to an object.
      type: string
      x-oapi-codegen-extra-tags:
        form: 'category'
    CategoryCount:
      description: >
        holds a category and the count of its occurence. The count will be
        contextual. i.e., across subscriptions, items, etc.
      type: object
      required:
        - category
        - count
      properties:
        category:
          $ref: '#/components/schemas/Category'
        count:
          type: integer
          minimum: 0
    Count:
      description: >
        is the count of items to retrieve with a request.
      type: integer
      default: '10'
      x-oapi-codegen-extra-tags:
        form: 'count'
        validate: 'gt=0,lt=20'
    View:
      description: >
        The state of objects to view.
      type: string
      enum: ['read', 'unread', 'all']
      default: 'unread'
      x-oapi-codegen-extra-tags:
        validate: 'required,oneof=read unread all'
        form: 'view'
    Pagination:
      description: contains data for paginating through results.
      type: string
      x-oapi-codegen-extra-tags:
        form: 'pagination'
        validate: 'omitempty,url_encoded'
    Sort:
      description: is how a list of objects is sorted.
      type: string
      enum: ['newest_first','oldest_first','most_unread','least_unread','most_relevant']
      x-oapi-codegen-extra-tags:
        form: 'sort'
        validate: 'required,oneof=newest_first oldest_first most_unread least_unread most_relevant'
    # Objects.
    UserCustomisation:
      description: >
        contains account fields that a user can customize.
      type: object
      properties:
        nickname:
          description: >
            is a nickname for the user.
          type: string
          x-oapi-codegen-extra-tags:
            form: 'nickname'
        email:
          description: >
            is the email address of the user.
          type: string
          x-oapi-codegen-extra-tags:
            form: 'email'
            validate: 'omitempty,email'
        avatar_url:
          description: >
            is a link to an image file to user as an avatar for the user.
          type: string
          x-go-name: AvatarURL
          x-oapi-codegen-extra-tags:
            form: 'avatar_url'
            validate: 'omitempty,url'
    UserSettings:
      description: >
        contains user-specific settings for the application.
      type: object
      required:
        - theme
        - show_onboarding
        - show_subscription_stats
        - mark_article_read_on_view
        - max_view_history
        - updates_interval
      properties:
        theme:
          description: >
            the user interface theme chosen by the user.
          type: string
          default: greenhouse
          x-oapi-codegen-extra-tags:
            form: 'theme'
        show_onboarding:
          description: >
            indicates whether to show onboarding information (i.e., for a new user).
          type: boolean
          default: true
          x-oapi-codegen-extra-tags:
            form: '-'
          x-omitzero: false
          x-omitempty: false
          x-go-type-skip-optional-pointer: true
        show_subscription_stats:
          description: >
            indicates whether various subscription stats (e.g., unread counts, articles/day, etc.) should be shown.
          type: boolean
          x-oapi-codegen-extra-tags:
            form: 'show_subscription_stats'
          x-omitzero: false
          x-omitempty: false
          x-go-type-skip-optional-pointer: true
        mark_article_read_on_view:
          description: >
            indicates whether to automatically mark an article as read when viewed.
          type: boolean
          default: true
          x-oapi-codegen-extra-tags:
            form: 'mark_article_read_on_view'
          x-omitzero: false
          x-omitempty: false
          x-go-type-skip-optional-pointer: true
        subscription_email:
          description: >
            is an email address the user can use to subscribe to email newsletters.
          type: string
          x-oapi-codegen-extra-tags:
            form: 'subscription_email'
            validate: 'omitempty,email'
        max_view_history:
          description: >
            is a user-specified limit on how far back in time to view articles.
          x-go-type: time.Duration
          x-oapi-codegen-extra-tags:
            form: "max_view_history"
            validate: "gte=0"
        updates_interval:
          description: >
            is the interval on which to check for new updates.
          x-go-type: time.Duration
          x-oapi-codegen-extra-tags:
            form: "update_interval"
            validate: "gte=0"
    UserMetadata:
      description: >
        contains metadata related to the user's account.
      type: object
      properties:
        blocked:
          description: >
            indicates whether the user is blocked from the app.
          type: boolean
          x-omitzero: false
          x-omitempty: false
          x-go-type-skip-optional-pointer: true
        stripe_customer_id:
          description: >
            is the stripe customer id of the user.

            https://docs.stripe.com/api/customers/object?api-version=2025-11-17.preview#customer_object-id
          type: string
          x-go-name: StripeCustomerID
          x-oapi-codegen-extra-tags:
            validate: 'required'
        stripe_subscription_id:
          description: >
            is the stripe subscription id of the user's plan.

            https://docs.stripe.com/api/subscriptions/object?api-version=2025-11-17.preview#subscription_object-id
          type: string
          x-go-name: StripeSubscriptionID
          x-oapi-codegen-extra-tags:
            validate: 'required'
        plan_status:
          description: >
            is the name current status of the subscription plan.

            Possible values come directly from the Stripe API:

            https://docs.stripe.com/api/subscriptions/object?api-version=2025-11-17.preview#subscription_object-status
          x-go-type: stripe.SubscriptionStatus
          x-go-type-import:
            path: github.com/stripe/stripe-go/v83
          x-oapi-codegen-extra-tags:
            validate: 'required'
        plan:
          description: >
            is the name of the subscription plan that the user is paying for.

            Possible values will come from the product defined in Stripe.
          type: string
          x-oapi-codegen-extra-tags:
            validate: 'required'
        plan_id:
          description: >
            is the unique identifier for the plan.

            Possible values will come from the product defined in Stripe.
          type: string
          x-go-name: PlanID
          x-oapi-codegen-extra-tags:
            validate: 'required'
        cancel_at:
          description: >
            is a date in the future at which the subscription will automatically get canceled.
          x-go-type: time.Time
        trial_end:
          description: >
            is the date when the trial for the subscription ended.
          x-go-type: time.Time
        policies_accepted:
          description: >
            indicates whether the user has accepted the app policies.
          type: boolean
          x-omitzero: false
          x-omitempty: false
          x-go-type-skip-optional-pointer: true
          x-oapi-codegen-extra-tags:
            validate: 'required'
        email_verified:
          description: >
            indicates whether the user has verfied their email address.
          type: boolean
          x-omitzero: false
          x-omitempty: false
          x-go-type-skip-optional-pointer: true
          x-oapi-codegen-extra-tags:
            validate: 'required'
      x-oapi-codegen-extra-tags:
        validate: 'omitempty'
    User:
      description: is a user of the application.
      allOf:
        - $ref: '#/components/schemas/UserCustomisation'
        - type: object
          required:
            - created_at
            - user_id
            - external_user_id
            - provider
            - settings
            - metadata
          properties:
            created_at:
              $ref: '#/components/schemas/CreatedAt'
            updated_at:
              $ref: '#/components/schemas/UpdatedAt'
            last_login:
              description: >
                is the timestamp of when the user last logged in to the app.
              x-go-type: 'time.Time'
            login_count:
              description: >
                is the total number of logins of the user.
              type: integer
            user_id:
              $ref: '#/components/schemas/UserID'
            external_user_id:
              description: >
                is the ID of the user on the external backend that was used to create the account.
              type: string
              x-go-name: ExternalUserID
              x-oapi-codegen-extra-tags:
                validate: 'required'
            provider:
              description: >
                is the backend provider that was used to create the account.
              type: string
              x-oapi-codegen-extra-tags:
                validate: 'required'
            settings:
              $ref: '#/components/schemas/UserSettings'
            metadata:
              $ref: '#/components/schemas/UserMetadata'
            item_favorites:
              description: >
                is the IDs of items (articles) the user has favorited.
              type: array
              items:
                $ref: '#/components/schemas/ItemID'
              x-oapi-codegen-extra-tags:
                validate: 'omitempty,dive,startswith=item_'
              x-go-type-skip-optional-pointer: true
    EditUserRequest:
      description: >
        contains details for editing a user account.
      allOf:
        - $ref: '#/components/schemas/UserCustomisation'
    ChangePasswordRequest:
      description: >
        contains details for changing a user password.
      type: object
      required:
        - new_password
        - new_password_confirm
      properties:
        new_password:
          description: >
            is the new password.
          type: string
          x-oapi-codegen-extra-tags:
            form: 'new_password'
            validate: 'required,eqfield=ConfirmNewPassword'
        confirm_new_password:
          description: >
            is the new password (again), used for confirmation.
          type: string
          x-oapi-codegen-extra-tags:
            form: 'confirm_new_password'
            validate: 'required'
    UserSession:
      description: tracks a user session.
      type: object
      required:
        - token
        - data
        - expiry
      properties:
        token:
          description: the session token for the user.
          type: string
        data:
          description: the encoded session data.
          x-go-type: '[]byte'
        expiry:
          description: the time at which this session token expires.
          x-go-type: time.Time
    ObjectCommon:
      description: contains common fields across objects.
      type: object
      required:
        - source_type
        - title
        - published
      properties:
        published:
          description: >
            is the datetime at which the feed or item was published.
          x-go-type: time.Time
        updated:
          description: >
            is the datetime at which the feed or item was updated.
          x-go-type: time.Time
          x-go-type-skip-optional-pointer: true
        title:
          description: >
            is the title of the feed or item.
          type: string
        description:
          description: >
            is a short summary or description of the feed or item.
          type: string
        url:
          description: >
            is the URL to the webpage for the feed or item. For a feed, this is most likely the webpage the feed is
            sourced from. For an item, this is most likely the webpage containing the full item contents.
          type: string
          x-go-name: URL
          x-oapi-codegen-extra-tags:
            validate: 'omitempty,url'
          x-go-type-skip-optional-pointer: true
        categories:
          description: >
            is a list of categories that define a taxonomy for the feed or item.
          type: array
          items:
            $ref: '#/components/schemas/Category'
          x-oapi-codegen-extra-tags:
            validate: 'omitempty,unique'
          x-go-type-skip-optional-pointer: true
        authors:
          description: >
            is a list of people (names, nicknames and/or emails) who "authored" the object content.
          type: array
          items:
            type: string
          x-go-type-skip-optional-pointer: true
        contributors:
          description: >
            is a list of people (names, nicknames and/or emails) who "contributed" the object content.
          type: array
          items:
            type: string
          x-go-type-skip-optional-pointer: true
        language:
          type: string
          x-go-type-skip-optional-pointer: true
        copyright:
          type: string
          x-go-type-skip-optional-pointer: true
        source_type:
          $ref: '#/components/schemas/SourceType'
        image:
          $ref: '#/components/schemas/RemoteImage'
    Feed:
      description: represents a feed object.
      type: object
      allOf:
        - $ref: '#/components/schemas/ObjectCommon'
        - type: object
          required:
            - feed_id
            - source_urls
            - web_urls
            - created_at
            - last_fetched
            - update_interval
          properties:
            feed_id:
              $ref: '#/components/schemas/FeedID'
            source_urls:
              description: >
                is a list of URLs that point to the feed source. These might be either the website corresponding to the feed or the
              type: array
              items:
                $ref: '#/components/schemas/URL'
              x-go-name: SourceURLs
              x-oapi-codegen-extra-tags:
                validate: 'required,dive,url'
            items:
              description: >
                contains the list of items in the feed.
              type: array
              items:
                $ref: '#/components/schemas/Item'
              x-oapi-codegen-extra-tags:
                json: '-'
              x-go-type-skip-optional-pointer: true
            created_at:
              $ref: '#/components/schemas/CreatedAt'
            last_fetched:
              $ref: '#/components/schemas/LastFetched'
            update_interval:
              description: >
                indicates how often the feed is updated. Where a feed does not supply an actual update interval, this
                value will be derived from the median update interval between published items.
              type: integer
              format: int64
    FeedStatus:
      description: >
        represents the status of fetching the feed.
      type: object
      required:
        - timestamp
        - feed_id
        - url
        - status_code
      properties:
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        feed_id:
          $ref: '#/components/schemas/FeedID'
        url:
          $ref: '#/components/schemas/URL'
        status_code:
          description: >
            is the HTTP status code returned when fetching.
          type: integer
        status_message:
          description: >
            is a message associated with the status code.
          type: string
    Item:
      description: represents an individual item (e.g., an individual feed item).
      type: object
      allOf:
        - $ref: '#/components/schemas/ObjectCommon'
        - type: object
          required:
            - item_id
            - feed_id
            - feed_title
            - Timestamp
          properties:
            Timestamp:
              $ref: '#/components/schemas/Timestamp'
            item_id:
              $ref: '#/components/schemas/ItemID'
            feed_id:
              $ref: '#/components/schemas/FeedID'
            feed_title:
              description: >
                is the title of the feed to which this item belongs.
              type: string
              x-oapi-codegen-extra-tags:
                validate: 'required'
            extension_type:
              description: >
                is the type of extension for this item.
              type: string
              enum:
                - youtube
            extension_data:
              description: >
                contains the embedded extension data.
              oneOf:
                - $ref: '#/components/schemas/ItemExtensionYoutube'
            content:
              description: >
                contains the item content.
              type: string
              x-go-type-skip-optional-pointer: true
    ItemExtensionYoutube:
      description: >
        is an item extension for Youtube videos.
      type: object
      required:
        - video_id
      properties:
        video_id:
          description: >
            is the Youtube video ID for the video.
          type: string
        width:
          description: >
            is the video width.
          type: integer
        height:
          description: >
            is the video height.
          type: integer
    SubscriptionCustomisation:
      description: >
        contains object fields that can be customised (overridden) by a user.
      type: object
      properties:
        nickname:
          description: >
            is an optional alias or label for an object.
          type: string
          x-oapi-codegen-extra-tags:
            form: 'nickname'
            validate: 'omitempty'
        categories:
          description: >
            is a custom list of categories for an object.
          type: array
          items:
            $ref: '#/components/schemas/Category'
          x-oapi-codegen-extra-tags:
            form: 'categories'
            validate: 'omitempty,unique'
          x-go-type-skip-optional-pointer: true
        image_url:
          description: >
            is a custom image to represent the object.
          type: string
          x-go-name: ImageURL
          x-oapi-codegen-extra-tags:
            validate: 'omitzero,url'
      x-oapi-codegen-extra-tags:
        form: 'customisation'
    SubscriptionArticleFilters:
      description: >
        holds filters to apply to the articles within a subscription.
      type: object
      properties:
        text:
          description: >
            is the filters on the title/content to apply.
          type: string
          x-oapi-codegen-extra-tags:
            form: 'text'
        categories:
          description: >
            is the category filters to apply.
          type: string
          x-oapi-codegen-extra-tags:
            form: 'categories'
        authors:
          description: >
            is the author filters to apply.
          type: string
          x-oapi-codegen-extra-tags:
            form: 'authors'
      x-omitempty: false
      x-oapi-codegen-extra-tags:
        form: 'article_filters'
    SubscriptionSettings:
      description: >
        contains options that control how the subscription is stored/displayed.
      type: object
      properties:
        show_full_article_content:
          description: >
            toggles whether articles in the subscription should be always displayed with remote content.
          type: boolean
          x-oapi-codegen-extra-tags:
            form: "show_full_article_content"
          x-omitzero: false
          x-omitempty: false
          x-go-type-skip-optional-pointer: true
      x-oapi-codegen-extra-tags:
        form: 'settings'
    SubscriptionStats:
      description: >
        contains stats about a subscription.
      type: object
      required:
        - avg_daily_updates
        - unread_count
        - last_update
      properties:
        avg_daily_updates:
          description: >
            is the avergage number of articles published per day.
          x-go-type: float64
          x-oapi-codegen-extra-tags:
            json: '-'
            validate: 'gte=0'
        unread_count:
          description: >
            is the value of items that are not explicitly marked unread by the user for this subscription.
          type: integer
          x-oapi-codegen-extra-tags:
            json: '-'
            validate: 'gte=0'
        last_update:
          description: >
            is the timestamp of the most newest item that matches the search.
          x-go-type: time.Time
          x-oapi-codegen-extra-tags:
            json: '-'
            validate: 'required'
      x-oapi-codegen-extra-tags:
        json: '-'
        validate: '-'
    SubscriptionMetadata:
      description: >
        contains common fields across all subscription types.
      type: object
      required:
        - created_at
        - subscription_id
        - user_id
        - type
        - settings
      properties:
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        subscription_id:
          $ref: '#/components/schemas/SubscriptionID'
        user_id:
          $ref: '#/components/schemas/UserID'
        type:
          description: >
            is the type of subscription.
          type: string
          enum: ['feed','search','group','email']
          x-oapi-codegen-extra-tags:
            validate: 'required,oneof=feed search group email'
        customisation:
          $ref: '#/components/schemas/SubscriptionCustomisation'
        settings:
          $ref: '#/components/schemas/SubscriptionSettings'
        favorite:
          description: >
            indicates whether this subscription has been marked as a favorite by the user.
          type: boolean
          x-omitzero: false
          x-omitempty: false
          x-go-type-skip-optional-pointer: true
        marked_read_at:
          description: >
            indicates when the subscription was last marked read. Any articles older than this timestamp are considered
            read, any newer unread.
          x-go-type: time.Time
      x-oapi-codegen-extra-tags:
        validate: 'required'
    FeedSubscription:
      description: >
        represents a feed a user has subscribed to.
      type: object
      required:
        - feed_id
        - url
        - article_states
      properties:
        feed_id:
          $ref: '#/components/schemas/FeedID'
        article_states:
          description: >
            contains the states of items marked explicitly as read/unread/saved by the user.
          x-go-type: 'map[ItemID]ArticleState'
          x-oapi-codegen-extra-tags:
            validate: 'required'
        article_filters:
          $ref: '#/components/schemas/SubscriptionArticleFilters'
      x-oapi-codegen-extra-tags:
