openapi: "3.0.3"
info:
  version: 1.0.0
  title: Common Models
  description: >
    Contains common fields and objects that are shared and reused through the application.
  license:
    name: "AGPL 3.0"
    idenfiier: AGPL-3.0-or-later
  contact:
    name: "Immanent Tech"
components:
  schemas:
    # Common Fields.
    Timestamp:
      description: is when the document was created.
      x-go-type: "time.Time"
      x-oapi-codegen-extra-tags:
        json: "@timestamp"
        validate: "required"
    CreatedAt:
      description: records when the object was created in the database.
      x-go-type: "time.Time"
      x-oapi-codegen-extra-tags:
        json: "created_at"
        validate: "required"
    UpdatedAt:
      description: records when the object was last updated in the database.
      x-go-type: "time.Time"
      x-oapi-codegen-extra-tags:
        json: "updated_at,omitempty"
        validate: "omitnil"
    DeletedAt:
      description: records when the object was deleted.
      x-go-type: "time.Time"
      x-oapi-codegen-extra-tags:
        json: "deleted_at,omitempty"
        validate: "omitnil"
      deprecated: true
    LastFetched:
      description: >
        indicates when an object was last fetched.
      x-go-type: time.Time
      x-oapi-codegen-extra-tags:
        json: "last_fetched,omitempty"
    URL:
      description: is a URL.
      type: string
      x-go-name: URL
      x-oapi-codegen-extra-tags:
        validate: "omitempty,url"
        json: "url"
        form: "url"
    RemoteImage:
      description: >
        contains details about a remote image.
      type: object
      properties:
        title:
          description: >
            the description of the image
          type: string
        url:
          $ref: "#/components/schemas/URL"
    Author:
      description: >
        represents a person who contributed to a feed or item.
      type: object
      required:
        - name
      properties:
        name:
          description: >
            is the name of the person. Can be any combination of first name and last name, in any order.
          type: string
        url:
          $ref: "#/components/schemas/URL"
        email:
          description: is an email address.
          type: string
          x-oapi-codegen-extra-tags:
            validate: "omitempty,email"
    Mark:
      description: >
        applies the given mark action to objects.
      type: string
      enum: ["read", "unread"]
      x-oapi-codegen-extra-tags:
        form: "mark"
        validate: "oneof=read unread"
    State:
      description: >
        Tracks the state of an object.
      type: string
      enum: ["read", "unread", "saved"]
      default: "unread"
      x-oapi-codegen-extra-tags:
        json: "state"
        validate: "oneof=read unread saved"
    FeedID:
      description: is the unique ID of a feed.
      type: string
      x-go-name: FeedID
      x-oapi-codegen-extra-tags:
        validate: "required,startswith=feed_"
        json: "feed_id"
        form: "feed_id"
    ItemID:
      description: is the unique ID of an item.
      type: string
      x-go-name: ItemID
      x-oapi-codegen-extra-tags:
        validate: "required,startswith=item_"
        json: "item_id"
        form: "item_id"
    SubscriptionID:
      description: is the unique ID of a subscription.
      type: string
      x-go-name: SubscriptionID
      x-oapi-codegen-extra-tags:
        validate: "required,startswith=sub_"
        json: "subscription_id"
        form: "subscription_id"
    EmailSenderID:
      description: >
        is an email address that sends emails.
      type: string
      x-go-name: EmailSenderID
      x-oapi-codegen-extra-tags:
        form: "email_sender_id"
        validate: "required,email"
    ObjectID:
      description: represents an ID of any user-facing object.
      type: string
      x-go-name: ObjectID
      x-oapi-codegen-extra-tags:
        validate: "required,startswith=sub_|startswith=item_"
        json: "id"
        form: "id"
    ObjectType:
      description: represents the type of any user-facing object.
      type: string
      enum: ["subscription", "article"]
      x-oapi-codegen-extra-tags:
        validate: "required,oneof=subscription article"
        json: "object"
        form: "object"
    SourceType:
      description: >
        indicates what type of source the object came from.
      type: string
      enum: ["RSS", "Atom", "JSONFeed", "Email"]
    UserID:
      description: is the unique ID of a user.
      type: string
      x-go-name: UserID
      x-oapi-codegen-extra-tags:
        json: "user_id"
        validate: "required,startswith=user_"
        form: "user_id"
    Nickname:
      description: >
        is an optional friendly name.
      type: string
      x-oapi-codegen-extra-tags:
        form: "nickname"
    StoredImage:
      description: >
        is an image stored locally (i.e., the binary data to represent the image).
      type: object
      required:
        - data
      properties:
        data:
          x-go-type: image.Image
    Category:
      description: >
        represents a taxonomy applied to an object.
      type: string
      x-oapi-codegen-extra-tags:
        form: "category"
    CategoryCount:
      description: >
        holds a category and the count of its occurence. The count will be
        contextual. i.e., across subscriptions, items, etc.
      type: object
      required:
        - category
        - count
      properties:
        category:
          $ref: "#/components/schemas/Category"
        count:
          type: integer
          minimum: 0
    Count:
      description: >
        is the count of items to retrieve with a request.
      type: integer
      default: "10"
      x-oapi-codegen-extra-tags:
        form: "count"
        validate: "gt=0,lt=20"
    View:
      description: >
        The state of objects to view.
      type: string
      enum: ["read", "unread", "all"]
      default: "unread"
      x-oapi-codegen-extra-tags:
        validate: "required,oneof=read unread all"
        form: "view"
    Pagination:
      description: contains data for paginating through results.
      type: string
      x-oapi-codegen-extra-tags:
        form: "pagination"
        validate: "omitempty,url_encoded"
    Sort:
      description: is how a list of objects is sorted.
      type: string
      enum:
        [
          "newest_first",
          "oldest_first",
          "most_unread",
          "least_unread",
          "most_relevant",
        ]
      x-oapi-codegen-extra-tags:
        form: "sort"
        validate: "required,oneof=newest_first oldest_first most_unread least_unread most_relevant"
    # Objects.
    UserCustomisation:
      description: >
        contains account fields that a user can customize.
      type: object
      required:
        - nickname
        - email
      properties:
        nickname:
          description: >
            is a nickname for the user.
          type: string
          x-oapi-codegen-extra-tags:
            form: "nickname"
            validate: "required"
        email:
          description: >
            is the email address of the user.
          type: string
          x-oapi-codegen-extra-tags:
            form: "email"
            validate: "required,email"
        avatar_url:
          description: >
            is a link to an image file to user as an avatar for the user.
          type: string
          x-go-name: AvatarURL
          x-oapi-codegen-extra-tags:
            form: "avatar_url"
            validate: "omitempty,url"
        promotional_email:
          description: >
            is a flag indicating whether the user is accepting promotional (non-account/administrative) emails.
          type: boolean
          x-omitzero: false
          x-omitempty: false
          x-go-type-skip-optional-pointer: true
          x-oapi-codegen-extra-tags:
            validate: "required"
            form: "promotional_email"
    UserSettings:
      description: >
        contains user-specific settings for the application.
      type: object
      required:
        - show_onboarding
        - show_subscription_stats
        - mark_article_read_on_view
        - max_view_history
        - updates_interval
      properties:
        show_onboarding:
          description: >
            indicates whether to show onboarding information (i.e., for a new user).
          type: boolean
          default: true
          x-oapi-codegen-extra-tags:
            form: "-"
          x-omitzero: false
          x-omitempty: false
          x-go-type-skip-optional-pointer: true
        show_subscription_stats:
          description: >
            indicates whether various subscription stats (e.g., unread counts, articles/day, etc.) should be shown.
          type: boolean
          x-oapi-codegen-extra-tags:
            form: "show_subscription_stats"
          x-omitzero: false
          x-omitempty: false
          x-go-type-skip-optional-pointer: true
        mark_article_read_on_view:
          description: >
            indicates whether to automatically mark an article as read when viewed.
          type: boolean
          default: true
          x-oapi-codegen-extra-tags:
            form: "mark_article_read_on_view"
          x-omitzero: false
          x-omitempty: false
          x-go-type-skip-optional-pointer: true
        subscription_email:
          description: >
            is an email address the user can use to subscribe to email newsletters.
          type: string
          x-oapi-codegen-extra-tags:
            form: "subscription_email"
            validate: "omitempty,email"
        max_view_history:
          description: >
            is a user-specified limit on how far back in time to view articles.
          x-go-type: time.Duration
          x-oapi-codegen-extra-tags:
            form: "max_view_history"
            validate: "gte=0"
        updates_interval:
          description: >
            is the interval on which to check for new updates.
          x-go-type: time.Duration
          x-oapi-codegen-extra-tags:
            form: "update_interval"
            validate: "gte=0"
    UserLimit:
      description: >
        represents details about a user account limit
      type: object
      required:
        - exceeded
        - timestamp
      properties:
        exceeded:
          description: indicates whether this limit has been exceeded.
          type: boolean
          x-omitzero: false
          x-omitempty: false
          x-go-type-skip-optional-pointer: true
        timestamp:
          description: is the timestamp when the limit was last changed.
          x-go-type: time.Time
    UserMetadata:
      description: >
        contains metadata related to the user's account.
      type: object
      properties:
        blocked:
          description: >
            indicates whether the user is blocked from the app.
          type: boolean
          x-omitzero: false
          x-omitempty: false
          x-go-type-skip-optional-pointer: true
        policies_accepted:
          description: >
            indicates whether the user has accepted the app policies.
          type: boolean
          x-omitzero: false
          x-omitempty: false
          x-go-type-skip-optional-pointer: true
          x-oapi-codegen-extra-tags:
            validate: "required"
        promotional_email:
          description: >
            is a flag indicating whether the user is accepting promotional (non-account/administrative) emails.
          type: boolean
          x-omitzero: false
          x-omitempty: false
          x-go-type-skip-optional-pointer: true
          x-oapi-codegen-extra-tags:
            validate: "required"
        email_verified:
          description: >
            indicates whether the user has verfied their email address.
          type: boolean
          x-omitzero: false
          x-omitempty: false
          x-go-type-skip-optional-pointer: true
          x-oapi-codegen-extra-tags:
            validate: "required"
        pending_deletion:
          description: >
            indicates whether the user account is pending deletion.
          type: boolean
          x-omitzero: true
          x-omitempty: true
        subscription_limit:
          $ref: "#/components/schemas/UserLimit"
        newsletter_limit:
          $ref: "#/components/schemas/UserLimit"
    PaddleSubscription:
      description: >
        contains details about the user's paid subscription.
      type: object
      required:
        - customer_id
        - subscription_id
        - subscription_name
        - subscription_status
        - price_id
        - price_name
        - updated_at
      properties:
        customer_id:
          description: >
            is the ID of the customer in the Paddle backend.
          type: string
          x-go-name: CustomerID
          x-oapi-codegen-extra-tags:
            validate: "required"
        subscription_id:
          description: >
            is the unique identifier for the user's subscription.
          type: string
          x-go-name: SubscriptionID
          x-oapi-codegen-extra-tags:
            validate: "required"
        subscription_name:
          description: >
            is the name of the subscription the user purchased.
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required"
        subscription_status:
          description: >
            is the name current status of the subscription plan.
          x-go-type: string
          x-oapi-codegen-extra-tags:
            validate: "required"
        price_id:
          description: >
            is the ID of the price that the customer paid for their subscription.
          x-go-name: PriceID
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required"
        price_name:
          description: >
            is the name of price for the subscription.
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required"
        current_period_start:
          description: >
            is when the current billing period for the user's subscription started. Derived from
            subscription.current_billing_period.starts_at.
          x-go-type: time.Time
        current_period_end:
          description: >
            is when the current billing period for the user's subscription will end. Derived from
            subscription.current_billing_period.ends_at
          x-go-type: time.Time
        cancelled_at:
          description: >
            is when the user's subscription will cancel. Derived from subscription.scheduled_change.action == "cancel".
          x-go-type: time.Time
        trial_end:
          description: >
            is when the user's trial will end. Derived from subscription.next_billed_at.
          x-go-type: time.Time
        updated_at:
          $ref: "#/components/schemas/UpdatedAt"
    User:
      description: is a user of the application.
      allOf:
        - $ref: "#/components/schemas/UserCustomisation"
        - type: object
          required:
            - created_at
            - user_id
            - external_user_id
            - provider
            - login_count
            - last_login
            - settings
            - metadata
          properties:
            created_at:
              $ref: "#/components/schemas/CreatedAt"
            updated_at:
              $ref: "#/components/schemas/UpdatedAt"
            user_id:
              $ref: "#/components/schemas/UserID"
            external_user_id:
              description: >
                is the ID of the user on the external backend that was used to create the account.
              type: string
              x-go-name: ExternalUserID
              x-oapi-codegen-extra-tags:
                validate: "required"
            provider:
              description: >
                is the backend provider that was used to create the account.
              type: string
              x-oapi-codegen-extra-tags:
                validate: "required"
            last_login:
              description: >
                is the timestamp of when the user last logged in to the app.
              x-go-type: "time.Time"
            login_count:
              description: >
                is the total number of logins of the user.
              type: integer
            settings:
              $ref: "#/components/schemas/UserSettings"
            metadata:
              $ref: "#/components/schemas/UserMetadata"
            subscription:
              $ref: "#/components/schemas/PaddleSubscription"
            item_favorites:
              description: >
                is the IDs of items (articles) the user has favorited.
              type: array
              items:
                $ref: "#/components/schemas/ItemID"
              x-oapi-codegen-extra-tags:
                validate: "omitempty,dive,startswith=item_"
              x-go-type-skip-optional-pointer: true
    EditUserRequest:
      description: >
        contains details for editing a user account.
      allOf:
        - $ref: "#/components/schemas/UserCustomisation"
    ChangePasswordRequest:
      description: >
        contains details for changing a user password.
      type: object
      required:
        - new_password
        - new_password_confirm
      properties:
        new_password:
          description: >
            is the new password.
          type: string
          x-oapi-codegen-extra-tags:
            form: "new_password"
            validate: "required,eqfield=ConfirmNewPassword"
        confirm_new_password:
          description: >
            is the new password (again), used for confirmation.
          type: string
          x-oapi-codegen-extra-tags:
            form: "confirm_new_password"
            validate: "required"
    UserSession:
      description: tracks a user session.
      type: object
      required:
        - token
        - data
        - expiry
      properties:
        token:
          description: the session token for the user.
          type: string
        data:
          description: the encoded session data.
          x-go-type: "[]byte"
        expiry:
          description: the time at which this session token expires.
          x-go-type: time.Time
    ObjectCommon:
      description: contains common fields across objects.
      type: object
      required:
        - source_type
        - title
        - published
      properties:
        published:
          description: >
            is the datetime at which the feed or item was published.
          x-go-type: time.Time
        updated:
          description: >
            is the datetime at which the feed or item was updated.
          x-go-type: time.Time
        title:
          description: >
            is the title of the feed or item.
          type: string
        description:
          description: >
            is a short summary or description of the feed or item.
          type: string
        url:
          description: >
            is the URL to the webpage for the feed or item. For a feed, this is most likely the webpage the feed is
            sourced from. For an item, this is most likely the webpage containing the full item contents.
          type: string
          x-go-name: URL
          x-oapi-codegen-extra-tags:
            validate: "omitempty,url"
          x-go-type-skip-optional-pointer: true
        categories:
          description: >
            is a list of categories that define a taxonomy for the feed or item.
          type: array
          items:
            $ref: "#/components/schemas/Category"
          x-oapi-codegen-extra-tags:
            validate: "omitempty,unique"
          x-go-type-skip-optional-pointer: true
        authors:
          description: >
            is a list of people (names, nicknames and/or emails) who "authored" the object content.
          type: array
          items:
            type: string
          x-go-type-skip-optional-pointer: true
        contributors:
          description: >
            is a list of people (names, nicknames and/or emails) who "contributed" the object content.
          type: array
          items:
            type: string
          x-go-type-skip-optional-pointer: true
        language:
          type: string
        copyright:
          type: string
        source_type:
          $ref: "#/components/schemas/SourceType"
        image:
          $ref: "#/components/schemas/RemoteImage"
    Feed:
      description: represents a feed object.
      type: object
      allOf:
        - $ref: "#/components/schemas/ObjectCommon"
        - type: object
          required:
            - feed_id
            - source_urls
            - web_urls
            - created_at
            - last_fetched
            - update_interval
            - fetch_method
          properties:
            feed_id:
              $ref: "#/components/schemas/FeedID"
            source_urls:
              description: >
                is a list of URLs that point to the feed source. These might be either the website corresponding to the feed or the
              type: array
              items:
                $ref: "#/components/schemas/URL"
              x-go-name: SourceURLs
              x-oapi-codegen-extra-tags:
                validate: "required,dive,url"
            items:
              description: >
                contains the list of items in the feed.
              type: array
              items:
                x-go-type: "*Item"
                # $ref: '#/components/schemas/Item'
              x-oapi-codegen-extra-tags:
                json: "-"
              x-go-type-skip-optional-pointer: true
            created_at:
              $ref: "#/components/schemas/CreatedAt"
            last_fetched:
              $ref: "#/components/schemas/LastFetched"
            update_interval:
              description: >
                indicates how often the feed is updated. Where a feed does not supply an actual update interval, this
                value will be derived from the median update interval between published items.
              type: integer
              format: int64
            fetch_method:
              description: >
                defines how this feed should be fetched.
              type: string
              enum: ["direct", "proxied", "zyte-products", "zyte-articles"]
              x-oapi-codegen-extra-tags:
                validate: "required,oneof=direct proxied zyte-products zyte-articles"
            quirks:
              $ref: "#/components/schemas/FeedQuirks"
    FeedQuirks:
      description: >
        contains data on quirks for a feed.
      type: object
      properties:
        no_image:
          description: >
            when set to true, indicates that the feed has no discoverable image, either in its source or on the website
            that it represents. Setting this quirk to true will stop any logic that tries to update the feed image.
          type: boolean
    FeedStatus:
      description: >
        represents the status of fetching the feed.
      type: object
      required:
        - timestamp
        - feed_id
        - url
        - status_code
      properties:
        timestamp:
          $ref: "#/components/schemas/Timestamp"
        feed_id:
          $ref: "#/components/schemas/FeedID"
        items:
          description: >
            is a list of IDs of items that were added.
          type: array
          items:
            $ref: "#/components/schemas/ItemID"
          x-go-type-skip-optional-pointer: true
        url:
          $ref: "#/components/schemas/URL"
        status_code:
          description: >
            is the HTTP status code returned when fetching.
          type: integer
        status_message:
          description: >
            is a message associated with the status code.
          type: string
    Item:
      description: represents an individual item (e.g., an individual feed item).
      type: object
      allOf:
        - $ref: "#/components/schemas/ObjectCommon"
        - type: object
          required:
            - item_id
            - feed_id
            - feed_title
            - Timestamp
          properties:
            Timestamp:
              $ref: "#/components/schemas/Timestamp"
            item_id:
              $ref: "#/components/schemas/ItemID"
            feed_id:
              $ref: "#/components/schemas/FeedID"
            feed_title:
              description: >
                is the title of the feed to which this item belongs.
              type: string
              x-oapi-codegen-extra-tags:
                validate: "required"
            extension_type:
              description: >
                is the type of extension for this item.
              type: string
              enum:
                - youtube
            extension_data:
              description: >
                contains the embedded extension data.
              oneOf:
                - $ref: "#/components/schemas/ItemExtensionYoutube"
            content:
              description: >
                contains the item content.
              type: string
    ItemExtensionYoutube:
      description: >
        is an item extension for Youtube videos.
      type: object
      required:
        - video_id
      properties:
        video_id:
          description: is the Youtube video ID for the video.
          type: string
        width:
          description: is the video width.
          type: integer
        height:
          description: is the video height.
          type: integer
        statistics:
          $ref: "#/components/schemas/YoutubeVideoStatistics"
        duration:
          description: is the length of the video.
          x-go-type: time.Duration
    YoutubeVideoStatistics:
      description: >
        contains statistics about a Youtube video.
      type: object
      properties:
        comment_count:
          description: is the number of comments for the video.
          type: integer
          format: int64
        dislike_count:
          description: >
            is the number of users who have indicated that they disliked the video by giving it a negative rating.
          type: integer
          format: int64
        favorite_count:
          description: >
            is the number of users who currently have the video marked as a favorite video.
          type: integer
          format: int64
        like_count:
          description: >
            is the number of users who have indicated that they liked the video
          type: integer
          format: int64
        view_count:
          description: >
            is the number of times the video has been viewed.
          type: integer
          format: int64
    SubscriptionCustomisation:
      description: >
        contains object fields that can be customised (overridden) by a user.
      type: object
      properties:
        nickname:
          description: >
            is an optional alias or label for an object.
          type: string
          x-oapi-codegen-extra-tags:
            form: "nickname"
            validate: "omitempty"
        categories:
          description: >
            is a custom list of categories for an object.
          type: array
          items:
            $ref: "#/components/schemas/Category"
          x-oapi-codegen-extra-tags:
            form: "categories"
            validate: "omitempty,unique"
          x-go-type-skip-optional-pointer: true
        image_url:
          description: >
            is a custom image to represent the object.
          type: string
          x-go-name: ImageURL
          x-oapi-codegen-extra-tags:
            validate: "omitzero,url"
      x-oapi-codegen-extra-tags:
        form: "customisation"
    SubscriptionArticleFilters:
      description: >
        holds filters to apply to the articles within a subscription.
      type: object
      properties:
        text:
          description: >
            is the filters on the title/content to apply.
          type: string
