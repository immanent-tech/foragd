#:schema https://json.schemastore.org/any.json

# Working directory
# . or absolute path, please note that the directories following must be under root.
root      = "."
tmp_dir   = "tmp"
env_files = [".devcontainer/.env", ".env.development"]

[build]
# Add additional arguments when running binary (bin/full_bin). Will run './tmp/main hello world'.
args_bin = [
  "--no-log-file",
  "--profile='heapprofile=.devcontainer/data/scheduler-heap.prof;cpuprofile=.devcontainer/data/scheduler-cpu.prof;webui=true'",
  "scheduler",
  "run",
]
# Just plain old shell command. You could use `make` as well.
cmd = 'go build -o ./tmp/scheduler .'
# Binary file yields from 'cmd', will be deprecated soon, recommend using entrypoint.
bin = "tmp/scheduler"
# Entrypoint binary relative to root. First item is the executable, more items are default arguments.
entrypoint = ["./tmp/scheduler"]
# Customize binary, can setup environment variables when run your app.
full_bin = "./tmp/scheduler"
# Ignore these filename extensions or directories.
exclude_dir = [
  "cli",
  "config",
  "deployments",
  "logging",
  "magefiles",
  "models/generate",
  "node_modules",
  "providers",
  "server",
  "test",
  "tmp",
  "validation",
  "web",
  "email",
  "android",
  "oneshots",
]
# Ignore these filename extensions or directories.
include_dir = ["scheduler", "models", "service", "pkg"]
# Exclude specific regular expressions.
exclude_regex = ["_test\\.go", "_templ\\.go"]
# Exclude unchanged files.
exclude_unchanged = true
# Follow symlink for directories
follow_symlink = true
# Watch these filename extensions.
include_ext = ["go", "templ", "html", "json", "js", "ts", "css", "scss"]
# This log file is placed in your tmp_dir.
log = "scheduler.air.log"
# Array of commands to run after ^C
# post_cmd = ["echo 'hello air' > post_cmd.txt"]
# Watch these directories if you specified.
# include_dir = []
# Watch these files.
# include_file = []
# Exclude files.
# exclude_file = []
# Poll files for changes instead of using fsnotify.
poll = false
# Poll interval (defaults to the minimum interval of 500ms).
poll_interval = 500 # ms
# It's not necessary to trigger build each time file changes if it's too frequent.
delay = 200 # ms
# Stop running old binary when build errors occur.
stop_on_error = true
# Send Interrupt signal before killing process (windows does not support this feature)
send_interrupt = true
# Delay after sending Interrupt signal
kill_delay = 15000000000 # nanosecond
# Rerun binary or not
rerun = false
# Delay after each execution
rerun_delay = 500

[log]
# Show log time
time = false
# Only show main log (silences watcher, build, runner)
main_only = false
# silence all logs produced by air
silent = false

[color]
# Customize each part's color. If no color found, use the raw app log.
main    = "magenta"
watcher = "cyan"
build   = "yellow"
runner  = "green"

[misc]
# Delete tmp directory on exit
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll      = true

[proxy]
# Enable live-reloading on the browser.
enabled    = false
proxy_port = 8090
app_port   = 8080
