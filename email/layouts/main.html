<!DOCTYPE [[[ page.doctype || 'html' ]]]>
<html
  lang="[[ page.language || 'en' ]]"
  xmlns:v="urn:schemas-microsoft-com:vml"
>
  <head>
    <meta charset="[[ page.charset || 'utf-8' ]]" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="format-detection"
      content="telephone=no, date=no, address=no, email=no, url=no"
    />
    <if condition="page.title">
      <title>[[[ page.title ]]]</title>
    </if>
    <link
      rel="preload"
      href="/content/fonts/inter/InterVariable.woff2"
      crossorigin
      as="font"
    />
    <link
      rel="preload"
      href="/content/fonts/tex-gyre/pagella/texgyrepagella-bold.woff2"
      crossorigin
      as="font"
    />
    <link
      rel="preload"
      href="/content/fonts/nunito/nunito-v32-latin-600.woff2"
      crossorigin
      as="font"
    />
    <link
      rel="preload"
      href="/content/fonts/nunito/nunito-v32-latin-700.woff2"
      crossorigin
      as="font"
    />
    <link rel="stylesheet" href="/content/fonts/inter/inter.css" />
    <link rel="stylesheet" href="/content/fonts/tex-gyre/pagella/pagella.css" />
    <link rel="stylesheet" href="/content/fonts/nunito/nunito.css" />
    <style>
      @tailwind components;
      @tailwind utilities;

      img {
        @apply mx-auto flex align-middle;
      }
      a {
        @apply text-primary;
      }
      a:visited {
        @apply text-neutral;
      }
    </style>
    <stack name="head" />
  </head>
  <body
    class="font-inter [[ page.bodyClass || '' ]] m-0 w-full bg-base-100 p-0 [word-break:break-word] [-webkit-font-smoothing:antialiased]"
  >
    <if condition="page.preheader">
      <div class="hidden">
        [[[ page.preheader ]]]
        <each loop="item in Array.from(Array(150))"
          >&#8199;&#65279;&#847;
        </each>
      </div>
    </if>
    <x-header align="text-left" />
    <div
      role="article"
      aria-roledescription="email"
      aria-label="[[[ page.title || '' ]]]"
      lang="[[ page.language || 'en' ]]"
      class="mx-auto prose py-12 text-base-content"
    >
      <yield />
    </div>
    <x-footer />
  </body>
</html>
