<script props>
  const gap = props.gap ?? true;
  const flush = props.flush;
  const reverse = props.reverse;

  /**
   * Calculate column widths based on `gap` and `flush` props
   */
  col1WidthClass = () => {
    if (flush && !gap) return "w-[438px]";
    if (flush && gap) return "w-[426px]";
    if (!flush && !gap) return "w-[414px]";

    // With gap and not flush
    return "w-[402px]";
  };

  const col2WidthClass = () => {
    if (flush && !gap) return "w-[162px]";
    if (flush && gap) return "w-[150px]";
    if (!flush && !gap) return "w-[138px]";

    return "w-[126px]";
  };

  module.exports = {
    containerClasses: props["container-class"] || "",
    gap,
    flush,
    reverse,
    col1WidthClass: col1WidthClass(),
    col2WidthClass: col2WidthClass(),
  };
</script>

<table class="w-full">
  <tr>
    <td>&zwj;</td>
    <td class="[[ containerClasses ]] w-[600px] max-w-full">
      <table class="w-full">
        <tr>
          <td class="[[ flush ? '' : 'p-0 px-6' ]]">
            <x-spacer height="44px" />

            <table class="w-full">
              <tr class="[[ reverse ? 'sm:w-full sm:table' : '' ]]">
                <td
                  class="[[ col1WidthClass ]] [[ reverse ? 'sm:table-footer-group' : 'sm:w-full sm:block' ]]"
                >
                  <if condition="reverse">
                    <div class="sm:w-full">
                      <slot:col-1>3/4</slot:col-1>
                    </div>
                  </if>
                  <else>
                    <slot:col-1>3/4</slot:col-1>
                  </else>
                </td>
                <if condition="gap">
                  <td
                    class="[[ reverse ? 'sm:table-footer-group' : 'sm:w-full sm:block' ]] w-6 leading-6"
                  >
                    &zwj;
                  </td>
                </if>
                <td
                  class="[[ col2WidthClass ]] [[ reverse ? 'sm:table-header-group' : 'sm:w-full sm:block' ]]"
                >
                  <if condition="reverse">
                    <div class="sm:w-full">
                      <slot:col-2>1/4</slot:col-2>
                    </div>
                  </if>
                  <else>
                    <slot:col-2>1/4</slot:col-2>
                  </else>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
    <td>&zwj;</td>
  </tr>
</table>
