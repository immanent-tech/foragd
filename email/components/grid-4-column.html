<script props>
  const gap = props.gap ?? true;
  const flush = props.flush;
  const reverse = props.reverse;

  /**
   * Calculate column width based on `gap` and `flush` props
   */
  const colWidthClass = () => {
    if (flush && !gap) return "w-[138px]";
    if (flush && gap) return "w-[132px]";
    if (!flush && !gap) return "w-[150px]";

    // With gap and not flush
    return "w-[120px]";
  };

  module.exports = {
    containerClasses: props["container-class"] || "",
    gap,
    flush,
    reverse,
    colWidthClass: colWidthClass(),
  };
</script>

<table class="w-full">
  <tr>
    <td>&zwj;</td>
    <td class="[[ containerClasses ]] w-[600px] max-w-full">
      <table class="w-full">
        <tr>
          <td class="[[ flush ? '' : 'p-0 px-6' ]]">
            <x-spacer height="44px" />

            <table class="w-full">
              <tr class="[[ reverse ? 'sm:w-full sm:table' : '' ]]">
                <td
                  class="[[ colWidthClass ]] [[ reverse ? 'sm:table-footer-group' : 'sm:w-full sm:block' ]]"
                >
                  <slot:col-1>Column 1</slot:col-1>
                </td>
                <if condition="gap">
                  <td
                    class="[[ reverse ? 'sm:hidden' : 'sm:w-full sm:block' ]] w-6 leading-6"
                  >
                    &zwj;
                  </td>
                </if>
                <td
                  class="[[ colWidthClass ]] [[ reverse ? 'sm:table-footer-group' : 'sm:w-full sm:block' ]]"
                >
                  <div class="[[ gap ? 'sm:mb-6' : '' ]]">
                    <slot:col-2>Column 2</slot:col-2>
                  </div>
                </td>
                <if condition="gap">
                  <td
                    class="[[ reverse ? 'sm:hidden' : 'sm:w-full sm:block' ]] w-6 leading-6"
                  >
                    &zwj;
                  </td>
                </if>
                <td
                  class="[[ colWidthClass ]] [[ reverse ? 'sm:table-header-group' : 'sm:w-full sm:block' ]]"
                >
                  <div class="[[ gap ? 'sm:mb-6' : '' ]]">
                    <slot:col-3>Column 3</slot:col-3>
                  </div>
                </td>
                <if condition="gap">
                  <td
                    class="[[ reverse ? 'sm:hidden' : 'sm:w-full sm:block' ]] w-6 leading-6"
                  >
                    &zwj;
                  </td>
                </if>
                <td
                  class="[[ colWidthClass ]] [[ reverse ? 'sm:table-caption' : 'sm:block' ]] sm:w-full"
                >
                  <div class="[[ gap ? 'sm:mb-6' : '' ]]">
                    <slot:col-4>Column 4</slot:col-4>
                  </div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
    <td>&zwj;</td>
  </tr>
</table>
