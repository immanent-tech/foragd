metricbeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

metricbeat.modules:
- module: elasticsearch
  xpack.enabled: true
  period: 10s
  hosts:
    - https://es01:9200
    - https://es02:9200
    - https://es03:9200
  ssl.certificate_authorities: "config/certs/ca/ca.crt"
  ssl.certificate: "config/certs/es01/es01.crt"
  ssl.key: "config/certs/es01/es01.key"
  username: ${ELASTIC_USER}
  password: ${ELASTIC_PASSWORD}
  ssl.enabled: true

- module: kibana
  metricsets:
    - stats
  period: 10s
  hosts: http://kibana:5601
  ssl.certificate_authorities: "config/certs/ca/ca.crt"
  ssl.certificate: "config/certs/es01/es01.crt"
  ssl.key: "config/certs/es01/es01.key"
  ssl.enabled: true
  username: ${ELASTIC_USER}
  password: ${ELASTIC_PASSWORD}
  xpack.enabled: true

- module: docker
  metricsets:
    - "container"
    - "cpu"
    - "diskio"
    - "healthcheck"
    - "info"
    #- "image"
    - "memory"
    - "network"
  hosts: ["unix:///var/run/docker.sock"]
  period: 10s
  enabled: true

processors:
  - add_host_metadata: ~
  - add_docker_metadata: ~

output.elasticsearch:
  hosts:
    - https://es01:9200
    - https://es02:9200
    - https://es03:9200
  username: ${ELASTIC_USER}
  password: ${ELASTIC_PASSWORD}
  ssl:
    certificate: "config/certs/es01/es01.crt"
    certificate_authorities: "config/certs/ca/ca.crt"
    key: "config/certs/es01/es01.key"
