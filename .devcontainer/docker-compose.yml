version: "3.8"
services:
  devcontainer:
    build:
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - /etc/localtime:/etc/localtime:ro,cached
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock
    command: sleep infinity
    user: vscode

  setup:
    environment:
      ELASTIC_PASSWORD: gofeedme
      KIBANA_PASSWORD: gofeedme
    image: docker.elastic.co/elasticsearch/elasticsearch:$STACK_VERSION
    volumes:
      - ../deployments/elasticsearch/certs:/usr/share/elasticsearch/config/certs
    command: |
      bash -c '
              if [ x$${ELASTIC_PASSWORD} == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
          exit 1;
        elif [ x$${KIBANA_PASSWORD} == x ]; then
          echo "Set the KIBANA_PASSWORD environment variable in the .env file";
          exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          echo -ne \
          "instances:\n"\
          "  - name: es01\n"\
          "    dns:\n"\
          "      - es01\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "  - name: es02\n"\
          "    dns:\n"\
          "      - es02\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "  - name: es03\n"\
          "    dns:\n"\
          "      - es03\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        # echo "Setting file permissions"
        # chown -R root:root config/certs;
        # find . -type d -exec chmod 750 \{\} \;;
        # find . -type f -exec chmod 640 \{\} \;;
        echo "Waiting for Elasticsearch availability";
        until curl -s --cacert config/certs/ca/ca.crt https://es01:9200 | grep -q "missing authentication credentials"; do sleep 30; done;
        echo "Setting kibana_system password";
        until curl -s -X POST --cacert config/certs/ca/ca.crt -u "elastic:$${ELASTIC_PASSWORD}" -H "Content-Type: application/json" https://es01:9200/_security/user/kibana_system/_password -d "{\"password\":\"$${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 10; done;        
        echo "All done!";
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/es01/es01.crt ]"]
      interval: 1s
      timeout: 5s
      retries: 120

  es01:
    depends_on:
      setup:
        condition: service_healthy
    hostname: es01
    image: docker.elastic.co/elasticsearch/elasticsearch:$STACK_VERSION
    volumes:
      - ../deployments/elasticsearch/certs:/usr/share/elasticsearch/config/certs
      - ../deployments/elasticsearch/esdata01:/usr/share/elasticsearch/data
      - ../deployments/elasticsearch/eslogs01:/var/log/elasticsearch
    ports:
      - 9200:9200
    environment:
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
      - node.name=es01
      - cluster.name=go-feed-me
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es02,es03
      - ELASTIC_PASSWORD=gofeedme
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es01/es01.key
      - xpack.security.http.ssl.certificate=certs/es01/es01.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es01/es01.key
      - xpack.security.transport.ssl.certificate=certs/es01/es01.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=basic
      - cluster.routing.allocation.disk.watermark.low=0.95
      - cluster.routing.allocation.disk.watermark.high=0.98
      - cluster.routing.allocation.disk.watermark.flood_stage=0.99
    mem_limit: 6442450944
    oom_kill_disable: true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120
    labels:
      - co.elastic.logs/module=elasticsearch

  es02:
    depends_on:
      - es01
    hostname: es02
    image: docker.elastic.co/elasticsearch/elasticsearch:$STACK_VERSION
    volumes:
      - ../deployments/elasticsearch/certs:/usr/share/elasticsearch/config/certs
      - ../deployments/elasticsearch/esdata02:/usr/share/elasticsearch/data
      - ../deployments/elasticsearch/eslogs02:/var/log/elasticsearch
    environment:
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
      - node.name=es02
      - cluster.name=go-feed-me
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es01,es03
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es02/es02.key
      - xpack.security.http.ssl.certificate=certs/es02/es02.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es02/es02.key
      - xpack.security.transport.ssl.certificate=certs/es02/es02.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=basic
      - cluster.routing.allocation.disk.watermark.low=0.95
      - cluster.routing.allocation.disk.watermark.high=0.98
      - cluster.routing.allocation.disk.watermark.flood_stage=0.99
    mem_limit: 6442450944
    oom_kill_disable: true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120
    labels:
      - co.elastic.logs/module=elasticsearch

  es03:
    depends_on:
      - es02
    hostname: es03
    image: docker.elastic.co/elasticsearch/elasticsearch:$STACK_VERSION
    volumes:
      - ../deployments/elasticsearch/certs:/usr/share/elasticsearch/config/certs
      - ../deployments/elasticsearch/esdata03:/usr/share/elasticsearch/data
      - ../deployments/elasticsearch/eslogs03:/var/log/elasticsearch
    environment:
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
      - node.name=es03
      - cluster.name=go-feed-me
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es01,es02
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es03/es03.key
      - xpack.security.http.ssl.certificate=certs/es03/es03.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es03/es03.key
      - xpack.security.transport.ssl.certificate=certs/es03/es03.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=basic
      - cluster.routing.allocation.disk.watermark.low=0.95
      - cluster.routing.allocation.disk.watermark.high=0.98
      - cluster.routing.allocation.disk.watermark.flood_stage=0.99
    mem_limit: 6442450944
    oom_kill_disable: true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120
    labels:
      - co.elastic.logs/module=elasticsearch

  kibana:
    depends_on:
      es01:
        condition: service_healthy
      es02:
        condition: service_healthy
      es03:
        condition: service_healthy
    hostname: kibana
    image: docker.elastic.co/kibana/kibana:$STACK_VERSION
    volumes:
      - ../deployments/elasticsearch/certs:/usr/share/kibana/config/certs
      - ../deployments/elasticsearch/kibanadata:/usr/share/kibana/data
      - ../deployments/elasticsearch/kibanalogs:/var/log/kibana
    ports:
      - 5601:5601
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=https://es01:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=gofeedme
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
    mem_limit: 1073741824
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120
    labels:
      - co.elastic.logs/module=kibana

  filebeat:
    depends_on:
      es01:
        condition: service_healthy
      es02:
        condition: service_healthy
      es03:
        condition: service_healthy
    hostname: filebeat
    image: docker.elastic.co/beats/filebeat:$STACK_VERSION
    restart: always
    volumes:
      - ../deployments/elasticsearch/certs:/usr/share/filebeat/certs
      - ../deployments/filebeat/config/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../deployments/filebeat/registry:/usr/share/filebeat/data
      - ../deployments/filebeat/logs:/var/log/filebeat
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock
      - ../deployments/server.log:/var/log/server.log

  postgres:
    hostname: postgres
    image: docker.io/postgres:$POSTGRES_VERSION
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    volumes:
      - ../deployments/postgres/data:/var/lib/postgresql/data:Z,U
    labels:
      - co.elastic.logs/module=postgresql
      # - ../deployments/postgres/logs:/var/log/postgresql
    # command:
    #   [
    #     "postgres",
    #     "-c",
    #     "logging_collector=on",
    #     "-c",
    #     "log_directory=/var/log/postgresql",
    #     "-c",
    #     "log_filename=postgresql.log",
    #     "-c",
    #     "log_statement=all",
    #   ]
