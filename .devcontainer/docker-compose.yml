services:
  devcontainer:
    env_file:
      - .env
    build:
      context: .
      dockerfile: ../base/.devcontainer/alpine.Dockerfile
    volumes:
      - ..:/workspace
      - foragd-datahome:/datahome
      - node_modules:/workspace/node_modules
      - go-mod-cache:/home/vscode/go/pkg/mod
      - go-build-cache:/home/vscode/.cache/go-build
      - tmp-build:/workspace/tmp
    command: -c 'sleep infinity'
    user: vscode
    init: true
    group_add:
      - keep-groups
    cap_add:
      - SYS_PTRACE
      - SETUID
      - SETGID
    security_opt:
      - seccomp:unconfined
    hostname: devcontainer
    ports:
      - $PORT:$PORT
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc: 65535

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:$IMAGEPROXY_VERSION
    env_file:
      - .env
    environment:
      IMGPROXY_KEY: $IMGPROXY_KEY
      IMGPROXY_SALT: $IMGPROXY_SALT
      IMGPROXY_SO_REUSEPORT: "true"
      IMGPROXY_ALLOW_LOOPBACK_SOURCE_ADDRESSES: "true"
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_MAX_SRC_FILE_SIZE: 8000000
  ollama:
    env_file:
      - .env
    environment:
      OLLAMA_KEEP_ALIVE: 5m
    build:
      context: .
      dockerfile: ../ollama.Dockerfile
    hostname: ollama
    ports:
      - 11434:11434
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc: 65535

volumes:
  foragd-datahome:
  node_modules:
  go-mod-cache:
  go-build-cache:
  tmp-build:
