services:
  devcontainer:
    env_file:
      - .env
    build:
      context: .
      dockerfile: ../base/.devcontainer/alpine.Dockerfile
      args:
        EXTRA_PKGS: ""
    volumes:
      - ..:/workspace
      - foragd-datahome:/datahome
      - foragd-node_modules:/workspace/node_modules
      - foragd-go-mod-cache:/go/pkg/mod
      - foragd-go-build-cache:/home/vscode/.cache/go-build
      - foragd-golangci-lint-cache:/home/vscode/.cache/golangci-lint
      - foragd-npm-build-cache:/home/vscode/.cache/npm
      - foragd-npm-global:/home/vscode/.npm-global
      - foragd-gcloud:/home/vscode/.config/gcloud
      - foragd-tmp-build:/workspace/tmp
    command: sleep infinity
    user: vscode
    init: true
    group_add:
      - keep-groups
    cap_add:
      - SYS_PTRACE
      - SETUID
      - SETGID
    security_opt:
      - seccomp:unconfined
    hostname: devcontainer
    ports:
      - $PORT:$PORT
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc: 65535

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:$IMAGEPROXY_VERSION
    env_file:
      - .env
    environment:
      IMGPROXY_KEY: $IMGPROXY_KEY
      IMGPROXY_SALT: $IMGPROXY_SALT
      IMGPROXY_SO_REUSEPORT: "true"
      IMGPROXY_ALLOW_LOOPBACK_SOURCE_ADDRESSES: "true"
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_MAX_SRC_FILE_SIZE: 8000000
    cpu_count: 1
    mem_limit: 512m

  ollama:
    env_file:
      - .env
    environment:
      OLLAMA_KEEP_ALIVE: 5m
    build:
      context: .
      dockerfile: ../ollama.Dockerfile
    hostname: ollama
    ports:
      - 11434:11434
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc: 65535

  opensearch-node1:
    env_file:
      - .env
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION}
    container_name: foragd-opensearch-node1
    environment:
      - cluster.name=foragd
      - node.name=foragd-opensearch-node1
      - discovery.seed_hosts=opensearcforagd-h-node2,foragd-opensearch-node2
      - cluster.initial_cluster_manager_nodes=foragd-opensearch-node1,foragd-opensearch-node2
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1 # Set memlock to unlimited (no soft or hard limit)
        hard: -1
      nofile:
        soft: 65536 # Maximum number of open files for the opensearch user - set to at least 65536
        hard: 65536
    volumes:
      - foragd-opensearch-data1:/usr/share/opensearch/data
    ports:
      - 9200:9200 # REST API
      - 9600:9600 # Performance Analyzer

  opensearch-node2:
    env_file:
      - .env
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION}
    container_name: foragd-opensearch-node2
    environment:
      - cluster.name=foragd
      - node.name=foragd-opensearch-node2
      - discovery.seed_hosts=foragd-opensearch-node2,foragd-opensearch-node2
      - cluster.initial_cluster_manager_nodes=foragd-opensearch-node1,foragd-opensearch-node2
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1 # Set memlock to unlimited (no soft or hard limit)
        hard: -1
      nofile:
        soft: 65536 # Maximum number of open files for the opensearch user - set to at least 65536
        hard: 65536
    volumes:
      - foragd-opensearch-data2:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_VERSION}
    container_name: foragd-opensearch-dashboards
    volumes:
      - ./data/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml
    ports:
      - 5601:5601
    expose:
      - 5601

volumes:
  foragd-opensearch-data1:
  foragd-opensearch-data2:
  foragd-datahome:
  foragd-node_modules:
  foragd-go-mod-cache:
  foragd-go-build-cache:
  foragd-golangci-lint-cache:
  foragd-npm-build-cache:
  foragd-npm-global:
  foragd-gcloud:
  foragd-tmp-build:

