services:
  devcontainer:
    env_file:
      - .env
    build:
      context: .
      dockerfile: ../base/.devcontainer/alpine.Dockerfile
      args:
        EXTRA_PKGS: ""
    volumes:
      - ..:/workspace
      - foragd-datahome:/datahome
      - foragd-node_modules:/workspace/node_modules
      - foragd-go-mod-cache:/go/pkg/mod
      - foragd-go-build-cache:/home/vscode/.cache/go-build
      - foragd-golangci-lint-cache:/home/vscode/.cache/golangci-lint
      - foragd-npm-build-cache:/home/vscode/.cache/npm
      - foragd-npm-global:/home/vscode/.npm-global
      - foragd-gcloud:/home/vscode/.config/gcloud
      - foragd-tmp-build:/workspace/tmp
    command: sleep infinity
    user: vscode
    init: true
    group_add:
      - keep-groups
    cap_add:
      - SYS_PTRACE
      - SETUID
      - SETGID
    security_opt:
      - seccomp:unconfined
    hostname: devcontainer
    ports:
      - $PORT:$PORT
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc: 65535
    mem_limit: 2097152


  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:$IMAGEPROXY_VERSION
    env_file:
      - .env
    environment:
      IMGPROXY_KEY: $IMGPROXY_KEY
      IMGPROXY_SALT: $IMGPROXY_SALT
      IMGPROXY_SO_REUSEPORT: "true"
      IMGPROXY_ALLOW_LOOPBACK_SOURCE_ADDRESSES: "true"
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_MAX_SRC_FILE_SIZE: 8000000
    cpu_count: 1
    mem_limit: 524288

  ollama:
    env_file:
      - .env
    environment:
      OLLAMA_KEEP_ALIVE: 5m
    build:
      context: .
      dockerfile: ../ollama.Dockerfile
    hostname: ollama
    ports:
      - 11434:11434
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc: 65535

volumes:
  foragd-datahome:
  foragd-node_modules:
  foragd-go-mod-cache:
  foragd-go-build-cache:
  foragd-golangci-lint-cache:
  foragd-npm-build-cache:
  foragd-npm-global:
  foragd-gcloud:
  foragd-tmp-build:

