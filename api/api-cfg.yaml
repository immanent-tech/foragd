package: models
output: ../internal/models/api.gen.go
generate:
  models: true
output-options:
  # to make sure that all types are generated
  skip-prune: true
  nullable-type: true
import-mapping:
  models.yaml: "-"
  ../pkg/feeds/types.yaml: github.com/joshuar/go-feed-me/pkg/feeds/types
compatibility:
  allow-unexported-struct-field-names: true
  always-prefix-enum-values: true
