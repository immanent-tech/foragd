# yaml-language-server: $schema=https://raw.githubusercontent.com/OAI/OpenAPI-Specification/refs/heads/main/schemas/v3.0/schema.yaml
openapi: '3.0.3'
info:
  version: 1.0.0
  title: Server Spec
  description: OpenAPI spec for the Go Feed Me server.
paths:
  /:
    get:
      description: display the home page.
      operationId: index
      responses:
        default:
          $ref: '#/components/responses/html'
  /login/{provider}:
    get:
      summary: Process a user login with given provider
      operationId: login
      tags:
        - login
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to provider
        404:
          description: No provider to satisfy login
        500:
          description: Problem with request
        default:
          $ref: '#/components/responses/html'
  /login/{provider}/callback:
    get:
      summary: Callback for login provider
      operationId: loginCallback
      tags:
        - login
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to home
        401:
          description: Unauthorized
        404:
          description: No provider to satisfy login
        500:
          description: Problem with request
        default:
          $ref: '#/components/responses/html'
  /logout:
    get:
      summary: >
        User logout.
      description: >
        Logs a user out of the app.
      operationId: logout
      responses:
        default:
          $ref: '#/components/responses/html'
  /signup:
    get:
      summary: >
        Show the sign-up form.
      description: >
        Provides a form for new users to sign-up to the service.
      operationId: signUp
      responses:
        default:
          $ref: '#/components/responses/html'
    post:
      summary: >
        Process a sign-up request.
      operationId: processSignUp
      requestBody:
        $ref: '#/components/requestBodies/UserSignupRequestBody'
      responses:
        default:
          $ref: '#/components/responses/html'
  /search:
    post:
      summary: Issue a user search request
      operationId: Search
      responses:
        default:
          $ref: '#/components/responses/html'
  /settings:
    get:
      summary: Show user settings modal
      operationId: getSettings
      responses:
        default:
          $ref: '#/components/responses/html'
  /settings/theme:
    get:
      summary: >
        Returns the current theme.
      operationId: getTheme
      responses:
        200:
          description: >
            The theme.
          content:
            text/plain:
              schema:
                type: string
    put:
      summary: >
        Sets the current theme.
      operationId: setTheme
  /subscription/new:
    get:
      summary: >
        New subscription handling.
      description: >
        Presents a form for the user to enter details to add a new subscription.
      operationId: newSubscription
      responses:
        default:
          $ref: '#/components/responses/html'
  /subscription/add:
    put:
      summary: >
        Add a subscription.
      description: >
        Adds a subscription for a user.
      operationId: addSubscription
      requestBody:
        $ref: '#/components/requestBodies/SubscriptionRequest'
      responses:
        default:
          $ref: '#/components/responses/html'
  /subscription/import:
    get:
      description: >
        Start an import.
      operationId: startImport
    put:
      description: >
        Set the import method.
      operationId: setImportMethod
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - from
              properties:
                from:
                  $ref: 'api.yaml#/components/schemas/ImportSource'
      # parameters:
      #   - $ref: "api.yaml#/components/parameters/ImportSource"
    post:
      description: >
        Process an import.
      operationId: processImport
      requestBody:
        $ref: '#/components/requestBodies/ImportRequest'
    responses:
      default:
        $ref: '#/components/responses/html'
  /subscription/edit/{subscription}:
    parameters:
      - $ref: '#/components/parameters/SubscriptionID'
    get:
      summary: >
        Edit a subscription.
      operationId: editSubscription
    put:
      summary: >
        Save a subscription.
      operationId: saveSubscription
      requestBody:
        EditSubscriptionRequest:
          description: >
            contains user customisation to a subscription
          required: true
          content:
            multipart/form-data:
              schema:
                $ref: 'models.yaml#/components/schemas/SubscriptionCustomisation'
      responses:
        default:
          $ref: '#/components/responses/html'
  /subscription/remove/{subscription}:
    delete:
      summary: >
        Remove a subscription.
      parameters:
        - $ref: '#/components/parameters/SubscriptionID'
        - $ref: '#/components/parameters/Confirmation'
      operationId: removeSubscription
      responses:
        default:
          $ref: '#/components/responses/html'
  /home:
    get:
      summary: >
        Shows a page of curated feeds and content based on the user's
        subscriptions and viewing preferences.
      operationId: home
      responses:
        default:
          $ref: '#/components/responses/html'
  /home/{collection}:
    get:
      summary: >
        Shows a collection of objects, with optional filtering.
      operationId: showCollection
      parameters:
        - $ref: '#/components/parameters/Collection'
        - $ref: '#/components/parameters/Subscriptions'
        - $ref: '#/components/parameters/Articles'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/Pagination'
      responses:
        default:
          $ref: '#/components/responses/html'
  /home/{collection}/{action}:
    post:
      summary: >
        Performs an action on a collection of objects.
      operationId: actionCollection
      parameters:
        - $ref: '#/components/parameters/Collection'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/Subscriptions'
        - $ref: '#/components/parameters/Articles'
        - $ref: '#/components/parameters/Redirect'
      responses:
        default:
          $ref: '#/components/responses/html'
  /subscription/{subscription}:
    get:
      summary: >
        Shows a items for the given subscription, with optional filtering.
      operationId: showSubscription
      parameters:
        - $ref: '#/components/parameters/SubscriptionID'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/Pagination'
      responses:
        default:
          $ref: '#/components/responses/html'
  /subscription/{action}/{subscription}:
    post:
      summary: >
        Performs the given action on a subscription.
      operationId: actionSubscription
      parameters:
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/SubscriptionID'
        - $ref: '#/components/parameters/Redirect'
      responses:
        default:
          $ref: '#/components/responses/html'
  /article/{item}:
    get:
      summary: >
        Shows an item as an article.
      operationId: showArticle
      parameters:
        - $ref: '#/components/parameters/ItemID'
      responses:
        default:
          $ref: '#/components/responses/html'
  /article/{action}/{item}:
    post:
      summary: >
        Performs the given action on an article.
      operationId: actionArticle
      parameters:
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/ItemID'
        - $ref: '#/components/parameters/Redirect'
      responses:
        default:
          $ref: '#/components/responses/html'
components:
  schemas:
    ImportOPML:
      description: >
        allows importing feeds from a URL pointing to an OPML file.
      type: string
      x-oapi-codegen-extra-tags:
        json: 'opml_url'
        form: 'opml_url'
        validate: 'url'
    ImportFile:
      description: >
        allows importing feeds from an OPML file
      type: string
      format: binary
      x-oapi-codegen-extra-tags:
        json: 'opml_file'
        form: 'opml_file'
    ImportURLs:
      description: >
        allows importing feeds from an list of feed URLs.
      type: array
      items:
        type: string
      x-oapi-codegen-extra-tags:
        json: 'url_list'
        form: 'url_list'
        validate: 'unique,dive,dive,required,url'
    Import:
      description: >
        contains data for importing.
      type: object
      required:
        - from
        - data
      properties:
        from:
          $ref: 'api.yaml#/components/schemas/ImportSource'
        data:
          oneOf:
            - $ref: '#/components/schemas/ImportOPML'
            - $ref: '#/components/schemas/ImportFile'
            - $ref: '#/components/schemas/ImportURLs'
          x-oapi-codegen-extra-tags:
            form: 'data'
  parameters:
    # Path parameters:
    FeedID:
      name: feed
      in: path
      required: true
      schema:
        $ref: 'models.yaml#/components/schemas/FeedID'
    ItemID:
      name: item
      in: path
      required: true
      schema:
        $ref: 'models.yaml#/components/schemas/ItemID'
    SubscriptionID:
      name: subscription
      in: path
      required: true
      schema:
        $ref: 'models.yaml#/components/schemas/SubscriptionID'
    Action:
      name: action
      in: path
      required: true
      schema:
        $ref: 'api.yaml#/components/schemas/Action'
    Collection:
      name: collection
      in: path
      required: true
      schema:
        $ref: 'api.yaml#/components/schemas/Collection'
    Mark:
      name: mark
      in: path
      required: true
      schema:
        $ref: 'models.yaml#/components/schemas/Mark'
    Theme:
      name: theme
      description: >
        is the theme name.
      in: path
      required: true
      schema:
        type: string
    # Query Parameters:
    Redirect:
      description: >
        specifies a location to which the client should be redirected on a successful request. Used to perform a
        client-side redirection with htmx.
      name: redirect
      in: query
      schema:
        type: string
    Confirmation:
      description: >
        indicates the confirmation state from the user for a destructive action.
      name: confirmation
      in: query
      required: true
      schema:
        $ref: 'api.yaml#/components/schemas/UserConfirmation'
    View:
      name: view
      in: query
      required: true
      schema:
        $ref: 'api.yaml#/components/schemas/View'
    Count:
      name: count
      in: query
      required: true
      schema:
        $ref: 'api.yaml#/components/schemas/Count'
    Subscriptions:
      name: subscriptions
      in: query
      schema:
        type: array
        items:
          $ref: 'models.yaml#/components/schemas/SubscriptionID'
        x-oapi-codegen-extra-tags:
          json: 'subscriptions'
          form: 'subscriptions[]'
          validate: 'omitnil,unique,dive,startswith=sub_'
    Feeds:
      name: feeds
      in: query
      schema:
        type: array
        items:
          $ref: 'models.yaml#/components/schemas/FeedID'
        x-oapi-codegen-extra-tags:
          json: 'feeds'
          form: 'feeds[]'
          validate: 'omitnil,unique,dive,startswith=feed_'
        # x-go-type-skip-optional-pointer: true
    Articles:
      name: articles
      in: query
      schema:
        description: is a list of items IDs.
        type: array
        items:
          $ref: 'models.yaml#/components/schemas/ItemID'
        x-oapi-codegen-extra-tags:
          json: 'items'
          form: 'items[]'
          validate: 'omitnil,unique,dive,startswith=item_'
        # x-go-type-skip-optional-pointer: true
    Categories:
      name: categories
      in: query
      schema:
        description: is a list of categories.
        type: array
        items:
          $ref: 'models.yaml#/components/schemas/Category'
        x-oapi-codegen-extra-tags:
          json: 'categories'
          form: 'categories[]'
          validate: 'omitnil,unique'
        # x-go-type-skip-optional-pointer: true
      # x-go-type-skip-optional-pointer: true
    Pagination:
      name: pagination
      in: query
      schema:
        $ref: 'api.yaml#/components/schemas/Pagination'
    SortBy:
      name: sort_by
      in: query
      required: true
      schema:
        $ref: 'api.yaml#/components/schemas/SortBy'
    SortOrder:
      name: sort_order
      in: query
      required: true
      schema:
        $ref: 'api.yaml#/components/schemas/SortOrder'
    ImportSource:
      name: import_source
      in: query
      required: true
      schema:
        $ref: 'api.yaml#/components/schemas/ImportSource'
  requestBodies:
    ImportRequest:
      description: >
        Holds data for importing subscriptions
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/Import'
    MarkRequest:
      description: >
        Holds options for marking objects.
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: 'api.yaml#/components/schemas/MarkObjects'
    UserSignupRequestBody:
      description: >
        Holds details for adding/saving a user signup.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: 'api.yaml#/components/schemas/UserSignupRequest'
    SubscriptionRequest:
      description: >
        Holds details for adding/saving a subscription.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: 'api.yaml#/components/schemas/SubscriptionRequest'
  responses:
    html:
      description: >
        regular html response, usually a full page.
      content:
        'text/html;charset=utf-8': {}
    sse:
      description: server sent event
      content:
        'text/event-stream;charset=utf-8': {}
