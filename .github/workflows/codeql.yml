name: "CodeQL Analysis"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "38 13 * * 4"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGETPLATFORM: linux/amd64

jobs:
  codeql:
    name: Analyze Go
    runs-on: "ubuntu-22.04"
    permissions:
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
    steps:
      # - name: Harden Runner
      #   uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
      #   with:
      #     egress-policy: audit
      #     allowed-endpoints: >
      #       github.com:443
      #       azure.archive.ubuntu.com:80
      #       esm.ubuntu.com:443
      #       ghcr.io:443
      #       api.github.com:443
      #       github.com:443
      #       golang.org:443
      #       motd.ubuntu.com:443
      #       objects.githubusercontent.com:443
      #       packages.microsoft.com:443
      #       pkg-containers.githubusercontent.com:443
      #       proxy.golang.org:443
      #       raw.githubusercontent.com:443
      #       storage.googleapis.com:443
      #       uploads.github.com:443
      #       release-assets.githubusercontent.com:443
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          submodules: 'true'

      - name: Setup Go
        id: setup_go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version-file: "go.mod"

      - name: Build frontend files
        run: |
          npm clean-install
          npm run build:prod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e46ed2cbd01164d986452f91f178727624ae40d7 # v3.29.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          packs: githubsecuritylab/codeql-${{ matrix.language }}-queries

      - if: matrix.build-mode == 'manual'
        name: Build
        run: go build -ldflags="-X github.com/immanent-tech/foragd/config.Version=$(git describe --tags --always --long --dirty)"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e46ed2cbd01164d986452f91f178727624ae40d7 # v3.29.5
        with:
          category: "/language:${{matrix.language}}"
