openapi: "3.0.3"
info:
  version: 1.0.0
  title: Media RSS
  description: >
    Media RSS specification, a namespace for RSS 2.0, as openapi schema.

    https://www.rssboard.org/media-rss
  license:
    name: AGPL-3.0-or-later
    url: https://spdx.org/licenses/AGPL-3.0-only.html
paths: {}
components:
  schemas:
    URL:
      description: >
        should specify the direct URL to the media object.
      type: string
      xml:
        attribute: true
      x-go-name: URL
      x-oapi-codegen-extra-tags:
        xml: "url,attr,omitempty"
        validate: "omitempty,url"
    Href:
      description: >
        should specify the direct URL to the media object.
      type: string
      xml:
        attribute: true
      x-oapi-codegen-extra-tags:
        xml: "href,attr,omitempty"
        validate: "omitempty,url"
    FileSize:
      description: >
        is the number of bytes of the media object.
      type: integer
      xml:
        attribute: true
      x-oapi-codegen-extra-tags:
        xml: "fileSize,attr,omitempty"
    MimeType:
      description: >
        is the standard MIME type of the object.
      type: string
      xml:
        attribute: true
      x-oapi-codegen-extra-tags:
        xml: "type,attr,omitempty"
    Medium:
      description: >
        is the type of object.
      type: string
      enum: ["image","audio","video","document","executable"]
      xml:
        attribute: true
      x-oapi-codegen-extra-tags:
        xml: "medium,attr,omitempty"
        validate: "omitempty,oneof=image audio video document executable"
    IsDefault:
      description: >
        determines if this is the default object that should be used for the <media:group>.
      type: boolean
      xml:
        attribute: true
      x-oapi-codegen-extra-tags:
        xml: "isDefault,attr,omitempty"
    Expression:
      description: >
        determines if the object is a sample or the full version of the object, or even if it is a continuous stream.
      type: string
      enum: ["sample","full","nonstop"]
      default: "full"
      xml:
        attribute: true
      x-oapi-codegen-extra-tags:
        xml: "expression,attr,omitempty"
        validate: "omitempty,oneof=sample full nonstop"
    Bitrate:
      description: >
        is the kilobits per second rate of media.
      type: integer
      xml:
        attribute: true
      x-oapi-codegen-extra-tags:
        xml: "bitrate,attr,omitempty"
    Framerate:
      description: >
        is the number of frames per second for the media object.
      type: integer
      xml:
        attribute: true
      x-oapi-codegen-extra-tags:
        xml: "framerate,attr,omitempty"
    Samplerate:
      description: >
        is the number of samples per second taken to create the media object. It is expressed in thousands of samples
        per second (kHz).
      type: integer
      xml:
        attribute: true
      x-oapi-codegen-extra-tags:
        xml: "samplingrate,attr,omitempty"
    Channels:
      description: >
        is number of audio channels in the media object.
      type: integer
      xml:
        attribute: true
      x-oapi-codegen-extra-tags:
        xml: "channels,attr,omitempty"
    Duration:
      description: >
        is the number of seconds the media object plays.
      type: integer
      xml:
        attribute: true
      x-oapi-codegen-extra-tags:
        xml: "duration,attr,omitempty"
    Height:
      description: >
        is the height of the media object.
      type: integer
      xml:
        attribute: true
      x-oapi-codegen-extra-tags:
        xml: "height,attr,omitempty"
        validate: "omitempty,number"
    Width:
      description: >
        is the height of the media object.
      type: integer
      xml:
        attribute: true
      x-oapi-codegen-extra-tags:
        xml: "width,attr,omitempty"
        validate: "omitempty,number"
    Lang:
      description: >
        is the primary language encapsulated in the media object. Language codes possible are detailed in RFC 3066.
      type: integer
      xml:
        attribute: true
      x-oapi-codegen-extra-tags:
        xml: "lang,attr,omitempty"
        validate: "omitempty,bcp47_language_tag"
    Scheme:
      description: >
        is the URI that identifies the scheme used by the element.
      type: string
      xml:
        attribute: true
      x-oapi-codegen-extra-tags:
        xml: "scheme,attr,omitempty"
        validate: "omitempty,uri"
    TextType:
      description: >
        specifies the type of text embedded in the element.
      type: string
      enum: ["plain","html"]
      default: "plain"
      xml:
        attribute: true
      x-oapi-codegen-extra-tags:
        xml: "type,attr,omitempty"
        validate: "omitempty,oneof=plain html"
    Label:
      description: >
        is the human readable label that can be displayed in end user applications.
      type: string
      xml:
        attribute: true
      x-oapi-codegen-extra-tags:
        xml: "label,attr,omitempty"
    Rating:
      description: >
        allows the permissible audience to be declared. If this element is not included, it assumes that no restrictions
        are necessary.
      type: object
      required:
        - XMLName
        - value
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
        scheme:
          $ref: "#/components/schemas/Scheme"
      x-oapi-codegen-extra-tags:
        xml: "rating,omitempty"
    Title:
      description: >
        is the title of the particular media object.
      type: object
      required:
        - XMLName
        - value
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
        type:
          $ref: "#/components/schemas/TextType"
      x-oapi-codegen-extra-tags:
        xml: "title,omitempty"
    Description:
      description: >
        is a short description describing the media object typically a sentence in length.
      type: object
      required:
        - XMLName
        - value
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
        type:
          $ref: "#/components/schemas/TextType"
      x-oapi-codegen-extra-tags:
        xml: "description,omitempty"
    Keywords:
      description: >
        are highly relevant keywords describing the media object with typically a maximum of 10 words. The keywords and
        phrases should be comma-delimited.
      type: object
      required:
        - XMLName
        - value
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
      x-oapi-codegen-extra-tags:
        xml: "keywords,omitempty"
    Thumbnail:
      description: >
        allows a particular images to be used as a representative image for the media object.
      type: object
      required:
        - XMLName
        - url
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        url:
          allOf:
            - $ref: "#/components/schemas/URL"
          x-oapi-codegen-extra-tags:
            xml: "url,attr"
            validate: "required,url"
        height:
          $ref: "#/components/schemas/Height"
        width:
          $ref: "#/components/schemas/Width"
        time:
          description: >
            specifies the time offset in relation to the media object. Typically this is used when creating multiple
            keyframes within a single video. The format for this attribute should be in the DSM-CC's Normal Play Time
            (NTP) as used in RTSP
          type: string
          x-oapi-codegen-extra-tags:
            xml: "time,attr,omitempty"
      x-oapi-codegen-extra-tags:
        xml: "thumbnail,omitempty"
    Thumbnails:
      description: >
        a list of thumbnails for the object.
      type: array
      items:
        $ref: "#/components/schemas/Thumbnail"
      xml:
        name: thumbnail
      x-oapi-codegen-extra-tags:
        xml: "thumbnail,omitempty"
      x-go-type-skip-optional-pointer: true
    Category:
      description: >
        allows a taxonomy to be set that gives an indication of the type of media content, and its particular contents.
      type: object
      required:
        - XMLName
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        scheme:
          $ref: "#/components/schemas/Scheme"
        label:
          $ref: "#/components/schemas/Label"
    Hash:
      description: >
        is the hash of the binary media file. Elements represents hashes in different alogrithms.
      type: object
      required:
        - XMLName
        - value
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
        algo:
          description: >
            indicates the algorithm used to create the hash.
          type: string
          enum: ["md5","sha-1"]
          default: "md5"
          x-oapi-codegen-extra-tags:
            xml: "algo,attr,omitempty"
    Hashes:
      description: >
        a list of hashes for the object.
      type: array
      items:
        $ref: "#/components/schemas/Hash"
      xml:
        name: hash
      x-oapi-codegen-extra-tags:
        xml: "hash,omitempty"
      x-go-type-skip-optional-pointer: true
    Player:
      description: >
        allows the media object to be accessed through a web browser media player console.
      type: object
      required:
        - XMLName
        - url
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        url:
          allOf:
            - $ref: "#/components/schemas/URL"
          x-oapi-codegen-extra-tags:
            xml: "url,attr"
            validate: "required,url"
        height:
          $ref: "#/components/schemas/Height"
        width:
          $ref: "#/components/schemas/Width"
    Credit:
      description: >
        Notable entity and the contribution to the creation of the media object. Current entities can include people,
        companies, locations, etc. Specific entities can have multiple roles, and several entities can have the same
        role.
      type: object
      required:
        - XMLName
        - value
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
        role:
          description: >
            specifies the role the entity played.
          type: string
          xml:
            attribute: true
          x-oapi-codegen-extra-tags:
            xml: "role,attr,omitempty"
            validate: "omitempty,lowercase"
        scheme:
          $ref: "#/components/schemas/Scheme"
    Credits:
      description: >
        a list of credits for the object.
      type: array
      items:
        $ref: "#/components/schemas/Credit"
      xml:
        name: credit
      x-oapi-codegen-extra-tags:
        xml: "credit,omitempty"
      x-go-type-skip-optional-pointer: true
    Copyright:
      description: >
        is copyright information for the media object.
      type: object
      required:
        - XMLName
        - value
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
        url:
          $ref: "#/components/schemas/URL"
    Text:
      description: >
        allows the inclusion of a text transcript, closed captioning or lyrics of the media content.
      type: object
      required:
        - XMLName
        - value
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
        type:
          $ref: "#/components/schemas/TextType"
        lang:
          $ref: "#/components/schemas/Lang"
        start:
          description: >
            specifies the start time offset that the text starts being relevant to the media object. An example of this
            would be for closed captioning. It uses the NTP time code format.
          type: string
          x-oapi-codegen-extra-tags:
            xml: "start,attr,omitempty"
        end:
          description: >
            specifies the end time offset that the text ends being relevant to the media object. An example of this
            would be for closed captioning. It uses the NTP time code format.
          type: string
          x-oapi-codegen-extra-tags:
            xml: "end,attr,omitempty"
    Texts:
      description: >
        a list of texts for the object.
      type: array
      items:
        $ref: "#/components/schemas/Text"
      xml:
        name: text
      x-oapi-codegen-extra-tags:
        xml: "text,omitempty"
      x-go-type-skip-optional-pointer: true
    Restriction:
      description:
        allows restrictions to be placed on the aggregator rendering the media in the feed.
      type: object
      required:
        - XMLName
        - value
        - relationship
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
        relationship:
          description: >
            indicates the type of relationship that the restriction represents.
          type: string
          enum: ["allow","deny"]
          x-oapi-codegen-extra-tags:
            xml: "relationship,attr"
        type:
          description: >
            specifies the type of restriction.
          type: string
          enum: ["country","uri","sharing"]
          x-oapi-codegen-extra-tags:
            xml: "sharing,attr,omitempty"
    CommunityStarRating:
      description: >
        specifies the rating-related information about a media object.
      type: object
      required:
        - XMLName
        - average
        - count
        - min
        - max
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        average:
          type: number
          x-oapi-codegen-extra-tags:
            xml: "average,attr"
        count:
          type: integer
          x-oapi-codegen-extra-tags:
            xml: "count,attr"
        min:
          type: number
          x-oapi-codegen-extra-tags:
            xml: "min,attr"
        max:
          type: number
          x-oapi-codegen-extra-tags:
            xml: "max,attr"
      x-oapi-codegen-extra-tags:
        xml: "starRating,omitemtpy"
        json: "starRating,omitemtpy"
    CommunityStatistics:
      description: >
        specifies various statistics about a media object like the view count and the favorite count.
      type: object
      required:
        - XMLName
        - views
        - favorites
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        views:
          type: integer
          x-oapi-codegen-extra-tags:
            xml: "views,attr"
        favorites:
          type: integer
          x-oapi-codegen-extra-tags:
            xml: "favorites,attr"
      x-oapi-codegen-extra-tags:
        xml: "statistics,omitemtpy"
        json: "statistics,omitemtpy"
    CommunityTags:
      description: >
        contains user-generated tags separated by commas in the decreasing order of each tag's weight. Each tag can be
        assigned an integer weight in tag_name:weight format. It's up to the provider to choose the way weight is
        determined for a tag; for example, number of occurences can be one way to decide weight of a particular tag.
      type: object
      required:
        - XMLName
        - value
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
      x-oapi-codegen-extra-tags:
        xml: "tags,omitemtpy"
        json: "tags,omitemtpy"
    Community:
      description: >
        stands for the community related content. This allows inclusion of the user perception about a media object in
        the form of view count, ratings and tags.
      type: object
      properties:
        starRating:
          $ref: "#/components/schemas/CommunityStarRating"
        statistics:
          $ref: "#/components/schemas/CommunityStatistics"
        tags:
          $ref: "#/components/schemas/CommunityTags"
      x-oapi-codegen-extra-tags:
        xml: "community,omitempty"
    Comment:
      description: >
        is a comments a media object has received.
      type: object
      required:
        - XMLName
        - value
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
      x-oapi-codegen-extra-tags:
        xml: "comment,omitempty"
    Comments:
      description: >
        is a list of comments the media object has received.
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
          x-go-type-skip-optional-pointer: true
      x-oapi-codegen-extra-tags:
        xml: "comments,omitempty"
    Param:
      description: >
        is a key-value pair that defines player-specific values for an Embed element.
      type: object
      required:
        - XMLName
        - value
        - name
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
        name:
          description: >
            is the name of the param.
          type: string
          xml:
            attribute: true
          x-oapi-codegen-extra-tags:
            xml: "name,attr"
      x-oapi-codegen-extra-tags:
        xml: "param,omitempty"
    Embed:
      description: >
        allows inclusion of player-specific information in the form of key-value (Param) pairs.
      allOf:
        - $ref: "#/components/schemas/Player"
        - type: object
          properties:
            params:
              description: >
                is a list of player-specific parameters.
              type: array
              items:
                $ref: "#/components/schemas/Param"
              xml:
                name: param
              x-oapi-codegen-extra-tags:
                xml: "param,omitempty"
                json: "param,omitempty"
              x-go-type-skip-optional-pointer: true
      xml:
        name: embed
      x-oapi-codegen-extra-tags:
        xml: "embed,omitempty"
    Response:
      description: >
        is a response a media object has received.
      type: object
      required:
        - XMLName
        - value
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
      x-oapi-codegen-extra-tags:
        xml: "response,omitempty"
    Responses:
      description: >
        allows inclusion of a list of all media responses a media object has received.
      type: array
      items:
        $ref: "#/components/schemas/Response"
      xml:
        name: responses
      x-oapi-codegen-extra-tags:
        xml: "responses,omitempty"
      x-go-type-skip-optional-pointer: true
    Backlink:
      description: >
        is a backlink pointing to the media object.
      type: object
      required:
        - XMLName
        - value
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
      x-oapi-codegen-extra-tags:
        xml: "backLink,omitempty"
        json: "backLink,omitempty"
    Backlinks:
      description: >
        allows inclusion of all the URLs pointing to a media object.
      type: array
      items:
        $ref: "#/components/schemas/Backlink"
      xml:
        name: backLinks
      x-oapi-codegen-extra-tags:
        xml: "backLinks,omitempty"
        json: "backLinks,omitempty"
      x-go-type-skip-optional-pointer: true
    Status:
      description: >
        specifies the status of a media object -- whether it's still active or it has been blocked/deleted.
      type: object
      required:
        - XMLName
        - state
        - reason
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        state:
          description: >
            indicates the status.
          type: string
          enum: ["active","blocked","deleted"]
          xml:
            attribute: true
          x-oapi-codegen-extra-tags:
            xml: "state,attr"
            validate: "omitempty,oneof=active blocked deleted"
        reason:
          description: >
            is a reason explaining why a media object has been blocked/deleted.
          type: string
          xml:
            attribute: true
          x-oapi-codegen-extra-tags:
            xml: "reason,attr"
    Price:
      description: >
        includes pricing information about a media object. If this tag is not present, the media object is supposed to
        be free.
      type: object
      required:
        - XMLName
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        type:
          description: >
            is the type of pricing for the media object.
          type: string
          enum: ["rent","purchase","package","subscription"]
          xml:
            attribute: true
          x-oapi-codegen-extra-tags:
            xml: "type,attr,omitempty"
            validate: "omitempty,oneof=rent purchase package subscription"
        info:
          description: >
            is a URL pointing to package or subscription information.
          type: string
          xml:
            attribute: true
          x-oapi-codegen-extra-tags:
            xml: "info,attr,omitempty"
            validate: "omitempty,url"
        price:
          description: >
            is the price of the media object.
          type: number
          xml:
            attribute: true
          x-oapi-codegen-extra-tags:
            xml: "price,attr,omitempty"
            validate: "omitempty,numeric"
        currency:
          description: >
            is the currency code of the price.
          type: string
          xml:
            attribute: true
          x-oapi-codegen-extra-tags:
            xml: "currency,attr,omitempty"
            validate: "omitempty,iso4217"
    License:
      description: >
        link to specify the machine-readable license associated with the content.
      type: object
      required:
        - XMLName
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        type:
          $ref: "#/components/schemas/TextType"
        href:
          $ref: "#/components/schemas/Href"
    Subtitle:
      description: >
        contains subtitle/CC link.
      type: object
      required:
        - XMLName
        - type
        - lang
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        type:
          $ref: "#/components/schemas/TextType"
        lang:
          $ref: "#/components/schemas/Lang"
        href:
          $ref: "#/components/schemas/Href"
    PeerLink:
      description: >
        contains P2P link.
      type: object
      required:
        - XMLName
        - type
        - href
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        type:
          $ref: "#/components/schemas/TextType"
        href:
          $ref: "#/components/schemas/Href"
    Rights:
      description: >
        specifies the rights information of a media object.
      type: object
      required:
        - XMLName
        - status
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        status:
          description: >
            is the status of the media object saying whether a media object has been created by the publisher or they
            have rights to circulate it.
          type: string
          enum: ["userCreated","official"]
          x-oapi-codegen-extra-tags:
            xml: "status,attr"
            validate: "omitempty,oneof=userCreated official"
    SceneTitle:
      type: object
      required:
        - XMLName
        - value
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
      x-oapi-codegen-extra-tags:
        xml: "sceneTitle,omitempty"
        json: "sceneTitle,omitempty"
    SceneDescription:
      type: object
      required:
        - XMLName
        - value
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
      x-oapi-codegen-extra-tags:
        xml: "sceneDescription,omitempty"
        json: "sceneDescription,omitempty"
    SceneStartTime:
      type: object
      required:
        - XMLName
        - value
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
      x-oapi-codegen-extra-tags:
        xml: "sceneStartTime,omitempty"
        json: "sceneStartTime,omitempty"
    SceneEndTime:
      type: object
      required:
        - XMLName
        - value
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
      x-oapi-codegen-extra-tags:
        xml: "sceneEndTime,omitempty"
        json: "sceneEndTime,omitempty"
    Scene:
      description: >
        contains information about a particular scene.
      type: object
      properties:
        sceneTitle:
          $ref: "#/components/schemas/SceneTitle"
        sceneDescription:
          $ref: "#/components/schemas/SceneDescription"
