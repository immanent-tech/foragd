package: rss
output: rss/rss.gen.go
generate:
  models: true
output-options:
  # to make sure that all types are generated
  skip-prune: true
import-mapping:
  rdf.yaml: "github.com/joshuar/go-feed-me/pkg/feeds/rdf"
  atom.yaml: "github.com/joshuar/go-feed-me/pkg/feeds/atom"
  dublin-core.yaml: "github.com/joshuar/go-feed-me/pkg/feeds/dc"
compatibility:
  always-prefix-enum-values: true
