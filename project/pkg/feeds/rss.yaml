openapi: "3.0.3"
info:
  version: 1.0.0
  title: RSS 2.0
  description: >
    RSS 2.0 specification as openapi schema.

    https://www.rssboard.org/rss-specification
  license:
    name: AGPL-3.0-or-later
    url: https://spdx.org/licenses/AGPL-3.0-only.html
paths: {}
components:
  schemas:
    Category:
      description: >
        is a forward-slash-separated string that identifies a hierarchic location in the indicated taxonomy. Processors
        may establish conventions for the interpretation of categories.
      type: object
      required:
        - value
      properties:
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
        domain:
          description: >
            is a string that identifies a categorization taxonomy.
          type: string
          xml:
            attribute: true
          x-oapi-codegen-extra-tags:
            xml: "domain,attr,omitempty"
      x-oapi-codegen-extra-tags:
        xml: "category,omitempty"
    Copyright:
      description: >
        is the copyright notice for content in the channel.
      type: string
      x-oapi-codegen-extra-tags:
        xml: "copyright,omitempty"
      example:
        copyright: Copyright 2002, Spartanburg Herald-Journal
    ManagingEditor:
      description: >
        is the email address for person responsible for editorial content.
      type: string
      x-oapi-codegen-extra-tags:
        xml: "managingEditor,omitempty"
    WebMaster:
      description: >
        is the email address for person responsible for technical issues relating to channel.
      type: string
      x-oapi-codegen-extra-tags:
        xml: "webMaster,omitempty"
    Generator:
      description: >
        is a string indicating the program used to generate the channel.
      type: string
      x-oapi-codegen-extra-tags:
        xml: "generator,omitempty"
      example:
        generator: MightyInHouse Content System v2.3
    Docs:
      description: >
        A URL that points to the documentation for the format used in the RSS file. It's probably a pointer to this
        page. It's for people who might stumble across an RSS file on a Web server 25 years from now and wonder what
        it is.
      type: string
      x-oapi-codegen-extra-tags:
        xml: "docs,omitempty"
        validate: "omitempty,url"
      example:
        docs: https://www.rssboard.org/rss-specification
    TTL:
      description: >
        stands for time to live. It's a number of minutes that indicates how long a channel can be cached before
        refreshing from the source.
      type: integer
      minimum: 1
      x-go-name: TTL
      x-oapi-codegen-extra-tags:
        xml: "ttl,omitempty"
        validate: "omitempty,gte=1"
    Rating:
      description: >
        is the PICS rating for the channel.
      type: string
      x-oapi-codegen-extra-tags:
        xml: "rating,omitempty"
    Author:
      description: >
        is the email address of the author of the item. For newspapers and magazines syndicating via RSS, the
        author is the person who wrote the article that the <item> describes. For collaborative weblogs, the author
        of the item might be different from the managing editor or webmaster. For a weblog authored by a single
        individual it would make sense to omit the <author> element.
      type: string
      x-oapi-codegen-extra-tags:
        xml: "author,omitempty"
    Comments:
      description: >
        is the url of the comments page for the item.
      type: string
      x-oapi-codegen-extra-tags:
        xml: "comments,omitempty"
        validate: "omitempty,url"
    PubDate:
      description: >
        is the publication date of the content.
      allOf:
        - $ref: "rdf.yaml#/components/schemas/Date"
      x-oapi-codegen-extra-tags:
        xml: "pubDate,omitempty"
        json: "pubDate,omitempty"
    Enclosure:
      description: >
        describes a media object.
      type: object
      required:
        - url
        - length
        - type
      properties:
        url:
          description: >
            indicates where the enclosure is located.
          type: string
          x-go-name: URL
          xml:
            attribute: true
          x-oapi-codegen-extra-tags:
            xml: "url,attr"
            validate: "required,url"
        length:
          description: >
            indicates how big the enclosure is in bytes.
          type: integer
          xml:
            attribute: true
          x-oapi-codegen-extra-tags:
            xml: "length,attr"
            validate: "required,number"
        type:
          description: >
            indicates the MIME type of the enclosure.
          type: string
          xml:
            attribute: true
          x-oapi-codegen-extra-tags:
            xml: "type,attr"
            validate: "required"
      x-oapi-codegen-extra-tags:
        xml: "enclosure,omitempty"
    GUID:
      description: >
        is a string that uniquely identifies an item.
      type: object
      required:
        - value
      properties:
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
        isPermaLink:
          description: >
            If true the guid is assumed to be a URL. If its value is false, the guid may not be assumed to be a url, or
            a url to anything in particular.
          type: boolean
          default: true
          xml:
            attribute: true
          x-oapi-codegen-extra-tags:
            xml: "isPermaLink,attr,omitempty"
      x-go-name: GUID
      x-oapi-codegen-extra-tags:
        xml: "guid,omitempty"
    RSSCloud:
      description: >
        specifies a web service that supports the rssCloud interface which can be implemented in HTTP-POST, XML-RPC or
        SOAP 1.1.

        Its purpose is to allow processes to register with a cloud to be notified of updates to the channel,
        implementing a lightweight publish-subscribe protocol for RSS feeds.
      type: object
      required:
        - domain
        - port
        - path
        - registerProcedure
        - protocol
      properties:
        domain:
          type: string
          xml:
            attribute: true
          x-oapi-codegen-extra-tags:
            xml: "domain,attr"
            validate: "required"
        port:
          type: integer
          xml:
            attribute: true
          x-oapi-codegen-extra-tags:
            xml: "port,attr"
            validate: "required"
        path:
          type: string
          xml:
            attribute: true
          x-oapi-codegen-extra-tags:
            xml: "path,attr"
            validate: "required"
        registerProcedure:
          type: string
          xml:
            attribute: true
          x-oapi-codegen-extra-tags:
            xml: "registerProcedure,attr"
            validate: "required"
        protocol:
          type: string
          enum: ["xml-rpc","soap","http-post"]
          xml:
            attribute: true
          x-oapi-codegen-extra-tags:
            xml: "protocol,attr"
            validate: "required"
      x-oapi-codegen-extra-tags:
        xml: "cloud,omitempty"
      example:
        domain: rpc.sys.com
        port: 80
        path: "/RPC2"
        registerProcedure: "pingMe"
        protocol: "soap"
    TextInput:
      description: >
        The purpose of the <textInput> element is something of a mystery. You can use it to specify a search engine box.
        Or to allow a reader to provide feedback. Most aggregators ignore it.
      type: object
      required:
        - title
        - description
        - name
        - link
      properties:
        title:
          description: >
            is the label of the Submit button in the text input area.
          type: string
          x-oapi-codegen-extra-tags:
            xml: "title"
            validate: "required,html_encoded"
        description:
          description: >
            explains the text input area.
          type: string
          x-oapi-codegen-extra-tags:
            xml: "description"
            validate: "required,html_encoded"
        name:
          description: >
            is the name of the text object in the text input area.
          type: string
          x-oapi-codegen-extra-tags:
            xml: "name"
            validate: "required,html_encoded"
        link:
          description: >
            is the URL of the CGI script that processes text input requests.
          type: string
          x-oapi-codegen-extra-tags:
            xml: "link"
            validate: "required,url"
      x-oapi-codegen-extra-tags:
        xml: "textInput,omitempty"
    Image:
      description: >
        contains details of a GIF, JPEG or PNG image that can be displayed with the channel or item.
      type: object
      required:
        - url
        - title
        - link
      properties:
        url:
          description: >
            is the URL of a GIF, JPEG or PNG image that represents the channel.
          type: string
          x-go-name: URL
          x-oapi-codegen-extra-tags:
            xml: "url"
            validate: "required,url"
        title:
          description: >
            describes the image, it's used in the ALT attribute of the HTML <img> tag when the channel is rendered in HTML.
          type: string
          x-oapi-codegen-extra-tags:
            xml: "title"
            validate: "required,title"
        link:
          description: >
            is the URL of the site, when the channel is rendered, the image is a link to the site. (Note, in practice
            the image <title> and <link> should have the same value as the channel's <title> and <link>.
          type: string
          x-oapi-codegen-extra-tags:
            xml: "link"
            validate: "required,link"
        width:
          description: >
            indicates the width of the image in pixels.
          type: integer
          maximum: 144
          default: 88
          x-oapi-codegen-extra-tags:
            xml: "width,omitempty"
            validate: "omitempty,gt=0,lte=144"
        height:
          description: >
            indicates the height of the image in pixels.
          type: integer
          maximum: 400
          default: 31
          x-oapi-codegen-extra-tags:
            xml: "height,omitempty"
            validate: "omitempty,gt=0,lte=400"
        description:
          description: >
            contains text that is included in the TITLE attribute of the link formed around the image in the HTML
            rendering.
          type: string
          x-oapi-codegen-extra-tags:
            xml: "description,omitempty"
      x-oapi-codegen-extra-tags:
        xml: "image,omitempty"
    Source:
      description: >
        The RSS channel that the item came from.
      type: object
      required:
        - XMLName
        - value
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        value:
          $ref: "types.yaml#/components/schemas/RequiredValue"
        url:
          type: string
          x-go-name: URL
          xml:
            attribute: true
          x-oapi-codegen-extra-tags:
            xml: "url,attr"
            validate: "url"
      x-oapi-codegen-extra-tags:
        xml: "source,omitempty"
    SkipHours:
      description: >
        is a hint for aggregators telling them which hours they can skip.
      type: object
      properties:
        hour:
          type: array
          items:
            description: >
              is the hour of the day to skip.
            type: integer
            minimum: 0
            maximum: 23
          x-oapi-codegen-extra-tags:
            xml: "hour,omitempty"
            validate: "omitempty,dive,gte=0,lte=23"
          x-go-type-skip-optional-pointer: true
      x-oapi-codegen-extra-tags:
        xml: "skipHours,omitempty"
    SkipDays:
      description: >
        is a hint for aggregators telling them which days they can skip. This
      type: object
      properties:
        day:
          type: array
          items:
            description: >
              is a day of the week to skip.
            type: string
            enum: ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]
            x-enum-varnames: ["SkipMonday","SkipTuesday","SkipWednesday","SkipThursday","SkipFriday","SkipSaturday","SkipSunday"]
          x-oapi-codegen-extra-tags:
            xml: "day,omitempty"
            validate: "omitempty,dive,oneof=Monday Tuesday Wednesday Thursday Friday Saturday Sunday"
          x-go-type-skip-optional-pointer: true
      x-oapi-codegen-extra-tags:
        xml: "skipDays,omitempty"
    ChannelMetadata:
      description: >
        contains information about the channel (metadata).
      type: object
      required:
        - title
        - link
        - description
      properties:
        title:
          description: >
            is the name of the channel. It's how people refer to your service. If you have an HTML website that contains
            the same information as your RSS file, the title of your channel should be the same as the title of your
            website.
          allOf:
            - $ref: "rdf.yaml#/components/schemas/Title"
          x-oapi-codegen-extra-tags:
            xml: "title"
            validate: "required"
          example:
            title: GoUpstate.com News Headlines
        links:
          description: >
            is a list of links related to the channel.
          type: array
          items:
            $ref: "atom.yaml#/components/schemas/Link"
          x-oapi-codegen-extra-tags:
            xml: "link"
            validate: "required"
        description:
          description: >
            is a phrase or sentence describing the channel.
          allOf:
            - $ref: "rdf.yaml#/components/schemas/Description"
          x-oapi-codegen-extra-tags:
            xml: "description"
            validate: "required"
          example:
            description: >
              The latest news from GoUpstate.com, a Spartanburg Herald-Journal Web site.
        copyright:
          $ref: "#/components/schemas/Copyright"
        managingEditor:
          $ref: "#/components/schemas/ManagingEditor"
        webMaster:
          $ref: "#/components/schemas/WebMaster"
        pubDate:
          $ref: "#/components/schemas/PubDate"
        lastBuildDate:
          description: >
            is the last time the content of the channel changed.
          allOf:
            - $ref: "rdf.yaml#/components/schemas/Date"
          x-oapi-codegen-extra-tags:
            xml: "lastBuildDate,omitempty"
        categories:
          description: >
            is a list of categories associated with the channel.
          type: array
          items:
            $ref: "#/components/schemas/Category"
          xml:
            name: category
          x-oapi-codegen-extra-tags:
            json: "category,omitempty"
            xml: "category,omitempty"
            validate: "omitempty,dive,unique"
          x-go-type-skip-optional-pointer: true
        generator:
          $ref: "#/components/schemas/Generator"
        docs:
          $ref: "#/components/schemas/Docs"
        cloud:
          $ref: "#/components/schemas/RSSCloud"
        ttl:
          $ref: "#/components/schemas/TTL"
        image:
          $ref: "#/components/schemas/Image"
        rating:
          $ref: "#/components/schemas/Rating"
        skipHours:
          $ref: "#/components/schemas/SkipHours"
        skipDays:
          $ref: "#/components/schemas/SkipDays"
        textInput:
          $ref: "#/components/schemas/TextInput"
        contributors:
          description: >
            is a list of contributors to the channel.
          type: array
          items:
            $ref: "rdf.yaml#/components/schemas/Contributor"
          xml:
            name: contributor
          x-oapi-codegen-extra-tags:
            json: "contributor,omitempty"
            xml: "contributor,omitempty"
            validate: "omitempty,dive,unique"
          x-go-type-skip-optional-pointer: true
        creators:
          description: >
            is a list of creators of the channel.
          type: array
          items:
            $ref: "rdf.yaml#/components/schemas/Creator"
          xml:
            name: creator
          x-oapi-codegen-extra-tags:
            json: "creator,omitempty"
            xml: "creator,omitempty"
            validate: "omitempty,dive,unique"
          x-go-type-skip-optional-pointer: true
        coverage:
          $ref: "rdf.yaml#/components/schemas/Coverage"
        format:
          $ref: "rdf.yaml#/components/schemas/Format"
        identifier:
          $ref: "rdf.yaml#/components/schemas/Identifier"
        publisher:
          $ref: "rdf.yaml#/components/schemas/Publisher"
        relation:
          $ref: "rdf.yaml#/components/schemas/Relation"
        rights:
          $ref: "rdf.yaml#/components/schemas/Rights"
        subject:
          $ref: "rdf.yaml#/components/schemas/Subject"
        type:
          $ref: "rdf.yaml#/components/schemas/Type"
        source:
          $ref: "rdf.yaml#/components/schemas/Source"
        language:
          $ref: "rdf.yaml#/components/schemas/Language"
        date:
          $ref: "rdf.yaml#/components/schemas/Date"
        updatePeriod:
          $ref: "rdf.yaml#/components/schemas/UpdatePeriod"
        updateFrequency:
          $ref: "rdf.yaml#/components/schemas/UpdateFrequency"
        updateBase:
          $ref: "rdf.yaml#/components/schemas/UpdateBase"
    Channel:
      description: >
        contains information about the channel (metadata) and its contents.
      x-oapi-codegen-extra-tags:
        xml: "channel"
      allOf:
        - $ref: "#/components/schemas/ChannelMetadata"
        - type: object
          properties:
            items:
              description: >
                is a list of the current items published to the channel.
              type: array
              items:
                $ref: "#/components/schemas/Item"
              xml:
                name: item
              x-oapi-codegen-extra-tags:
                json: "item,omitempty"
                xml: "item,omitempty"
                validate: "omitempty,dive,unique"
              x-go-type-skip-optional-pointer: true
            extensions:
              description: >
                records any elements that are unknown extensions to the schema.
              type: array
              items:
                $ref: "types.yaml#/components/schemas/Extension"
              x-oapi-codegen-extra-tags:
                json: "extensions,omitempty"
                xml: ",any"
              x-go-type-skip-optional-pointer: true
    Item:
      description: >
        An item may represent a "story" -- much like a story in a newspaper or magazine; if so its description is a
        synopsis of the story, and the link points to the full story. An item may also be complete in itself, if so, the
        description contains the text (entity-encoded HTML is allowed; see examples), and the link and title may be
        omitted. All elements of an item are optional, however at least one of title or description must be present.
      type: object
      x-oapi-codegen-extra-tags:
        xml: "item"
      properties:
        title:
          description: >
            is the title of the item.
          allOf:
            - $ref: "rdf.yaml#/components/schemas/Title"
          x-oapi-codegen-extra-tags:
            xml: "title,omitempty"
          example:
            title: Venice Film Festival Tries to Quit Sinking
        links:
          description: >
            is a list of links related to the item.
          type: array
          items:
            $ref: "atom.yaml#/components/schemas/Link"
          x-oapi-codegen-extra-tags:
            xml: "link,omitempty"
        description:
          description: >
            is a phrase or sentence describing the channel.
          allOf:
            - $ref: "rdf.yaml#/components/schemas/Description"
          x-oapi-codegen-extra-tags:
            xml: "description"
          example:
            description: >
              Some of the most heated chatter at the Venice Film Festival this week was about the way that the arrival
              of the stars at the Palazzo del Cinema was being staged.
        author:
          $ref: "#/components/schemas/Author"
        categories:
          description: >
            is a list of categories associated with the channel.
          type: array
          items:
            $ref: "#/components/schemas/Category"
          xml:
            name: category
          x-oapi-codegen-extra-tags:
            json: "category,omitempty"
            xml: "category,omitempty"
            validate: "omitempty,dive,unique"
          x-go-type-skip-optional-pointer: true
        comments:
          $ref: "#/components/schemas/Comments"
        pubDate:
          $ref: "#/components/schemas/PubDate"
        enclosure:
          $ref: "#/components/schemas/Enclosure"
        guid:
          $ref: "#/components/schemas/GUID"
        image:
          $ref: "#/components/schemas/Image"
        ContentEncoded:
          $ref: "rdf.yaml#/components/schemas/ContentEncoded"
        contributors:
          description: >
            is a list of contributors to the item.
          type: array
          items:
            $ref: "rdf.yaml#/components/schemas/Contributor"
          xml:
            name: contributor
          x-oapi-codegen-extra-tags:
            json: "contributor,omitempty"
            xml: "contributor,omitempty"
            validate: "omitempty,dive,unique"
          x-go-type-skip-optional-pointer: true
        creators:
          description: >
            is a list of creators of the item.
          type: array
          items:
            $ref: "rdf.yaml#/components/schemas/Creator"
          xml:
            name: creator
          x-oapi-codegen-extra-tags:
            json: "creator,omitempty"
            xml: "creator,omitempty"
            validate: "omitempty,dive,unique"
          x-go-type-skip-optional-pointer: true
        coverage:
          $ref: "rdf.yaml#/components/schemas/Coverage"
        format:
          $ref: "rdf.yaml#/components/schemas/Format"
        identifier:
          $ref: "rdf.yaml#/components/schemas/Identifier"
        publisher:
          $ref: "rdf.yaml#/components/schemas/Publisher"
        relation:
          $ref: "rdf.yaml#/components/schemas/Relation"
        rights:
          $ref: "rdf.yaml#/components/schemas/Rights"
        subject:
          $ref: "rdf.yaml#/components/schemas/Subject"
        type:
          $ref: "rdf.yaml#/components/schemas/Type"
        source:
          $ref: "#/components/schemas/Source"
        language:
          $ref: "rdf.yaml#/components/schemas/Language"
        date:
          $ref: "rdf.yaml#/components/schemas/Date"
        extensions:
          description: >
            records any elements that are unknown extensions to the schema.
          type: array
          items:
            $ref: "types.yaml#/components/schemas/Extension"
          x-oapi-codegen-extra-tags:
            json: "extensions,omitempty"
            xml: ",any"
          x-go-type-skip-optional-pointer: true
    RSS:
      description: >
        represents an RSS document.
      type: object
      x-go-name: RSS
      required:
        - XMLName
        - version
        - channel
      properties:
        XMLName:
          $ref: "types.yaml#/components/schemas/XMLName"
        channel:
          $ref: "#/components/schemas/Channel"
        version:
          description: >
            specifies the version of RSS that the document conforms to.
          type: string
          x-oapi-codegen-extra-tags:
            xml: "version,attr"
          xml:
            attribute: true
        attributes:
          type: array
          items:
            x-go-type: xml.Attr
          x-oapi-codegen-extra-tags:
            xml: ",any,attr"
            json: "attributes"
          x-go-type-skip-optional-pointer: true

