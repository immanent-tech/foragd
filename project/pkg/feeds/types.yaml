openapi: "3.0.3"
info:
  version: 1.0.0
  title: Common Feed Types
  description: >
    Some common or shared types across schemas
  license:
    name: AGPL-3.0-or-later
    url: https://spdx.org/licenses/AGPL-3.0-only.html
paths: {}
components:
  schemas:
    RequiredValue:
      description: >
        is an element value that is required.
      type: string
      x-oapi-codegen-extra-tags:
        xml: ",chardata"
        validate: "required"
    OptionalValue:
      description: >
        is an element value that is optional.
      type: string
      x-oapi-codegen-extra-tags:
        xml: ",chardata"
    XMLName:
      description: >
        represents the XML namespace of an element.
      x-go-type: "xml.Name"
      x-oapi-codegen-extra-tags:
        json: "xml"
        validate: "required"
    Extension:
      type: object
      required:
        - XMLName
      properties:
        XMLName:
          $ref: "#/components/schemas/XMLName"
        value:
          $ref: "#/components/schemas/OptionalValue"
        attributes:
          description: >
            are any attributes of the extension element.
          type: array
          items:
            x-go-type: xml.Attr
          x-oapi-codegen-extra-tags:
            xml: ",any,attr"
            json: "attributes"
          x-go-type-skip-optional-pointer: true
        extensions:
          descriptions: >
            is any child extensions.
          type: array
          items:
            $ref: "#/components/schemas/Extension"
          x-oapi-codegen-extra-tags:
            json: "extensions,omitempty"
            xml: ",any"
          x-go-type-skip-optional-pointer: true
