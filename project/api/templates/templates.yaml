components:
  schemas:
    Feed:
      $ref: '../models/models.yaml#/components/schemas/APIFeed'
    Item:
      $ref: '../models/models.yaml#/components/schemas/APIItem'
    Page:
      description: >
        represents a page on the website.
      type: object
      required:
        - title
        - content
      properties:
        title:
          description: is the page title.
          type: string
        content:
          description: is the page content.
          x-go-type: 'templ.Component'
          x-go-type-import:
            path: github.com/a-h/templ
        headers:
          description: >
            are additional headers to place in the page <head>
            element.
          type: array
          items:
            x-go-type: 'templ.Component'
            x-go-type-import:
              path: github.com/a-h/templ
          x-go-type-skip-optional-pointer: true
    ComponentType:
      description: defines how the component should be displayed.
      type: string
      enum:
        - 'feed_card'
        - 'item_card'
        - 'item_article'
      x-go-type-name: DisplayType
    Component:
      description: >
        contains data and properties that can be used to display the
        data in the web UI.
      type: object
      required:
        - display_type
        - data_source
      properties:
        display_type:
          $ref: '#/components/schemas/ComponentType'
        data_source:
          description: contains the object to use for displaying the component.
          type: object
          oneOf:
            - $ref: '#/components/schemas/Feed'
            - $ref: '#/components/schemas/Item'
          x-go-type-name: DataSource
        route:
          description: >
            is the route used for performing actions on the
            component.
          $ref: '../models/api.yaml#/components/schemas/APIRoute'
