openapi: '3.0.0'
info:
  version: 1.0.0
  title: Admin API
  description: The admin-only portion of the API, which has its own separate OpenAPI spec
paths:
  /:
    get:
      summary: Index
      operationId: getIndex
      responses:
        200:
          description: Show index page
          content:
            text/html:

  /login/{provider}:
    get:
      summary: Process a user login with given provider
      operationId: getLogin
      tags:
        - login
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to provider
        404:
          description: No provider to satisfy login
        500:
          description: Problem with request

  /login/{provider}/callback:
    get:
      summary: Callback for login provider
      operationId: getLoginCallback
      tags:
        - login
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to home
        401:
          description: Unauthorized
        404:
          description: No provider to satisfy login
        500:
          description: Problem with request

  /logout/{provider}:
    get:
      summary: Logout handler for provider
      operationId: getLogout
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to provider
        500:
          description: Problem with request

  /signup:
    get:
      summary: User sign up
      operationId: getSignup
      responses:
        200:
          description: Show sign up page
          content:
            text/html:
        400:
          description: Bad request (not htmx)
        500:
          description: Error rendering signup form
    post:
      summary: Process sign up request
      operationId: postSignup
      requestBody:
        description: New user information
        content:
          multipart/form-data:
            schema:
              $ref: '../models/api.yaml#/components/schemas/UserSignup'
      responses:
        200:
          description: Show signup results
          content:
            text/html:
        500:
          description: Error processing signup

  /signup/validate:
    post:
      summary: Validate sign up
      operationId: postSignupValidate
      responses:
        200:
          description: Validation completed
          content:
            text/html:
      requestBody:
        description: Item to validate
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '../models/api.yaml#/components/schemas/UserSignup'

  /home:
    get:
      summary: Display user home page
      operationId: getHome
      responses:
        200:
          description: Show index page
          content:
            text/html:
        401:
          description: Unauthorized
        500:
          description: Problem with request
  /home/search:
    post:
      summary: Issue a user search request
      operationId: postHomeSearch
      responses:
        200:
          description: Show search results
          content:
            text/html:
        401:
          description: Unauthorized
        500:
          description: Problem with request
      requestBody:
        description: User search request
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '../models/api.yaml#/components/schemas/SearchRequest'
  /home/settings:
    get:
      summary: Show user settings modal
      operationId: getHomeSettings
      responses:
        200:
          description: Show search results
          content:
            text/html:
        401:
          description: Unauthorized
        500:
          description: Problem with request
  /home/subscription/add:
    get:
      summary: Add a new subscription
      operationId: getSubscriptionAdd
      responses:
        200:
          description: Show the add subscription modal.
          content:
            text/html:
        401:
          description: Unauthorized
        500:
          description: Problem with request
    post:
      summary: Process a new subscription
      operationId: postSubscriptionAdd
      responses:
        200:
          description: Subscription added successfully
        401:
          description: Unauthorized
        500:
          description: Problem with subscription
  /home/subscription/validate:
    post:
      summary: Validate a subscription
      operationId: postSubscriptionValidate
      responses:
        200:
          description: Validation completed
          content:
            text/html:
      requestBody:
        description: Subscription to validate
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '../models/api.yaml#/components/schemas/SubscriptionRequest'
  /home/subscription/edit/{subID}:
    get:
      summary: Edit a new subscription
      operationId: getSubscriptionEdit
      parameters:
        - name: subID
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Show the edit subscription modal.
          content:
            text/html:
        401:
          description: Unauthorized
        500:
          description: Problem with request
    post:
      summary: Process a subscription edit
      operationId: postSubscriptionEdit
      parameters:
        - name: subID
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Subscription edited successfully
        401:
          description: Unauthorized
        500:
          description: Problem with request
  /home/feed/{feedID}:
    get:
      summary: Display a list of feed items, or all feeds if no ID provided
      operationId: getHomeFeed
      parameters:
        - name: feedID
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: List of feeds or feed items
          content:
            text/html:
  /home/feed/{feedID}/{itemID}:
    get:
      summary: Display a feed item, or all feed items if no ID provided, for a feed
      operationId: getHomeFeedItem
      parameters:
        - name: feedID
          in: path
          required: true
          schema:
            type: string
        - name: itemID
          in: path
          required: false
          schema:
            type: string
      responses:
        200:
          description: List of feed items or a feed item
          content:
            text/html:
