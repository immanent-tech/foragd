openapi: '3.1.0'
info:
  version: 1.0.0
  title: Admin API
  description: The admin-only portion of the API, which has its own separate OpenAPI spec
paths:
  /:
    get:
      summary: Index
      operationId: getIndex
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /login/{provider}:
    get:
      summary: Process a user login with given provider
      operationId: getLogin
      tags:
        - login
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to provider
        404:
          description: No provider to satisfy login
        500:
          description: Problem with request
  /login/{provider}/callback:
    get:
      summary: Callback for login provider
      operationId: getLoginCallback
      tags:
        - login
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to home
        401:
          description: Unauthorized
        404:
          description: No provider to satisfy login
        500:
          description: Problem with request
  /logout/{provider}:
    get:
      summary: Logout handler for provider
      operationId: getLogout
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to provider
        500:
          description: Problem with request
  /signup:
    get:
      summary: User sign up
      operationId: getSignup
      responses:
        200:
          description: Show sign up page
          content:
            text/html: {}
        400:
          description: Bad request (not htmx)
        500:
          description: Error rendering signup form
    post:
      summary: Process sign up request
      operationId: postSignup
      requestBody:
        description: New user information
        content:
          multipart/form-data:
            schema:
              $ref: '../models/api.yaml#/components/schemas/APIUser'
      responses:
        200:
          $ref: '#/components/responses/htmx'
        500:
          description: Error processing signup
  /signup/validate:
    post:
      summary: Validate sign up
      operationId: postSignupValidate
      responses:
        200:
          description: Validation completed
          content:
            text/html: {}
      requestBody:
        description: Item to validate
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '../models/api.yaml#/components/schemas/APIUser'
  /search:
    post:
      summary: Issue a user search request
      operationId: Search
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with request
      # requestBody:
      #   description: filters for results
      #   content:
      #     application/x-www-form-urlencoded:
      #       schema:
      #         $ref: '../models/api.yaml#/components/schemas/Filters'
  /home/settings:
    get:
      summary: Show user settings modal
      operationId: getHomeSettings
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with request
  /home/subscription/add:
    get:
      summary: Add a new subscription
      operationId: getSubscriptionAdd
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with request
    post:
      summary: Process a new subscription
      operationId: postSubscriptionAdd
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with subscription
  /home/subscription/validate:
    post:
      summary: Validate a subscription
      operationId: postSubscriptionValidate
      responses:
        200:
          $ref: '#/components/responses/htmx'
      requestBody:
        description: Subscription to validate
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '../models/api.yaml#/components/schemas/APISubscription'
  /home/subscription/edit/{subID}:
    get:
      summary: Edit a new subscription
      operationId: getSubscriptionEdit
      parameters:
        - name: subID
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with request
    post:
      summary: Process a subscription edit
      operationId: postSubscriptionEdit
      parameters:
        - name: subID
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with request
  /home/show/{list}:
    get:
      summary: show a list of feeds/items with optional filtering.
      operationId: showList
      parameters:
        - $ref: '#/components/parameters/List'
          required: true
        - $ref: '#/components/parameters/Feeds'
        - $ref: '#/components/parameters/Items'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/Pagination'
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /home/mark/{list}/{action}:
    post:
      summary: marks the list of feeds/items with optional filtering as read.
      operationId: markList
      parameters:
        - $ref: '#/components/parameters/List'
          required: true
        - $ref: '#/components/parameters/Action'
          required: true
        - $ref: '#/components/parameters/Feeds'
        - $ref: '#/components/parameters/Items'
        - $ref: '#/components/parameters/Categories'
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /home/show/{feed}/{item}:
    get:
      summary: display an item.
      operationId: showArticle
      parameters:
        - $ref: '#/components/parameters/FeedID'
          required: true
        - $ref: '#/components/parameters/ItemID'
          required: true
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /home/mark/{action}/{feed}/{item}:
    post:
      summary: mark an article as read.
      operationId: markArticle
      parameters:
        - $ref: '#/components/parameters/FeedID'
          required: true
        - $ref: '#/components/parameters/ItemID'
          required: true
        - $ref: '#/components/parameters/Action'
          required: true
      responses:
        200:
          $ref: '#/components/responses/htmx'
components:
  parameters:
    Feeds:
      name: feeds
      in: query
      schema:
        $ref: '../models/api.yaml#/components/schemas/FeedIDs'
    Items:
      name: items
      in: query
      schema:
        $ref: '../models/api.yaml#/components/schemas/ItemIDs'
    Categories:
      name: categories
      in: query
      schema:
        $ref: '../models/api.yaml#/components/schemas/Categories'
    FeedID:
      name: feed
      in: path
      schema:
        $ref: '../models/api.yaml#/components/schemas/FeedID'
    ItemID:
      name: item
      in: path
      schema:
        $ref: '../models/api.yaml#/components/schemas/ItemID'
    Category:
      name: category
      in: path
      schema:
        $ref: '../models/api.yaml#/components/schemas/Category'
    Pagination:
      name: pagination
      in: query
      schema:
        type: string
    List:
      name: list
      in: path
      schema:
        type: string
        enum: [feeds, items]
    Action:
      name: action
      in: path
      schema:
        type: string
        enum: [read, unread]
    Count:
      name: count
      in: query
      schema:
        $ref: '../models/api.yaml#/components/schemas/Count'
  responses:
    htmx:
      description: standard htmx powered response.
      content:
        'text/html;charset=utf-8': {}
