openapi: '3.1.0'
info:
  version: 1.0.0
  title: Admin API
  description: The admin-only portion of the API, which has its own separate OpenAPI spec
paths:
  /:
    get:
      description: display the home page.
      operationId: index
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /login/{provider}:
    get:
      summary: Process a user login with given provider
      operationId: login
      tags:
        - login
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to provider
        404:
          description: No provider to satisfy login
        500:
          description: Problem with request
  /login/{provider}/callback:
    get:
      summary: Callback for login provider
      operationId: loginCallback
      tags:
        - login
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to home
        401:
          description: Unauthorized
        404:
          description: No provider to satisfy login
        500:
          description: Problem with request
  /logout/{provider}:
    get:
      summary: Logout handler for provider
      operationId: logout
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to provider
        500:
          description: Problem with request
  /signup:
    summary: Display a sign-up form.
    get:
      summary: User sign up
      operationId: signup
      responses:
        200:
          $ref: '#/components/responses/htmx'
        400:
          description: Bad request (not htmx)
        500:
          description: Error rendering signup form
    post:
      summary: Process sign up request
      operationId: processSignup
      requestBody:
        description: New user information
        content:
          multipart/form-data:
            schema:
              $ref: '../models/api.yaml#/components/schemas/UserSignup'
      responses:
        200:
          $ref: '#/components/responses/htmx'
        500:
          description: Error processing signup
  /search:
    post:
      summary: Issue a user search request
      operationId: Search
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with request
      # requestBody:
      #   description: filters for results
      #   content:
      #     application/x-www-form-urlencoded:
      #       schema:
      #         $ref: '../models/api.yaml#/components/schemas/Filters'
  /home/settings:
    get:
      summary: Show user settings modal
      operationId: getHomeSettings
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with request
  /home/subscription/add:
    get:
      summary: Add a new subscription
      operationId: addSubscription
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with request
    post:
      summary: Process a new subscription
      operationId: processAddSubscription
      requestBody:
        description: New user information
        content:
          multipart/form-data:
            schema:
              $ref: '../models/api.yaml#/components/schemas/SubscriptionRequest'
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with subscription
  /home/subscription/edit/{feed}:
    get:
      summary: Edit a new subscription
      operationId: getSubscriptionEdit
      parameters:
        - $ref: '#/components/parameters/FeedID'
          required: true
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with request
    post:
      summary: Process a subscription edit
      operationId: postSubscriptionEdit
      parameters:
        - $ref: '#/components/parameters/FeedID'
          required: true
      requestBody:
        description: New user information
        content:
          multipart/form-data:
            schema:
              $ref: '../models/api.yaml#/components/schemas/SubscriptionRequest'
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with request
  /home/show/{kind}:
    get:
      description: display of feeds or items with optional filtering.
      operationId: showList
      parameters:
        - $ref: '#/components/parameters/Kind'
          required: true
        - $ref: '#/components/parameters/Feeds'
        - $ref: '#/components/parameters/Items'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/ShowUnread'
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /home/show/article/{feed}/{item}:
    get:
      description: display an item.
      operationId: showArticle
      parameters:
        - $ref: '#/components/parameters/FeedID'
          required: true
        - $ref: '#/components/parameters/ItemID'
          required: true
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /home/set/{kind}/{action}:
    post:
      description: perform an action on a set of feeds/items.
      operationId: listAction
      parameters:
        - $ref: '#/components/parameters/Kind'
          required: true
        - $ref: '#/components/parameters/Action'
          required: true
        - $ref: '#/components/parameters/Feeds'
        - $ref: '#/components/parameters/Items'
        - $ref: '#/components/parameters/Categories'
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /home/set/article/{action}/{feed}/{item}:
    post:
      description: perform an action on a feed item.
      operationId: articleAction
      parameters:
        - $ref: '#/components/parameters/FeedID'
          required: true
        - $ref: '#/components/parameters/ItemID'
          required: true
        - $ref: '#/components/parameters/Action'
          required: true
      responses:
        200:
          $ref: '#/components/responses/htmx'
components:
  parameters:
  # Query parameters:
    Feeds:
      name: feeds
      in: query
      schema:
        $ref: '../models/api.yaml#/components/schemas/FeedIDs'
    Items:
      name: items
      in: query
      schema:
        $ref: '../models/api.yaml#/components/schemas/ItemIDs'
    Categories:
      name: categories
      in: query
      schema:
        $ref: '../models/api.yaml#/components/schemas/Categories'
    ShowUnread:
      name: show_unread
      in: query
      schema:
        $ref: '../models/api.yaml#/components/schemas/ShowUnread'
    Pagination:
      name: pagination
      in: query
      schema:
        type: string
    Count:
      name: count
      in: query
      schema:
        $ref: '../models/api.yaml#/components/schemas/Count'
        minimum: 1
        maximum: 20
        default: 10
  # Path parameters:
    FeedID:
      name: feed
      in: path
      schema:
        $ref: '../models/api.yaml#/components/schemas/FeedID'
    ItemID:
      name: item
      in: path
      schema:
        $ref: '../models/api.yaml#/components/schemas/ItemID'
    Category:
      name: category
      in: path
      schema:
        $ref: '../models/api.yaml#/components/schemas/Category'
    Kind:
      name: kind
      description: describes the type(s) of objects to act on.
      in: path
      schema:
        type: string
        enum: [feeds, items, article]
    Action:
      name: action
      description: describes the type of action to perform on the item(s).
      in: path
      schema:
        type: string
        enum: [read, unread]
  responses:
    htmx:
      description: standard htmx powered response.
      content:
        'text/html;charset=utf-8': {}
