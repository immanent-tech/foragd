openapi: '3.1.0'
info:
  version: 1.0.0
  title: Admin API
  description: The admin-only portion of the API, which has its own separate OpenAPI spec
paths:
  /:
    get:
      description: display the home page.
      operationId: index
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /login/{provider}:
    get:
      summary: Process a user login with given provider
      operationId: login
      tags:
        - login
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to provider
        404:
          description: No provider to satisfy login
        500:
          description: Problem with request
  /login/{provider}/callback:
    get:
      summary: Callback for login provider
      operationId: loginCallback
      tags:
        - login
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to home
        401:
          description: Unauthorized
        404:
          description: No provider to satisfy login
        500:
          description: Problem with request
  /logout/{provider}:
    get:
      summary: Logout handler for provider
      operationId: logout
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to provider
        500:
          description: Problem with request
  /signup:
    summary: Display a sign-up form.
    get:
      summary: User sign up
      operationId: signup
      responses:
        200:
          $ref: '#/components/responses/htmx'
        400:
          description: Bad request (not htmx)
        500:
          description: Error rendering signup form
    post:
      summary: Process sign up request
      operationId: processSignup
      requestBody:
        description: New user information
        content:
          multipart/form-data:
            schema:
              $ref: '../models/api.yaml#/components/schemas/UserSignup'
      responses:
        200:
          $ref: '#/components/responses/htmx'
        500:
          description: Error processing signup
  /search:
    post:
      summary: Issue a user search request
      operationId: Search
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with request
      # requestBody:
      #   description: filters for results
      #   content:
      #     application/x-www-form-urlencoded:
      #       schema:
      #         $ref: '../models/api.yaml#/components/schemas/Filters'
  /home/settings:
    get:
      summary: Show user settings modal
      operationId: getHomeSettings
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with request
  /subscription/new:
    get:
      description: >
        Add a new subscription.
      operationId: newSubscription
      responses:
        200:
          $ref: '#/components/responses/htmx'
    put:
      summary: >
        Save a subscription.
      operationId: addSubscription
      requestBody:
        $ref: '#/components/requestBodies/SubscriptionRequestBody'
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /subscription/{feed}:
    get:
      summary: >
        Show a subscription.
      operationId: showSubscription
      parameters:
        - $ref: '#/components/parameters/FeedID'
      responses:
        200:
          $ref: '#/components/responses/htmx'
    put:
      summary: >
        Save a subscription.
      operationId: saveSubscription
      parameters:
        - $ref: '#/components/parameters/FeedID'
      requestBody:
        $ref: '#/components/requestBodies/SubscriptionRequestBody'
      responses:
        200:
          $ref: '#/components/responses/htmx'
    delete:
      summary: >
        Remove a subscription.
      operationId: removeSubscription
      parameters:
        - $ref: '#/components/parameters/FeedID'
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /subscription/category:
    put:
      summary: >
        Add a category to a subscription
      operationId: addSubscriptionCategory
      requestBody:
        $ref: '#/components/requestBodies/CategoryRequestBody'
      responses:
        200:
          $ref: '#/components/responses/htmx'
    delete:
      summary: >
        Remove a category from a subscription.
      operationId: removeSubscriptionCategory
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /home/show/feeds:
    get:
      description: >
        Show feeds with optional filtering.
      operationId: showFeeds
      parameters:
        # Query:
        - $ref: '#/components/parameters/Feeds'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/View'
  /home/{action}/feeds:
    post:
      description: >
        Perform action on feeds with optional filtering.
      operationId: actionFeeds
      parameters:
        # Path:
        - $ref: '#/components/parameters/Action'
        # Query:
        - $ref: '#/components/parameters/Feeds'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/View'
  /home/show/items:
    get:
      description: >
        Show items with optional filtering.
      operationId: showItems
      parameters:
        # Query:
        - $ref: '#/components/parameters/Feeds'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/View'
  /home/{action}/items:
    post:
      description: >
        Perform action on items with optional filtering.
      operationId: showItems
      parameters:
        # Query:
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/View'
  /home/{feed}/{item}:
    get:
      description: >
        Perform action on feeds with optional filtering.
      operationId: showItem
      parameters:
        - $ref: '#/components/parameters/FeedID'
        - $ref: '#/components/parameters/ItemID'
      responses:
        200:
          $ref: '#/components/responses/htmx'
    put:
      description: >
        Save an item.
      operationId: saveItem
      parameters:
        - $ref: '#/components/parameters/FeedID'
        - $ref: '#/components/parameters/ItemID'
      responses:
        200:
          $ref: '#/components/responses/htmx'
    delete:
      description: >
        Remove a saved item.
      operationId: unsaveItem
      parameters:
        - $ref: '#/components/parameters/FeedID'
        - $ref: '#/components/parameters/ItemID'
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /home/{action}/{feed}/{item}:
    post:
      description: >
        Perform action on item.
      operationId: actionItem
      parameters:
        - $ref: '#/components/parameters/FeedID'
        - $ref: '#/components/parameters/ItemID'
        - $ref: '#/components/parameters/Action'
      responses:
        200:
          $ref: '#/components/responses/htmx'
components:
  requestBodies:
    SubscriptionRequestBody:
      description: >
        Holds details for adding/saving a subscription.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../models/api.yaml#/components/schemas/APISubscriptionRequest'
    CategoryRequestBody:
      description: >
        A list of categories to add/remove from a subscription.
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required:
              - Category
            properties:
              Category:
                $ref: '../models/api.yaml#/components/schemas/Category'
  parameters:
  # Query parameters:
    FeedIDs:
      name: subscriptions
      description: An array of Feed IDs.
      in: query
      schema:
        type: array
        items:
          $ref: '../models/api.yaml#/components/schemas/FeedID'
        x-go-type-skip-optional-pointer: true
        x-oapi-codegen-extra-tags:
          json: 'subscriptions'
          form: 'subscriptions[]'
        nullable: true
    ItemIDs:
      name: items
      description: An array of Item IDs.
      in: query
      schema:
        type: array
        items:
          $ref: '../models/api.yaml#/components/schemas/ItemID'
        x-go-type-skip-optional-pointer: true
        x-oapi-codegen-extra-tags:
          json: 'items'
          form: 'items[]'
        nullable: true
    Categories:
      name: categories
      description: An array of Categories.
      in: query
      schema:
        type: array
        items:
          $ref: '../models/api.yaml#/components/schemas/Category'
        x-go-type-skip-optional-pointer: true
        x-oapi-codegen-extra-tags:
          json: 'categories'
          form: 'categories[]'
    Pagination:
      name: pagination
      in: query
      schema:
        $ref: '../models/api.yaml#/components/schemas/Pagination'
    Count:
      name: count
      in: query
      schema:
        $ref: '../models/api.yaml#/components/schemas/Count'
    View:
      name: view
      in: query
      schema:
        $ref: '../models/api.yaml#/components/schemas/View'
  # Path parameters:
    List:
      name: list
      in: path
      schema:
        $ref: '../models/api.yaml#/components/schemas/List'
    Action:
      name: action
      in: path
      schema:
        $ref: '../models/api.yaml#/components/schemas/Action'
    FeedID:
      name: feed
      in: path
      schema:
        $ref: '../models/api.yaml#/components/schemas/FeedID'
    ItemID:
      name: item
      in: path
      schema:
        $ref: '../models/api.yaml#/components/schemas/ItemID'
  responses:
    htmx:
      description: standard htmx powered response.
      content:
        'text/html;charset=utf-8': {}
