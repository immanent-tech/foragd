openapi: '3.1.0'
info:
  version: 1.0.0
  title: Admin API
  description: The admin-only portion of the API, which has its own separate OpenAPI spec
paths:
  /:
    get:
      description: display the home page.
      operationId: index
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /login/{provider}:
    get:
      summary: Process a user login with given provider
      operationId: login
      tags:
        - login
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to provider
        404:
          description: No provider to satisfy login
        500:
          description: Problem with request
  /login/{provider}/callback:
    get:
      summary: Callback for login provider
      operationId: loginCallback
      tags:
        - login
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to home
        401:
          description: Unauthorized
        404:
          description: No provider to satisfy login
        500:
          description: Problem with request
  /logout/{provider}:
    get:
      summary: Logout handler for provider
      operationId: logout
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to provider
        500:
          description: Problem with request
  /user/new:
    get:
      description: >
        Add a new user.
      operationId: newUser
      responses:
        200:
          $ref: '#/components/responses/htmx'
    put:
      summary: >
        Save a new user.
      operationId: addUser
      requestBody:
        $ref: '#/components/requestBodies/UserSignupRequestBody'
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /search:
    post:
      summary: Issue a user search request
      operationId: Search
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with request
      # requestBody:
      #   description: filters for results
      #   content:
      #     application/x-www-form-urlencoded:
      #       schema:
      #         $ref: '../models/models.yaml#/components/schemas/Filters'
  /home/settings:
    get:
      summary: Show user settings modal
      operationId: getHomeSettings
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with request
  /subscription/new:
    get:
      description: >
        Add a new subscription.
      operationId: newSubscription
      responses:
        200:
          $ref: '#/components/responses/htmx'
    put:
      summary: >
        Save a subscription.
      operationId: addSubscription
      requestBody:
        $ref: '#/components/requestBodies/SubscriptionRequestBody'
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /subscription/{feed}:
    get:
      summary: >
        Show a subscription.
      operationId: showSubscription
      parameters:
        - $ref: '#/components/parameters/FeedID'
      responses:
        200:
          $ref: '#/components/responses/htmx'
    put:
      summary: >
        Save a subscription.
      operationId: saveSubscription
      parameters:
        - $ref: '#/components/parameters/FeedID'
      requestBody:
        $ref: '#/components/requestBodies/SubscriptionRequestBody'
      responses:
        200:
          $ref: '#/components/responses/htmx'
    delete:
      summary: >
        Remove a subscription.
      operationId: removeSubscription
      parameters:
        - $ref: '#/components/parameters/FeedID'
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /subscription/category:
    put:
      summary: >
        Add a category to a subscription
      operationId: addSubscriptionCategory
      requestBody:
        $ref: '#/components/requestBodies/CategoryRequestBody'
      responses:
        200:
          $ref: '#/components/responses/htmx'
    delete:
      summary: >
        Remove a category from a subscription.
      operationId: removeSubscriptionCategory
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /home:
    get:
      summary: >
        Shows a page of curated feeds and content based on the user's
        subscriptions and viewing preferences.
      operationId: handleHome
  /home/feeds:
    parameters:
      - $ref: '#/components/parameters/Categories'
      - $ref: '#/components/parameters/View'
      - $ref: '#/components/parameters/Count'
    get:
      summary: >
        Shows subscribed feeds grouped by categories.
      operationId: handleShowFeeds
    post:
      summary: >
        Mark feeds.
      operationId: handleMarkFeeds
      requestBody:
        $ref: '#/components/requestBodies/MarkBody'
  /home/feed/{feed}:
    summary: >
      Handle feed.
    parameters:
      # Path:
      - $ref: '#/components/parameters/FeedID'
      # Query:
      - $ref: '#/components/parameters/View'
      - $ref: '#/components/parameters/Count'
    get:
      summary: >
        Show items for a feed.
      operationID: handleShowFeedItems
      parameters:
        - $ref: '#/components/parameters/Categories'
    post:
      summary: >
        Mark items for a feed.
      operationID: handleMarkFeedItems
      requestBody:
        $ref: '#/components/requestBodies/MarkBody'
      parameters:
        - $ref: '#/components/parameters/Categories'
  /home/feed/{feed}/item/{item}:
    summary: >
      Handle item.
    parameters:
      - $ref: '#/components/parameters/FeedID'
      - $ref: '#/components/parameters/ItemID'
    get:
      summary: >
        Shows a feed item.
      operationID: handleShowItem
    put:
      summary: >
        Save a feed item to the user's saved items.
      operationID: handleSaveItem
    delete:
      summary: >
        Remove a feed item from the user's saved items.
      operationID: handleUnsaveItem
    post:
      summary: >
        Mark a feed item.
      operationID: handleMarkItem
      requestBody:
        $ref: '#/components/requestBodies/MarkBody'
components:
  schemas:
    ObjectType:
      description: is a type of object.
      name: ObjectType
      type: string
      enum: ["feeds","items"]
    Mark:
      name: mark
      description: describes what type of mark to set.
      schema:
        $ref: '../models/api.yaml#/components/schemas/Mark'
    FeedIDs:
      name: feeds
      description: An array of Feed IDs.
      in: query
      schema:
        type: array
        items:
          $ref: '../models/models.yaml#/components/schemas/FeedID'
        x-oapi-codegen-extra-tags:
          form: 'feeds[]'
    ItemIDs:
      name: items
      description: An array of Item IDs.
      in: query
      schema:
        type: array
        items:
          $ref: '../models/models.yaml#/components/schemas/ItemID'
        x-oapi-codegen-extra-tags:
          form: 'items[]'
  requestBodies:
    MarkBody:
      description: >
        Holds details for marking feed/items.
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required:
              - mark
            properties:
              mark:
                $ref: '../models/api.yaml#/components/schemas/Mark'
              feeds:
                type: array
                items:
                  $ref: '../models/models.yaml#/components/schemas/FeedID'
                x-oapi-codegen-extra-tags:
                  form: 'feeds'
                # nullable: true
              items:
                type: array
                items:
                  $ref: '../models/models.yaml#/components/schemas/ItemID'
                x-oapi-codegen-extra-tags:
                  form: 'items'
                # nullable: true
    UserSignupRequestBody:
      description: >
        Holds details for adding/saving a user signup.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../models/api.yaml#/components/schemas/APIUserSignupRequest'
    SubscriptionRequestBody:
      description: >
        Holds details for adding/saving a subscription.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../models/api.yaml#/components/schemas/APISubscriptionRequest'
    CategoryRequestBody:
      description: >
        A list of categories to add/remove from a subscription.
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required:
              - Category
            properties:
              Category:
                $ref: '../models/models.yaml#/components/schemas/Category'
  parameters:
    # Path parameters:
    FeedID:
      name: feed
      in: path
      schema:
        $ref: '../models/models.yaml#/components/schemas/FeedID'
    ItemID:
      name: item
      in: path
      schema:
        $ref: '../models/models.yaml#/components/schemas/ItemID'
    # Query Parameters:
    View:
      name: view
      in: query
      required: true
      schema:
        $ref: '../models/api.yaml#/components/schemas/View'
    Count:
      name: count
      in: query
      required: true
      schema:
        type: string
        $ref: '../models/api.yaml#/components/schemas/Count'
    Categories:
      name: categories
      description: An array of Categories.
      in: query
      schema:
        type: array
        items:
          $ref: '../models/models.yaml#/components/schemas/Category'
        x-oapi-codegen-extra-tags:
          json: 'categories'
          form: 'categories[]'
        # x-go-type-skip-optional-pointer: true
  responses:
    htmx:
      description: standard htmx powered response.
      content:
        'text/html;charset=utf-8': {}
