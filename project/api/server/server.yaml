openapi: '3.1.0'
info:
  version: 1.0.0
  title: Admin API
  description: The admin-only portion of the API, which has its own separate OpenAPI spec
paths:
  /:
    get:
      description: display the home page.
      operationId: index
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /login/{provider}:
    get:
      summary: Process a user login with given provider
      operationId: login
      tags:
        - login
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to provider
        404:
          description: No provider to satisfy login
        500:
          description: Problem with request
  /login/{provider}/callback:
    get:
      summary: Callback for login provider
      operationId: loginCallback
      tags:
        - login
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to home
        401:
          description: Unauthorized
        404:
          description: No provider to satisfy login
        500:
          description: Problem with request
  /logout/{provider}:
    get:
      summary: Logout handler for provider
      operationId: logout
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to provider
        500:
          description: Problem with request
  /user/new:
    get:
      description: >
        Add a new user.
      operationId: newUser
      responses:
        200:
          $ref: '#/components/responses/htmx'
    put:
      summary: >
        Save a new user.
      operationId: addUser
      requestBody:
        $ref: '#/components/requestBodies/UserSignupRequestBody'
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /search:
    post:
      summary: Issue a user search request
      operationId: Search
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with request
      # requestBody:
      #   description: filters for results
      #   content:
      #     application/x-www-form-urlencoded:
      #       schema:
      #         $ref: '../models/models.yaml#/components/schemas/Filters'
  /home/settings:
    get:
      summary: Show user settings modal
      operationId: getHomeSettings
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with request
  /subscription/new:
    get:
      description: >
        Add a new subscription.
      operationId: newSubscription
      responses:
        200:
          $ref: '#/components/responses/htmx'
    put:
      summary: >
        Save a subscription.
      operationId: addSubscription
      requestBody:
        $ref: '#/components/requestBodies/SubscriptionRequestBody'
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /subscription/{feed}:
    get:
      summary: >
        Show a subscription.
      operationId: showSubscription
      parameters:
        - $ref: '#/components/parameters/FeedID'
      responses:
        200:
          $ref: '#/components/responses/htmx'
    put:
      summary: >
        Save a subscription.
      operationId: saveSubscription
      parameters:
        - $ref: '#/components/parameters/FeedID'
      requestBody:
        $ref: '#/components/requestBodies/SubscriptionRequestBody'
      responses:
        200:
          $ref: '#/components/responses/htmx'
    delete:
      summary: >
        Remove a subscription.
      operationId: removeSubscription
      parameters:
        - $ref: '#/components/parameters/FeedID'
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /subscription/category:
    put:
      summary: >
        Add a category to a subscription
      operationId: addSubscriptionCategory
      requestBody:
        $ref: '#/components/requestBodies/CategoryRequestBody'
      responses:
        200:
          $ref: '#/components/responses/htmx'
    delete:
      summary: >
        Remove a category from a subscription.
      operationId: removeSubscriptionCategory
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /home/show/{type}:
    get:
      summary: >
        Show object(s) of given {type} with optional filtering.
      operationId: handleShowObjects
      parameters:
        - $ref: '#/components/parameters/Type'
        # Query:
        - $ref: '#/components/parameters/FeedIDs'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/View'
  /home/paginate/{type}/{pagination}:
    get:
      summary: >
        Paginate through object(s) of given {type} with optional filtering.
      operationId: handlePaginateObjects
      parameters:
        - $ref: '#/components/parameters/Type'
        - $ref: '#/components/parameters/Pagination'
        # Query:
        - $ref: '#/components/parameters/FeedIDs'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/View'
  /home/{action}/{type}:
    post:
      summary: >
        Perform {action} on object(s) of given {type} with optional filtering.
      operationId: handleActionObjects
      parameters:
        # Path:
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/Type'
        # Query:
        - $ref: '#/components/parameters/FeedIDs'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/View'
  /home/show/{feed}/{item}:
    get:
      description: >
        Show item.
      operationId: handleShowItem
      parameters:
        - $ref: '#/components/parameters/FeedID'
        - $ref: '#/components/parameters/ItemID'
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /home/{action}/{feed}/{item}:
    put:
      description: >
        Perform action on item.
      operationId: handleActionItem
      parameters:
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/FeedID'
        - $ref: '#/components/parameters/ItemID'
      responses:
        200:
          $ref: '#/components/responses/htmx'
components:
  schemas:
    Action:
      description: is an action to perform on object(s).
      name: action
      type: string
      enum: ["save","remove","share","edit","markread","markunread"]
    ObjectType:
      description: is a type of object.
      name: ObjectType
      type: string
      enum: ["feeds","items"]
  requestBodies:
    UserSignupRequestBody:
      description: >
        Holds details for adding/saving a user signup.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../models/api.yaml#/components/schemas/APIUserSignupRequest'
    SubscriptionRequestBody:
      description: >
        Holds details for adding/saving a subscription.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../models/api.yaml#/components/schemas/APISubscriptionRequest'
    CategoryRequestBody:
      description: >
        A list of categories to add/remove from a subscription.
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required:
              - Category
            properties:
              Category:
                $ref: '../models/models.yaml#/components/schemas/Category'
  parameters:
    Action:
      name: action
      in: path
      schema:
        $ref: '#/components/schemas/Action'
    Type:
      name: type
      in: path
      schema:
        $ref: '#/components/schemas/ObjectType'
    Pagination:
      name: pagination
      in: path
      schema:
        $ref: '../models/api.yaml#/components/schemas/Pagination'

  # Query parameters:
    FeedIDs:
      name: feeds
      description: An array of Feed IDs.
      in: query
      schema:
        type: array
        items:
          $ref: '../models/models.yaml#/components/schemas/FeedID'
        x-oapi-codegen-extra-tags:
          json: 'feeds'
          form: 'feeds[]'
    ItemIDs:
      name: items
      description: An array of Item IDs.
      in: query
      schema:
        type: array
        items:
          $ref: '../models/models.yaml#/components/schemas/ItemID'
        x-oapi-codegen-extra-tags:
          json: 'items'
          form: 'items[]'
    Categories:
      name: categories
      description: An array of Categories.
      in: query
      schema:
        type: array
        items:
          $ref: '../models/models.yaml#/components/schemas/Category'
        x-oapi-codegen-extra-tags:
          json: 'categories'
          form: 'categories[]'
    Count:
      name: count
      in: query
      schema:
        type: string
        $ref: '../models/api.yaml#/components/schemas/Count'
    View:
      name: view
      in: query
      schema:
        $ref: '../models/api.yaml#/components/schemas/View'
  # Path parameters:
    FeedID:
      name: feed
      in: path
      schema:
        $ref: '../models/models.yaml#/components/schemas/FeedID'
    ItemID:
      name: item
      in: path
      schema:
        $ref: '../models/models.yaml#/components/schemas/ItemID'
  responses:
    htmx:
      description: standard htmx powered response.
      content:
        'text/html;charset=utf-8': {}
