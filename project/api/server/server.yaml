openapi: '3.1.0'
info:
  version: 1.0.0
  title: Admin API
  description: The admin-only portion of the API, which has its own separate OpenAPI spec
paths:
  /:
    get:
      description: display the home page.
      operationId: index
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /login/{provider}:
    get:
      summary: Process a user login with given provider
      operationId: login
      tags:
        - login
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to provider
        404:
          description: No provider to satisfy login
        500:
          description: Problem with request
  /login/{provider}/callback:
    get:
      summary: Callback for login provider
      operationId: loginCallback
      tags:
        - login
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to home
        401:
          description: Unauthorized
        404:
          description: No provider to satisfy login
        500:
          description: Problem with request
  /logout/{provider}:
    get:
      summary: Logout handler for provider
      operationId: logout
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        307:
          description: Redirect to provider
        500:
          description: Problem with request
  /user/new:
    get:
      description: >
        Add a new user.
      operationId: newUser
      responses:
        200:
          $ref: '#/components/responses/htmx'
    put:
      summary: >
        Save a new user.
      operationId: addUser
      requestBody:
        $ref: '#/components/requestBodies/UserSignupRequestBody'
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /search:
    post:
      summary: Issue a user search request
      operationId: Search
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with request
      # requestBody:
      #   description: filters for results
      #   content:
      #     application/x-www-form-urlencoded:
      #       schema:
      #         $ref: '../models/models.yaml#/components/schemas/Filters'
  /home/settings:
    get:
      summary: Show user settings modal
      operationId: getHomeSettings
      responses:
        200:
          $ref: '#/components/responses/htmx'
        401:
          description: Unauthorized
        500:
          description: Problem with request
  /subscription/new:
    get:
      description: >
        Add a new subscription.
      operationId: newSubscription
      responses:
        200:
          $ref: '#/components/responses/htmx'
    put:
      summary: >
        Save a subscription.
      operationId: addSubscription
      requestBody:
        $ref: '#/components/requestBodies/SubscriptionRequestBody'
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /subscription/{feed}:
    get:
      summary: >
        Show a subscription.
      operationId: showSubscription
      parameters:
        - $ref: '#/components/parameters/FeedID'
      responses:
        200:
          $ref: '#/components/responses/htmx'
    put:
      summary: >
        Save a subscription.
      operationId: saveSubscription
      parameters:
        - $ref: '#/components/parameters/FeedID'
      requestBody:
        $ref: '#/components/requestBodies/SubscriptionRequestBody'
      responses:
        200:
          $ref: '#/components/responses/htmx'
    delete:
      summary: >
        Remove a subscription.
      operationId: removeSubscription
      parameters:
        - $ref: '#/components/parameters/FeedID'
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /subscription/category:
    put:
      summary: >
        Add a category to a subscription
      operationId: addSubscriptionCategory
      requestBody:
        $ref: '#/components/requestBodies/CategoryRequestBody'
      responses:
        200:
          $ref: '#/components/responses/htmx'
    delete:
      summary: >
        Remove a category from a subscription.
      operationId: removeSubscriptionCategory
      responses:
        200:
          $ref: '#/components/responses/htmx'
  /home:
    get:
      summary: >
        Shows a page of curated feeds and content based on the user's
        subscriptions and viewing preferences.
      operationId: handleHome
  /home/feeds:
    get:
      summary: >
        Shows feeds with optional filtering applied.
      operationId: handleShowFeeds
      parameters:
        - $ref: '#/components/parameters/FeedIDs'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Count'
    post:
      summary: >
        Mark feeds.
      operationId: handleMarkFeeds
      requestBody:
        $ref: '#/components/requestBodies/MarkMultiple'
  /home/items:
    get:
      summary: >
        Shows items with optional filtering applied.
      operationId: handleShowItems
      parameters:
        - $ref: '#/components/parameters/FeedIDs'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Count'
    post:
      summary: >
        Mark feeds.
      operationId: handleMarkItems
      requestBody:
        $ref: '#/components/requestBodies/MarkMultiple'
  /home/{feed}/{item}:
    summary: >
      Handle item.
    parameters:
      - $ref: '#/components/parameters/FeedID'
      - $ref: '#/components/parameters/ItemID'
    get:
      summary: >
        Shows a feed item.
      operationID: handleShowItem
    put:
      summary: >
        Save a feed item to the user's saved items.
      operationID: handleSaveItem
    delete:
      summary: >
        Remove a feed item from the user's saved items.
      operationID: handleUnsaveItem
    post:
      summary: >
        Mark a feed item.
      operationID: handleMarkItem
      requestBody:
        $ref: '#/components/requestBodies/Mark'
components:
  schemas:
    Mark:
      $ref: '../models/api.yaml#/components/schemas/Mark'
    MarkMultipleRequest:
      description: contains data for marking multiple objects.
      type: object
      required:
        - mark
      properties:
        mark:
          $ref: '../models/api.yaml#/components/schemas/Mark'
        feeds:
          $ref: '../models/models.yaml#/components/schemas/FeedIDs'
        items:
          $ref: '../models/models.yaml#/components/schemas/ItemIDs'
        categories:
          $ref: '../models/models.yaml#/components/schemas/Categories'
    IDs:
      name: ids
      description: An array of either Feed or Item IDs.
      type: array
      items:
        oneOf:
          - $ref: '../models/models.yaml#/components/schemas/FeedIDs'
          - $ref: '../models/models.yaml#/components/schemas/ItemIDs'
      x-oapi-codegen-extra-tags:
        form: ids
  requestBodies:
    Mark:
      description: >
        Holds the options for marking an object.
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required:
              - mark
            properties:
              mark:
                $ref: '../models/api.yaml#/components/schemas/Mark'
    MarkMultiple:
      description: >
        Holds the options for marking multiple objects.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/MarkMultipleRequest'
    UserSignupRequestBody:
      description: >
        Holds details for adding/saving a user signup.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../models/api.yaml#/components/schemas/APIUserSignupRequest'
    SubscriptionRequestBody:
      description: >
        Holds details for adding/saving a subscription.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '../models/api.yaml#/components/schemas/APISubscriptionRequest'
    CategoryRequestBody:
      description: >
        A list of categories to add/remove from a subscription.
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required:
              - Category
            properties:
              Category:
                $ref: '../models/models.yaml#/components/schemas/Category'
  parameters:
    # Path parameters:
    FeedID:
      name: feed
      in: path
      schema:
        $ref: '../models/models.yaml#/components/schemas/FeedID'
    ItemID:
      name: item
      in: path
      schema:
        $ref: '../models/models.yaml#/components/schemas/ItemID'
    # Query Parameters:
    View:
      name: view
      in: query
      required: true
      schema:
        $ref: '../models/api.yaml#/components/schemas/View'
    Count:
      name: count
      in: query
      required: true
      schema:
        type: string
        $ref: '../models/api.yaml#/components/schemas/Count'
    IDs:
      name: ids
      in: query
      schema:
        $ref: '#/components/schemas/IDs'
    FeedIDs:
      name: feeds
      in: query
      schema:
        $ref: '../models/models.yaml#/components/schemas/FeedIDs'
      x-oapi-codegen-extra-tags:
        form: 'feeds[]'
    ItemIDs:
      name: items
      in: query
      schema:
        $ref: '../models/models.yaml#/components/schemas/ItemIDs'
      x-oapi-codegen-extra-tags:
        form: 'items[]'
    Categories:
      name: categories
      in: query
      schema:
        $ref: '../models/models.yaml#/components/schemas/Categories'
      x-oapi-codegen-extra-tags:
        form: 'categories[]'
  responses:
    htmx:
      description: standard htmx powered response.
      content:
        'text/html;charset=utf-8': {}
