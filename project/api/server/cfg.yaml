# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: server
output: ../../internal/app/server/server.gen.go
generate:
  models: true
  chi-server: true
  # strict-server: true
output-options:
  # to make sure that all types are generated
  skip-prune: false
  nullable-type: true
import-mapping:
  ../models/api.yaml: github.com/joshuar/go-feed-me/internal/models
