openapi: "3.0.3"
info:
  version: 1.0.0
  title: Common API
  description: Common API objects and fields.
paths: {}
components:
  schemas:
    # Fields:
    Param:
      description: is the name of a query parameter.
      type: string
      enum: ["feeds","items","categories","count","view","pagination","sort_by","sort_order"]
    Mark:
      description: >
        applies the given mark action to objects.
      type: string
      enum: ["read", "unread"]
      x-oapi-codegen-extra-tags:
        form: "mark"
        validate: "required,oneof=read unread"
    Feeds:
      description: is a list of feed IDs.
      type: array
      items:
        $ref: "models.yaml#/components/schemas/FeedID"
      x-oapi-codegen-extra-tags:
        json: "feeds"
        form: "feeds[]"
        validate: "omitnil,unique,dive,required,startswith=feed_"
      # x-go-type-skip-optional-pointer: true
    Items:
      description: is a list of items IDs.
      type: array
      items:
        $ref: "models.yaml#/components/schemas/ItemID"
      x-oapi-codegen-extra-tags:
        json: "items"
        form: "items[]"
        validate: "omitnil,unique,dive,required,startswith=item_"
      # x-go-type-skip-optional-pointer: true
    Categories:
      description: is a list of categories.
      type: array
      items:
        $ref: "models.yaml#/components/schemas/Category"
      x-oapi-codegen-extra-tags:
        json: "categories"
        form: "categories[]"
        validate: "omitnil,unique,dive,required"
      # x-go-type-skip-optional-pointer: true
    Count:
      description: >
        is the count of items to retrieve with a request.
      type: integer
      default: "10"
      x-oapi-codegen-extra-tags:
        form: "count"
        validate: "required,numeric,gt=0,lt=20"
    View:
      description: >
        The state of objects to view.
      type: string
      enum: ["read", "unread", "all"]
      default: "unread"
      x-oapi-codegen-extra-tags:
        validate: "required,oneof=read unread all"
        form: "view"
    Pagination:
      description: contains data for paginating through results
      type: string
      x-oapi-codegen-extra-tags:
        form: "pagination"
        validate: "omitempty,url_encoded"
    SortBy:
      description: >
        represents the selected field to sort on.
      type: string
      enum: ["unread_count","last_updated"]
      x-oapi-codegen-extra-tags:
        validate: "oneof=unread_count last_updated"
        form: "sort_by"
    SortOrder:
      description: >
        represents the order for sorting the selected field.
      type: string
      enum: ["asc","desc"]
      x-enum-varnames: ["SortAsc","SortDesc"]
      x-oapi-codegen-extra-tags:
        validate: "oneof=asc desc"
        form: "sort_order"
    Sort:
      description: contains information on sorting Feeds.
      type: object
      required:
        - sort_by
        - sort_order
      properties:
        sort_by:
          $ref: "#/components/schemas/SortBy"
        sort_order:
          $ref: "#/components/schemas/SortOrder"
      x-oapi-codegen-extra-tags:
        json: "sort"
    # Objects:
    Filters:
      description: contains parameters for searching feeds and items
      type: object
      required:
        - view
        - count
      properties:
        feeds:
          $ref: "#/components/schemas/Feeds"
        items:
          $ref: "#/components/schemas/Items"
        categories:
          $ref: "#/components/schemas/Categories"
        count:
          $ref: "#/components/schemas/Count"
        view:
          $ref: "#/components/schemas/View"
        pagination:
          $ref: "#/components/schemas/Pagination"
        sort:
          $ref: "#/components/schemas/Sort"
    Route:
      description: >
        is a htmx route within the server.
      type: object
      required:
        - url
        - mu
        - attributes
      properties:
        url:
          description: is the url object for the route.
          x-go-name: url
          x-oapi-codegen-only-honour-go-name: true
          x-go-type: "url.URL"
          x-go-json-ignore: true
        mu:
          description: is a mutex for safe concurrent access.
          x-go-name: mu
          x-oapi-codegen-only-honour-go-name: true
          x-go-type: "sync.Mutex"
          x-go-type-import:
            path: "sync"
          x-go-json-ignore: true
        method:
          description: is the HTTP method for the route.
          type: string
          x-go-name: method
          x-oapi-codegen-only-honour-go-name: true
          x-go-json-ignore: true
        attributes:
          description: are additional htmx attributes to apply to the route.
          x-go-name: attributes
          x-oapi-codegen-only-honour-go-name: true
          x-go-type: "templ.Attributes"
          x-go-type-import:
            path: "github.com/a-h/templ"
          x-go-json-ignore: true
    SubscriptionRequest:
      description: represents a new subscription request from a user.
      type: object
      required:
        - url
      properties:
        url:
          $ref: "models.yaml#/components/schemas/URL"
        name:
          description: >
            is a friendly name or nickname for the feed given by the user.
          type: string
          x-oapi-codegen-extra-tags:
            form: "name"
        categories:
          $ref: "#/components/schemas/Categories"
        validation_errors:
          description: is a map of field name -> validation error for the request.
          type: object
          additionalProperties:
            type: string
          x-go-json-ignore: true
          x-oapi-codegen-extra-tags:
            form: "-"
          x-go-type-skip-optional-pointer: true
    UserSignupRequest:
      description: >
        contains the details for a user signup request.
      type: object
      required:
        - email
        - password
      properties:
        nickname:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "omitempty"
            form: "nickname,omitempty"
        email:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required,email"
            form: "email"
        password:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required,min=10"
            form: "password"
        validation_errors:
          description: is a map of field name -> validation error for the request.
          type: object
          additionalProperties:
            type: string
          x-go-json-ignore: true
          x-oapi-codegen-extra-tags:
            form: "-"
          x-go-type-skip-optional-pointer: true
    CategoryCount:
      description: holds a category name and count of objects with the category.
      type: object
      required:
        - category
        - count
      properties:
        category:
          $ref: "models.yaml#/components/schemas/Category"
        count:
          description: is the number of objects with this Category.
          type: integer
