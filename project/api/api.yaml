openapi: "3.0.3"
info:
  version: 1.0.0
  title: Common API
  description: Common API objects and fields.
paths: {}
components:
  schemas:
    # Fields:
    Param:
      description: is the name of a query parameter.
      type: string
      enum: ["feeds","items","categories","count","view","pagination","sort_by","sort_order","since"]
    Mark:
      description: >
        applies the given mark action to objects.
      type: string
      enum: ["read", "unread"]
      x-oapi-codegen-extra-tags:
        form: "mark"
        validate: "oneof=read unread"
    # Feeds:
    #   description: is a list of feed IDs.
    #   type: array
    #   items:
    #     $ref: "models.yaml#/components/schemas/FeedID"
    #   x-oapi-codegen-extra-tags:
    #     json: "feeds"
    #     form: "feeds[]"
    #     validate: "omitnil,unique,dive,startswith=feed_"
    #   x-go-type-skip-optional-pointer: true
    # Items:
    #   description: is a list of items IDs.
    #   type: array
    #   items:
    #     $ref: "models.yaml#/components/schemas/ItemID"
    #   x-oapi-codegen-extra-tags:
    #     json: "items"
    #     form: "items[]"
    #     validate: "omitnil,unique,dive,startswith=item_"
    #   x-go-type-skip-optional-pointer: true
    # Categories:
    #   description: is a list of categories.
    #   type: array
    #   items:
    #     $ref: "models.yaml#/components/schemas/Category"
    #   x-oapi-codegen-extra-tags:
    #     json: "categories"
    #     form: "categories[]"
    #     validate: "omitnil,unique"
    #   x-go-type-skip-optional-pointer: true
    Count:
      description: >
        is the count of items to retrieve with a request.
      type: integer
      default: "10"
      minimum: 1
      maximum: 20
      x-oapi-codegen-extra-tags:
        form: "count"
        validate: "numeric,gt=0,lt=20"
    View:
      description: >
        The state of objects to view.
      type: string
      enum: ["read", "unread", "all"]
      default: "unread"
      x-oapi-codegen-extra-tags:
        validate: "oneof=read unread all"
        form: "view"
    Pagination:
      description: contains data for paginating through results.
      type: string
      x-oapi-codegen-extra-tags:
        form: "pagination"
        validate: "omitempty,url_encoded"
    Since:
      description: is a duration to filter results.
      x-go-type: time.Duration
      x-oapi-codegen-extra-tags:
        form: "since"
        validate: "omitempty"
    SortBy:
      description: >
        represents the selected field to sort on.
      type: string
      enum: ["unread_count","last_updated"]
      x-oapi-codegen-extra-tags:
        validate: "oneof=unread_count last_updated"
        form: "sort_by"
    SortOrder:
      description: >
        represents the order for sorting the selected field.
      type: string
      enum: ["asc","desc"]
      x-enum-varnames: ["SortAsc","SortDesc"]
      x-oapi-codegen-extra-tags:
        validate: "oneof=asc desc"
        form: "sort_order"
    Sort:
      description: contains information on sorting objects.
      type: object
      required:
        - sort_by
        - sort_order
      properties:
        sort_by:
          $ref: "#/components/schemas/SortBy"
        sort_order:
          $ref: "#/components/schemas/SortOrder"
      x-oapi-codegen-extra-tags:
        json: "sort"
    ErrorCode:
      description: >
        is a globally unique string for the error within the service.
      type: string
    # Objects:
    Error:
      description: >
        represents an error from within the API or service.
      type: object
      required:
        - context
        - message
        - err
      properties:
        context:
          description: >
            is a string that adds additional context to an error for internal
            use.
          type: string
        message:
          description: >
            is a short description for this error.
          type: string
        err:
          description: >
            contains any lower-level wrapped error(s).
          x-go-type: error
    ExternalError:
      description: >
        represents an error that can be shown externally (i.e. to users).
      type: object
      required:
        - retryable
        - summary
        - err
      properties:
        retryable:
          description: >
            indicates whether this error is temporary and the request/action
            that caused it can be retried.
          type: boolean
          default: false
        summary:
          description: >
            is a brief description of the error.
          type: string
        details:
          description: >
            is a longer description of the error, its cause and any
            actions/steps that need to be taken.
          type: string
          x-go-type-skip-optional-pointer: true
        err:
          description: >
            contains any lower-level internal error(s).
          x-go-type: error
    Filters:
      description: contains parameters for searching feeds and items
      type: object
      required:
        - view
        - count
        - sort_by
        - sort_order
      properties:
        feeds:
          description: is a list of feed IDs.
          type: array
          items:
            $ref: "models.yaml#/components/schemas/FeedID"
          x-oapi-codegen-extra-tags:
            json: "feeds"
            form: "feeds[]"
            validate: "omitnil,unique,dive,startswith=feed_"
          x-go-type-skip-optional-pointer: true
        items:
          description: is a list of items IDs.
          type: array
          items:
            $ref: "models.yaml#/components/schemas/ItemID"
          x-oapi-codegen-extra-tags:
            json: "items"
            form: "items[]"
            validate: "omitnil,unique,dive,startswith=item_"
          x-go-type-skip-optional-pointer: true
        categories:
          description: is a list of categories.
          type: array
          items:
            $ref: "models.yaml#/components/schemas/Category"
          x-oapi-codegen-extra-tags:
            json: "categories"
            form: "categories[]"
            validate: "omitnil,unique"
          x-go-type-skip-optional-pointer: true
        count:
          $ref: "#/components/schemas/Count"
        view:
          $ref: "#/components/schemas/View"
        pagination:
          $ref: "#/components/schemas/Pagination"
        since:
          $ref: "#/components/schemas/Since"
        sort_by:
          $ref: "#/components/schemas/SortBy"
        sort_order:
          $ref: "#/components/schemas/SortOrder"
    Route:
      description: >
        is a htmx route within the server.
      type: object
      required:
        - url
        - mu
        - attributes
      properties:
        url:
          description: is the url object for the route.
          x-go-name: url
          x-oapi-codegen-only-honour-go-name: true
          x-go-type: "url.URL"
          x-go-json-ignore: true
        mu:
          description: is a mutex for safe concurrent access.
          x-go-name: mu
          x-oapi-codegen-only-honour-go-name: true
          x-go-type: "sync.Mutex"
          x-go-type-import:
            path: "sync"
          x-go-json-ignore: true
        method:
          description: is the HTTP method for the route.
          type: string
          x-go-name: method
          x-oapi-codegen-only-honour-go-name: true
          x-go-json-ignore: true
        attributes:
          description: are additional htmx attributes to apply to the route.
          x-go-name: attributes
          x-oapi-codegen-only-honour-go-name: true
          x-go-type: "templ.Attributes"
          x-go-type-import:
            path: "github.com/a-h/templ"
          x-go-json-ignore: true
    SubscriptionResponse:
      description: >
        represents the response details for a subscription request.
      type: object
      allOf:
        - $ref: "#/components/schemas/SubscriptionRequest"
        - type: object
          properties:
            err:
              $ref: "#/components/schemas/Error"
    UserSignupRequest:
      description: >
        contains the details for a user signup request.
      type: object
      required:
        - email
        - password
      properties:
        nickname:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "omitempty"
            form: "nickname,omitempty"
        email:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required,email"
            form: "email"
        password:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required,min=10"
            form: "password"
        validation_errors:
          description: is a map of field name -> validation error for the request.
          type: object
          additionalProperties:
            type: string
          x-go-json-ignore: true
          x-oapi-codegen-extra-tags:
            form: "-"
          x-go-type-skip-optional-pointer: true
    CategoryCount:
      description: holds a category name and count of objects with the category.
      type: object
      required:
        - category
        - count
      properties:
        category:
          $ref: "models.yaml#/components/schemas/Category"
        count:
          description: is the number of objects with this Category.
          type: integer
    FeedState:
      description: tracks the state of a feed.
      type: object
      required:
        - ID
        - URL
      properties:
        ID:
          $ref: "models.yaml#/components/schemas/FeedID"
        URL:
          $ref: "models.yaml#/components/schemas/FeedURL"
        updated_at:
          $ref: "models.yaml#/components/schemas/UpdatedAt"
    ImportSource:
      description: >
        defines the source that will be used for an import.
      type: string
      enum: ["opml_file","opml_url","url_list"]
      x-enum-varnames: ["ImportFromFile","ImportFromURL","ImportFromList"]
      x-oapi-codegen-extra-tags:
        json: "source"
        form: "source"
        validate: "oneof=opml_file opml_url url_list"
    UserSubscriptionProperties:
      description: >
        represents the properties of a subscription a user can customize.
      properties:
        name:
          description: >
            is a friendly name or nickname for the feed given by the user.
          type: string
          x-oapi-codegen-extra-tags:
            form: "name"
        categories:
          description: >
            is a user-defined list of Category names for the subscription.
          type: array
          items:
            $ref: "models.yaml#/components/schemas/Category"
          x-oapi-codegen-extra-tags:
            json: "categories"
            form: "categories[]"
            validate: "unique"
          x-go-type-skip-optional-pointer: true
    Subscription:
      description: >
        represents a feed a user has subscribed to.
      type: object
      allOf:
        - $ref: "#/components/schemas/UserSubscriptionProperties"
        - type: object
          required:
            - created_at
            - FeedID
            - UserID
          properties:
            created_at:
              $ref: "models.yaml#/components/schemas/CreatedAt"
            updated_at:
              $ref: "models.yaml#/components/schemas/UpdatedAt"
            marked_read:
              description: records when the subscription was last marked read.
              x-go-type: "time.Time"
              x-oapi-codegen-extra-tags:
                validate: "omitnil"
            read_items:
              description: >
                is a list of ItemIDs that the user has explicitly marked as read.
              type: array
              items:
                $ref: "models.yaml#/components/schemas/ItemID"
              x-oapi-codegen-extra-tags:
                json: "read_items"
                validate: "unique,dive,startswith=item_"
              x-go-type-skip-optional-pointer: true
            unread_items:
              description: >
                is a list of ItemIDs that the user has explicitly marked as unread.
              type: array
              items:
                $ref: "models.yaml#/components/schemas/ItemID"
              x-oapi-codegen-extra-tags:
                json: "unread_items"
                validate: "unique,dive,startswith=item_"
              x-go-type-skip-optional-pointer: true
            FeedID:
              $ref: "models.yaml#/components/schemas/FeedID"
            UserID:
              $ref: "models.yaml#/components/schemas/UserID"
    SubscriptionRequest:
      description: >
        represents a request to add or edit a subscription.
      type: object
      allOf:
        - $ref: "api.yaml#/components/schemas/UserSubscriptionProperties"
        - type: object
          required:
            - FeedID
            - UserID
            - URL
          properties:
            FeedID:
              $ref: "models.yaml#/components/schemas/FeedID"
            UserID:
              $ref: "models.yaml#/components/schemas/UserID"
            URL:
              description: >
                is the canonical URL to the feed.
              type: string
              x-oapi-codegen-extra-tags:
                form: "url"
                json: "url"
                validate: "required,url"
            Feed:
              description: >
                is a Feed for the subscription that needs to be added.
              x-go-type: "models.Feed"
              x-oapi-codegen-extra-tags:
                form: "-"
                json: "-"
                validate: "-"
            err:
              description: >
                contains any lower-level wrapped error(s).
              x-go-type: error
              x-oapi-codegen-extra-tags:
                form: "-"
                json: "-"
                validate: "-"
              x-go-type-skip-optional-pointer: true
