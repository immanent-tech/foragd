components:
  schemas:
    # Metadata Objects.
    MetadataFeed:
      description: contains common/metadata fields for feeds and items.
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
        description:
          type: string
        categories:
          $ref: '#/components/schemas/Categories'
        image:
          x-go-type: '*gofeed.Image'
          x-go-type-import:
            path: github.com/mmcdole/gofeed
          x-go-type-skip-optional-pointer: true
        authors:
          x-go-type: '[]*gofeed.Person'
          x-go-type-import:
            path: github.com/mmcdole/gofeed
          x-go-type-skip-optional-pointer: true
        published:
          x-oapi-codegen-extra-tags:
            json: 'publishedParsed'
          x-go-type: 'time.Time'
          x-go-type-skip-optional-pointer: true
        updated:
          x-oapi-codegen-extra-tags:
            json: 'updatedParsed'
          x-go-type: 'time.Time'
          x-go-type-skip-optional-pointer: true
    MetadataDB:
      description: contains common (metadata) fields for database objects.
      type: object
      required:
        - created_at
        - updated_at
        - deleted_at
      properties:
        created_at:
          description: records when the object was created in the database.
          x-go-type: 'time.Time'
        updated_at:
          description: records when the object was last updated in the database.
          x-go-type: 'time.Time'
        deleted_at:
          description: records when the object was deleted.
          x-go-type: 'time.Time'
          x-oapi-codegen-extra-tags:
            gorm: 'index'
    Timestamp:
      description: is when the document was created.
      x-go-type: 'time.Time'
      x-oapi-codegen-extra-tags:
        json: "@timestamp"
        validate: "required"
      x-go-type-skip-optional-pointer: true
    SubscriptionID:
      description: is the unique ID of a subscription.
      type: string
      x-oapi-codegen-extra-tags:
        validate: 'required'
        json: 'subscription_id'
        gorm: 'primaryKey'
      x-go-type-skip-optional-pointer: true
    FeedID:
      description: is the unique ID of a feed.
      type: string
      x-oapi-codegen-extra-tags:
        validate: 'required'
        json: 'feed_id'
        gorm: 'primaryKey'
      x-go-type-skip-optional-pointer: true
    FeedIDs:
      description: is a list of feed IDs.
      type: array
      items:
        $ref: '#/components/schemas/FeedID'
      x-oapi-codegen-extra-tags:
        json: 'feeds'
        form: 'feeds'
      x-go-type-skip-optional-pointer: true
    ItemID:
      description: is the unique ID of an item.
      type: string
      x-oapi-codegen-extra-tags:
        validate: 'required'
        json: 'item_id'
        gorm: 'primaryKey'
      x-go-type-skip-optional-pointer: true
    ItemIDs:
      description: is a list of item IDs.
      type: array
      items:
        $ref: '#/components/schemas/ItemID'
      x-oapi-codegen-extra-tags:
        json: 'items'
        form: 'items'
      x-go-type-skip-optional-pointer: true
    UserID:
      description: is the unique ID of a user.
      type: string
      x-oapi-codegen-extra-tags:
        validate: 'required'
        json: 'user_id'
        gorm: 'primaryKey'
      x-go-type-skip-optional-pointer: true
    URL: &URL
      description: is a URL.
      type: string
      x-oapi-codegen-extra-tags:
        json: 'url'
        validate: 'required,url'
        gorm: '-'
      x-go-type-skip-optional-pointer: true
    Category:
      description: is a single feed/item category.
      type: string
      x-oapi-codegen-extra-tags:
        validate: 'required'
        json: 'category'
      x-go-type-skip-optional-pointer: true
    Categories:
      description: is a list of feed/item categories.
      type: array
      items:
        type: string
      x-oapi-codegen-extra-tags:
        json: 'categories'
        form: 'categories'
      x-go-type-skip-optional-pointer: true
    Pagination:
      description: >
        contains details that allow fetching results at a certain
        point.
      x-go-type: '[]byte'
      x-go-type-skip-optional-pointer: true
      x-oapi-codegen-extra-tags:
        json: 'pagination'
        form: 'pagination'
    Count:
      description: >
        is the count of items to retrieve with a request.
      type: integer
      minimum: 1
      maximum: 50
      default: 10
      x-go-type-skip-optional-pointer: true
      x-oapi-codegen-extra-tags:
        json: 'count'
        form: 'count'
    # Objects.
    User:
      description: is a user of the application.
      type: object
      allOf:
        - $ref: '#/components/schemas/MetadataDB'
        - type: object
          required:
            - ID
          properties:
            subscriptions:
              description: is the list of user subscriptions.
              x-go-type: '[]Subscription'
              x-go-type-skip-optional-pointer: true
            ID:
              $ref: '#/components/schemas/UserID'
    APIUser:
      type: object
      required:
        - email
        - password
      properties:
        nickname:
          type: string
          x-oapi-codegen-extra-tags:
            validate: 'omitempty'
          x-go-type-skip-optional-pointer: true
        email:
          type: string
          x-oapi-codegen-extra-tags:
            validate: 'required,email'
        password:
          type: string
          x-oapi-codegen-extra-tags:
            validate: 'required'
    Subscription:
      description: represents a feed a particular user has subscribed to.
      allOf:
        - $ref: '#/components/schemas/MetadataDB'
        - $ref: '#/components/schemas/APISubscription'
        - type: object
          required:
            - ID
            - FeedID
            - UserID
          properties:
            ID:
              $ref: '#/components/schemas/SubscriptionID'
            FeedID:
              $ref: '#/components/schemas/FeedID'
            UserID:
              $ref: '#/components/schemas/UserID'
    APISubscription:
      description: represents a subscription object for the API endpoints.
      type: object
      required:
        - URL
      properties:
        name:
          description: is a friendly name or nickname for the feed given by the user.
          type: string
          x-go-type-skip-optional-pointer: true
        URL:
          $ref: '#/components/schemas/URL'
    FeedState:
      description: tracks the state of the feed.
      type: object
      allOf:
        - $ref: '#/components/schemas/MetadataDB'
        - type: object
          required:
            - ID
          properties:
            ID:
              type: string
              x-oapi-codegen-extra-tags:
                gorm: 'primaryKey'
                json: 'feed_id'
            last_fetched:
              description: indicates when the feed was last fetched from its source.
              x-go-type: time.Time
              x-go-type-skip-optional-pointer: true
    APIFeed:
      description: represents a feed object for API endpoints.
      type: object
      required:
        - title
        - description
        - URL
        - ID
      allOf:
        - $ref: '#/components/schemas/MetadataFeed'
        - type: object
          properties:
            ID:
              $ref: '#/components/schemas/FeedID'
            URL:
              <<: *URL
              x-oapi-codegen-extra-tags:
                json: 'feedLink'
                validate: 'required,url'
            language:
              type: string
              x-go-type-skip-optional-pointer: true
            copyright:
              type: string
              x-go-type-skip-optional-pointer: true
            generator:
              type: string
              x-go-type-skip-optional-pointer: true
            feed_type:
              type: string
              x-oapi-codegen-extra-tags:
                json: 'feedType'
              x-go-type-skip-optional-pointer: true
            feed_version:
              type: string
              x-oapi-codegen-extra-tags:
                json: 'feedVersion'
              x-go-type-skip-optional-pointer: true
    APIItem:
      description: represents an individual item (e.g., an individual feed item).
      type: object
      required:
        - timestamp
        - ID
        - FeedID
        - URL
        - title
        - description
      allOf:
        - $ref: '#/components/schemas/MetadataFeed'
        - type: object
          properties:
            ID:
              $ref: '#/components/schemas/ItemID'
            FeedID:
              $ref: '#/components/schemas/FeedID'
            URL:
              <<: *URL
              x-oapi-codegen-extra-tags:
                json: 'link'
                validate: 'required,url'
    ReadItem:
      description: represents an item (e.g., an individual feed item) that has been read.
      type: object
      required:
        - timestamp
        - ID
        - FeedID
        - UserID
      allOf:
        - type: object
          properties:
            Timestamp:
              $ref: '#/components/schemas/Timestamp'
            ItemID:
              $ref: '#/components/schemas/ItemID'
            FeedID:
              $ref: '#/components/schemas/FeedID'
            UserID:
              $ref: '#/components/schemas/UserID'
    ReadItems:
      description: represents an array of item (e.g., an individual feed item) that have been read.
      type: array
      items:
        $ref: '#/components/schemas/ReadItem'
    APIReadItem:
      description: >
        represents an item (e.g., an individual feed item) that has
        been read as used by the API.
      type: object
      required:
        - ItemID
      allOf:
        - type: object
          properties:
            ItemID:
              $ref: '#/components/schemas/ItemID'
            FeedID:
              $ref: '#/components/schemas/FeedID'
    Tokens:
      type: object
      required:
        - IDToken
        - Claims
        - AccessToken
      properties:
        IDToken:
          x-go-type: '*oidc.IDToken'
          x-go-type-import:
            path: github.com/coreos/go-oidc
        Claims:
          type: object
          $ref: '#/components/schemas/Claims'
        AccessToken:
          type: string
    Claims:
      type: object
      properties:
        Subject:
          type: string
          x-oapi-codegen-extra-tags:
            json: 'sub'
          x-go-type-skip-optional-pointer: true
        SessionID:
          type: string
          x-oapi-codegen-extra-tags:
            json: 'sid'
          x-go-type-skip-optional-pointer: true
        UserName:
          type: string
          x-oapi-codegen-extra-tags:
            json: 'name'
          x-go-type-skip-optional-pointer: true
        UserPictureURL:
          type: string
          x-oapi-codegen-extra-tags:
            json: 'picture'
          x-go-type-skip-optional-pointer: true
        Issuer:
          type: string
          x-oapi-codegen-extra-tags:
            json: 'iss'
          x-go-type-skip-optional-pointer: true
        UserNickName:
          type: string
          x-oapi-codegen-extra-tags:
            json: 'nickname'
          x-go-type-skip-optional-pointer: true
        UpdatedAt:
          # x-go-type: 'time.Time'
          # type: string
          x-oapi-codegen-extra-tags:
            json: 'updated_at'
          x-go-type-skip-optional-pointer: true
        Audience:
          type: string
          x-oapi-codegen-extra-tags:
            json: 'aud'
          x-go-type-skip-optional-pointer: true
        Expiry:
          # x-go-type: 'time.Time'
          type: integer
          x-oapi-codegen-extra-tags:
            json: 'exp'
          x-go-type-skip-optional-pointer: true
        IssuedAt:
          # x-go-type: 'time.Time'
          type: integer
          x-oapi-codegen-extra-tags:
            json: 'iat'
          x-go-type-skip-optional-pointer: true
    APISearchFilters:
      description: contains parameters for searching feeds and items
      type: object
      properties:
        FeedIDs:
          $ref: '#/components/schemas/FeedIDs'
        ItemIDs:
          $ref: '#/components/schemas/ItemIDs'
        Categories:
          $ref: '#/components/schemas/Categories'
        Pagination:
          $ref: '#/components/schemas/Pagination'
        Count:
          $ref: '#/components/schemas/Count'
