# yaml-language-server: $schema=https://raw.githubusercontent.com/OAI/OpenAPI-Specification/refs/heads/main/schemas/v3.0/schema.yaml
openapi: "3.0.0"
info:
  version: 1.0.0
  title: Common API
  description: Common API objects and fields.
paths: {}
components:
  schemas:
    Count:
      description: >
        is the count of items to retrieve with a request.
      type: integer
      default: 10
      x-oapi-codegen-extra-tags:
        form: "count"
    Mark:
      description: >
        applies the given mark action to objects.
      type: string
      enum: ["read", "unread"]
      x-oapi-codegen-extra-tags:
        form: "mark"
        validate: "required,oneof='read unread'"
    View:
      description: >
        The state of objects to view.
      type: string
      enum: ["read", "unread", "all"]
      default: "unread"
      x-oapi-codegen-extra-tags:
        validate: "required,oneof='read unread all'"
        form: "view"
    Pagination:
      description: contains data for paginating through results
      type: string
      x-oapi-codegen-extra-tags:
        form: "pagination"
        validate: "required,url_encoded"
    APIRoute:
      description: >
        is a htmx route within the server.
      type: object
      required:
        - url
        - mu
        - attributes
      properties:
        url:
          description: is the url object for the route.
          x-go-name: url
          x-oapi-codegen-only-honour-go-name: true
          x-go-type: "url.URL"
          x-go-json-ignore: true
        mu:
          description: is a mutex for safe concurrent access.
          x-go-name: mu
          x-oapi-codegen-only-honour-go-name: true
          x-go-type: "sync.Mutex"
          x-go-type-import:
            path: "sync"
          x-go-json-ignore: true
        method:
          description: is the HTTP method for the route.
          type: string
          x-go-name: method
          x-oapi-codegen-only-honour-go-name: true
          x-go-json-ignore: true
        attributes:
          description: are additional htmx attributes to apply to the route.
          x-go-name: attributes
          x-oapi-codegen-only-honour-go-name: true
          x-go-type: "templ.Attributes"
          x-go-type-import:
            path: "github.com/a-h/templ"
          x-go-json-ignore: true
    APIFilters:
      description: contains parameters for searching feeds and items
      type: object
      required:
        - view
        - count
      properties:
        FeedIDs:
          $ref: "models.yaml#/components/schemas/FeedIDs"
        ItemIDs:
          $ref: "models.yaml#/components/schemas/ItemIDs"
        Categories:
          $ref: "models.yaml#/components/schemas/Categories"
        count:
          $ref: "#/components/schemas/Count"
        view:
          $ref: "#/components/schemas/View"
    APISubscriptionRequest:
      description: represents a new subscription request from a user.
      type: object
      required:
        - url
      properties:
        url:
          $ref: "models.yaml#/components/schemas/URL"
        name:
          description: >
            is a friendly name or nickname for the feed given by the user.
          type: string
          x-oapi-codegen-extra-tags:
            form: "name"
        categories:
          description: >
            is a list of custom categories the user has assigned to
            the feed.
          type: array
          items:
            $ref: "models.yaml#/components/schemas/Category"
          x-oapi-codegen-extra-tags:
            form: "categories[]"
          x-go-type-skip-optional-pointer: true
        validation_errors:
          description: is a map of field name -> validation error for the request.
          type: object
          additionalProperties:
            type: string
          x-go-json-ignore: true
          x-oapi-codegen-extra-tags:
            form: "-"
          x-go-type-skip-optional-pointer: true
    APIUserSignupRequest:
      description: >
        contains the details for a user signup request.
      type: object
      required:
        - email
        - password
      properties:
        nickname:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "omitempty"
            form: "nickname,omitempty"
        email:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required,email"
            form: "email"
        password:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required,min=10"
            form: "password"
        validation_errors:
          description: is a map of field name -> validation error for the request.
          type: object
          additionalProperties:
            type: string
          x-go-json-ignore: true
          x-oapi-codegen-extra-tags:
            form: "-"
          x-go-type-skip-optional-pointer: true
