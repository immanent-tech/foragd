openapi: "3.0.3"
info:
  version: 1.0.0
  title: Common Models
  description: Common objects and fields.
paths: {}
components:
  schemas:
    # Common Fields.
    Timestamp:
      description: is when the document was created.
      x-go-type: "time.Time"
      x-oapi-codegen-extra-tags:
        json: "@timestamp"
    CreatedAt:
      description: records when the object was created in the database.
      x-go-type: "time.Time"
      x-oapi-codegen-extra-tags:
        json: "created_at"
        validate: "required"
    UpdatedAt:
      description: records when the object was last updated in the database.
      x-go-type: "time.Time"
      x-oapi-codegen-extra-tags:
        json: "updated_at,omitempty"
        validate: "omitnil"
    DeletedAt:
      description: records when the object was deleted.
      x-go-type: "time.Time"
      x-oapi-codegen-extra-tags:
        json: "deleted_at,omitempty"
        validate: "omitnil"
    URL: &URL
      description: is a URL.
      type: string
      x-go-name: "URL"
      x-oapi-codegen-extra-tags:
        validate: "url"
        json: "url"
    Mark:
      description: >
        applies the given mark action to objects.
      type: string
      enum: ["read", "unread"]
      x-oapi-codegen-extra-tags:
        form: "mark"
        validate: "oneof=read unread"
    State:
      description: >
        Tracks the state of an object.
      type: string
      enum: ["read", "unread", "saved"]
      default: "unread"
      x-oapi-codegen-extra-tags:
        json: "state"
        validate: "oneof='read unread saved'"
    HTMLString:
      description: is a string that can contain HTML.
      type: string
      x-go-type-skip-optional-pointer: true
      x-oapi-codegen-extra-tags:
        validate: "url_encoded"
    FeedID:
      description: is the unique ID of a feed.
      type: string
      x-oapi-codegen-extra-tags:
        validate: "required,startswith=feed_"
        json: "feed_id"
    FeedURL:
      description: The canonical feed URL.
      type: string
      x-go-name: "FeedURL"
      x-oapi-codegen-extra-tags:
        json: "feedLink"
        validate: "required,url"
    ItemID:
      description: is the unique ID of an item.
      type: string
      x-oapi-codegen-extra-tags:
        validate: "required,startswith=item_"
        json: "item_id"
    ItemURL:
      description: A URL to view the original item.
      type: string
      x-go-name: "ItemURL"
      x-oapi-codegen-extra-tags:
        json: "link"
        validate: "required,url"
    SubscriptionID:
      description: is the unique ID of a subscription.
      type: string
      x-oapi-codegen-extra-tags:
        validate: "required,startswith=sub_"
        json: "subscription_id"
    ItemState:
      description: >
        contains the user state for the item.
      type: object
      required:
        - state
      properties:
        state:
          $ref: "#/components/schemas/State"
      x-oapi-codegen-extra-tags:
        json: "-"
    UserID:
      description: is the unique ID of a user.
      type: string
      x-oapi-codegen-extra-tags:
        json: "user_id"
        validate: "required"
    Category:
      description: is a single category.
      type: string
      x-oapi-codegen-extra-tags:
        json: "category"
    CategoryCount:
      description: >
        holds a category and the count of its occurence. The count will be
        contextual. i.e., across subscriptions, items, etc.
      type: object
      required:
        - category
        - count
      properties:
        category:
          $ref: "#/components/schemas/Category"
        count:
          type: integer
          minimum: 0
    ObjectPublished:
      description: is when the object was published.
      x-oapi-codegen-extra-tags:
        json: "publishedParsed"
        form: "published_at"
      x-go-type: "time.Time"
      x-go-type-skip-optional-pointer: true
    ObjectUpdated:
      description: is when the object was updated.
      x-oapi-codegen-extra-tags:
        json: "updatedParsed"
        form: "updated_at"
      x-go-type: "time.Time"
      x-go-type-skip-optional-pointer: true
    # Metadata Objects.
    FeedMetadata:
      description: contains common/metadata fields for feeds and items.
      type: object
      required:
        - title
        - description
      properties:
        title:
          $ref: "#/components/schemas/HTMLString"
        description:
          $ref: "#/components/schemas/HTMLString"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
          x-go-type-skip-optional-pointer: true
        image:
          x-go-type: "*gofeed.Image"
          x-go-type-import:
            path: github.com/mmcdole/gofeed
          x-go-type-skip-optional-pointer: true
        authors:
          x-go-type: "[]*gofeed.Person"
          x-go-type-import:
            path: github.com/mmcdole/gofeed
          x-go-type-skip-optional-pointer: true
    FeedState:
      description: >
        contains fields for tracking feed/item state.
      type: object
      properties:
        published:
          $ref: "#/components/schemas/ObjectPublished"
        updated:
          $ref: "#/components/schemas/ObjectUpdated"
    Timestamps:
      description: contains common (metadata) fields for database objects.
      type: object
      required:
        - created_at
      properties:
        created_at:
          $ref: "#/components/schemas/CreatedAt"
        updated_at:
          $ref: "#/components/schemas/UpdatedAt"
    # Objects.
    User:
      description: is a user of the application.
      type: object
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required:
            - ID
            - max_history
          properties:
            ID:
              $ref: "#/components/schemas/UserID"
            max_history:
              description: >
                Represents the maximum time-frame over which the user
                can view items.
              type: string
            subscriptions:
              description: >
                is the list of subscriptions for the user.
              type: array
              items:
                $ref: "#/components/schemas/Subscription"
              x-go-type-skip-optional-pointer: true
    APIFeed:
      description: represents a feed object for API endpoints.
      type: object
      allOf:
        - $ref: "#/components/schemas/FeedMetadata"
        - $ref: "#/components/schemas/FeedState"
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required:
            - ID
            - URL
          properties:
            ID:
              $ref: "#/components/schemas/FeedID"
            URL:
              $ref: "#/components/schemas/FeedURL"
            language:
              type: string
              x-go-type-skip-optional-pointer: true
            copyright:
              type: string
              x-go-type-skip-optional-pointer: true
            generator:
              type: string
              x-go-type-skip-optional-pointer: true
            feed_type:
              type: string
              x-oapi-codegen-extra-tags:
                json: "feedType"
              x-go-type-skip-optional-pointer: true
            feed_version:
              type: string
              x-oapi-codegen-extra-tags:
                json: "feedVersion"
              x-go-type-skip-optional-pointer: true
    APIItem:
      description: represents an individual item (e.g., an individual feed item).
      type: object
      allOf:
        - $ref: "#/components/schemas/FeedMetadata"
        - $ref: "#/components/schemas/FeedState"
        - type: object
          required:
            - ID
            - FeedID
            - URL
          properties:
            ID:
              $ref: "#/components/schemas/ItemID"
            FeedID:
              $ref: "#/components/schemas/FeedID"
            URL:
              $ref: "#/components/schemas/ItemURL"
            state:
              $ref: "#/components/schemas/ItemState"
    Tokens:
      type: object
      required:
        - IDToken
        - Claims
        - AccessToken
      properties:
        IDToken:
          x-go-type: "*oidc.IDToken"
          x-go-type-import:
            path: github.com/coreos/go-oidc
        Claims:
          type: object
          $ref: "#/components/schemas/Claims"
        AccessToken:
          type: string
    Claims:
      type: object
      properties:
        Subject:
          type: string
          x-oapi-codegen-extra-tags:
            json: "sub"
          x-go-type-skip-optional-pointer: true
        SessionID:
          type: string
          x-oapi-codegen-extra-tags:
            json: "sid"
          x-go-type-skip-optional-pointer: true
        UserName:
          type: string
          x-oapi-codegen-extra-tags:
            json: "name"
          x-go-type-skip-optional-pointer: true
        UserPictureURL:
          type: string
          x-oapi-codegen-extra-tags:
            json: "picture"
          x-go-type-skip-optional-pointer: true
        Issuer:
          type: string
          x-oapi-codegen-extra-tags:
            json: "iss"
          x-go-type-skip-optional-pointer: true
        UserNickName:
          type: string
          x-oapi-codegen-extra-tags:
            json: "nickname"
          x-go-type-skip-optional-pointer: true
        UpdatedAt:
          # x-go-type: 'time.Time'
          # type: string
          x-oapi-codegen-extra-tags:
            json: "updated_at"
          x-go-type-skip-optional-pointer: true
        Audience:
          type: string
          x-oapi-codegen-extra-tags:
            json: "aud"
          x-go-type-skip-optional-pointer: true
        Expiry:
          # x-go-type: 'time.Time'
          type: integer
          x-oapi-codegen-extra-tags:
            json: "exp"
          x-go-type-skip-optional-pointer: true
        IssuedAt:
          # x-go-type: 'time.Time'
          type: integer
          x-oapi-codegen-extra-tags:
            json: "iat"
          x-go-type-skip-optional-pointer: true
    UserSession:
      description: tracks a user session.
      type: object
      required:
        - token
        - data
        - expiry
      properties:
        token:
          description: the session token for the user.
          type: string
        data:
          description: the encoded session data.
          x-go-type: "[]byte"
        expiry:
          description: the time at which this session token expires.
          x-go-type: time.Time
    SubscriptionMetadata:
      description: >
        contains metadata for tracking a subscription.
      type: object
      required:
        - ID
        - FeedID
        - URL
      properties:
        ID:
          $ref: "#/components/schemas/SubscriptionID"
        FeedID:
          $ref: "#/components/schemas/FeedID"
    SubscriptionCustomisation:
      description: >
        represents the properties of a subscription a user can customize.
      type: object
      properties:
        user_nickname:
          description: >
            is a friendly name or nickname for the feed given by the user.
          type: string
          x-oapi-codegen-extra-tags:
            form: "user_nickname"
        user_categories:
          description: >
            is a user-defined list of Category names for the subscription.
          type: array
          items:
            $ref: "#/components/schemas/Category"
          x-oapi-codegen-extra-tags:
            json: "user_categories"
            form: "user_categories[]"
            validate: "unique"
          x-go-type-skip-optional-pointer: true
    SubscriptionState:
      description: >
        contains properties tracking the state of the subscription.
      type: object
      required:
        - marked_read
      properties:
        marked_read:
          description: records when the subscription was last marked read.
          x-go-type: "time.Time"
          x-oapi-codegen-extra-tags:
            validate: "required"
        read_items:
          description: >
            is a list of ItemIDs that the user has explicitly marked as read.
          type: array
          items:
            $ref: "#/components/schemas/ItemID"
          x-oapi-codegen-extra-tags:
            json: "read_items"
            validate: "unique,dive,startswith=item_"
          x-go-type-skip-optional-pointer: true
        unread_items:
          description: >
            is a list of ItemIDs that the user has explicitly marked as unread.
          type: array
          items:
            $ref: "#/components/schemas/ItemID"
          x-oapi-codegen-extra-tags:
            json: "unread_items"
            validate: "unique,dive,startswith=item_"
          x-go-type-skip-optional-pointer: true
        unread_count:
          description: >
            indicates how many items are unread.
          type: integer
          minimum: 0
          x-oapi-codegen-extra-tags:
            json: "-"
            form: "-"
            validate: "numeric,gte=0"
          x-go-type-skip-optional-pointer: true
    Subscription:
      description: >
        represents a feed a user has subscribed to.
      type: object
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - $ref: "#/components/schemas/SubscriptionMetadata"
        - $ref: "#/components/schemas/SubscriptionCustomisation"
        - type: object
          required:
            - state
            - feed_details
          properties:
            feed_details:
              $ref: "#/components/schemas/FeedMetadata"
            state:
              $ref: "#/components/schemas/SubscriptionState"
