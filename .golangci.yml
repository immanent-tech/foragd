version: '2'
linters:
  default: all
  disable:
    - contextcheck
    - cyclop
    - depguard
    - exhaustive
    - exhaustruct
    - gochecknoglobals
    - gochecknoinits
    - godox
    - ireturn
    - lll
    - mnd
    - nlreturn
    - tagalign
    - tagliatelle
    - wsl_v5
    - wsl
  settings:
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104 # made redundant by errcheck
    lll:
      tab-width: 4
      line-length: 120
    varnamelen:
      ignore-names:
        - err
        - wg
        - tt
        - id
        - ok
        - mu
        - fd
        - to
    revive:
      enable-all-rules: false
      rules:
        - name: exported
          arguments:
            - disable-checks-on-variables
  exclusions:
    rules:
      - linters:
          - lll
        source: '^//go:generate '
      - path: '(.+)_test\.go'
        linters:
          - dupl
          - funlen
          - paralleltest
          - testpackage
          - varnamelen
    paths:
      - '(.+)_templ\.go'
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/joshuar/go-feed-me
run:
  timeout: '1m'
  issues-exit-code: 1
  tests: true
  allow-parallel-runners: false
  allow-serial-runners: false
  go: '1.24'
  relative-path-mode: wd
