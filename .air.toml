# Auto-generated config file for Air live-reloading tool.
# See https://gowebly.org for more information.

root = "."
tmp_dir = "tmp"

[build]
pre_cmd = ["bun run build"]
# post_cmd = ["echo 'hello air' > post_cmd.txt"]
cmd = "step ca renew --force localhost.crt localhost.key && go tool github.com/a-h/templ/cmd/templ generate && go build -o ./tmp/gowebly_chi ."
bin = "tmp/gowebly_chi --log-level=debug --profile='heapprofile=deployments/heap.prof;cpuprofile=deployments/cpu.prof;webui=true' serve"
include_ext = ["go", "templ", "html", "json", "js", "ts", "css", "scss"]
exclude_dir = [
    ".parcel-cache",
    "bin",
    "dist",
    "node_modules",
    "static",
    "tmp",
    "tests",
    "vendor",
]
exclude_regex = ["_test\\.go", "_templ\\.go"]
exclude_unchanged = false
follow_symlink = false
log = "deployments/build-errors-air.log"
poll = false
poll_interval = 500
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = 500
rerun = false
rerun_delay = 500

[log]
time = true
main_only = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
keep_scroll = true
