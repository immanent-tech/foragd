root = "."
tmp_dir = "tmp"

[build]
args_bin = [
  "--no-log-file",
  "--profile='heapprofile=deployments/heap.prof;cpuprofile=deployments/cpu.prof;webui=true'",
  "serve",
]
cmd = 'go build -ldflags="-X github.com/immanent-tech/foragd/config.Version=$(git describe --tags --always --long --dirty)" -o ./tmp/foragd .'
bin = "tmp/foragd"
full_bin = "bunx dotenv-cli -e .env.development -- tmp/foragd"
delay = 1000
exclude_dir = [
  "bin",
  "dist",
  "node_modules",
  "tmp",
  "tests",
  "test",
  "vendor",
  "web/content",
  "schema",
  "deploy",
  "build",
]
exclude_regex = ["_test\\.go", "_templ\\.go"]
exclude_unchanged = false
follow_symlink = false
include_ext = ["go", "templ", "html", "json", "js", "ts", "css", "scss", "md"]
kill_delay = 500
log = "deployments/build-errors-air.log"
poll = false
poll_interval = 500
pre_cmd = [
  "bun run build:css",
  "bun run build:js",
  "go run github.com/a-h/templ/cmd/templ@latest generate -path web",
]
rerun = false
rerun_delay = 500
send_interrupt = true
stop_on_error = true

[log]
main_only = false
time = true

[color]
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
