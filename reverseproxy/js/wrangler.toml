name = "request-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"
workers_dev = true
preview_urls = true

[[routes]]
pattern = "reverse-proxy.foragd.app"
zone_name = "foragd.app"
custom_domain = true

[placement]
mode = "smart"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1
