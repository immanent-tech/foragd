openapi: '3.0.3'
info:
  version: 1.0.0
  title: Common Models
  description: Common objects and fields.
paths: {}
components:
  schemas:
    # Common Fields.
    Timestamp:
      description: is when the document was created.
      x-go-type: 'time.Time'
      x-oapi-codegen-extra-tags:
        json: '@timestamp'
        validate: 'required'
    CreatedAt:
      description: records when the object was created in the database.
      x-go-type: 'time.Time'
      x-oapi-codegen-extra-tags:
        json: 'created_at'
        validate: 'required'
    UpdatedAt:
      description: records when the object was last updated in the database.
      x-go-type: 'time.Time'
      x-oapi-codegen-extra-tags:
        json: 'updated_at,omitempty'
        validate: 'omitnil'
    DeletedAt:
      description: records when the object was deleted.
      x-go-type: 'time.Time'
      x-oapi-codegen-extra-tags:
        json: 'deleted_at,omitempty'
        validate: 'omitnil'
      deprecated: true
    MaxHistory:
      description: >
        is a duration representing the maximum time-frame over which objects contained within are available.
      type: string
      x-oapi-codegen-extra-tags:
        form: '-'
    URL: &URL
      description: is a URL.
      type: string
      x-go-name: URL
      x-oapi-codegen-extra-tags:
        validate: 'url'
        json: 'url'
    Mark:
      description: >
        applies the given mark action to objects.
      type: string
      enum: ['read', 'unread']
      x-oapi-codegen-extra-tags:
        form: 'mark'
        validate: 'oneof=read unread'
    State:
      description: >
        Tracks the state of an object.
      type: string
      enum: ['read', 'unread', 'saved']
      default: 'unread'
      x-oapi-codegen-extra-tags:
        json: 'state'
        validate: 'oneof=read unread saved'
    HTMLString:
      description: is a string that can contain HTML.
      type: string
      x-go-type-skip-optional-pointer: true
      x-oapi-codegen-extra-tags:
        validate: 'url_encoded'
    FeedID:
      description: is the unique ID of a feed.
      type: string
      x-go-name: FeedID
      x-oapi-codegen-extra-tags:
        validate: 'required,startswith=feed_'
        json: 'feed_id'
        form: 'feed_id'
    ItemID:
      description: is the unique ID of an item.
      type: string
      x-go-name: ItemID
      x-oapi-codegen-extra-tags:
        validate: 'required,startswith=item_'
        json: 'item_id'
        form: 'feed_id'
    SubscriptionID:
      description: is the unique ID of a subscription.
      type: string
      x-go-name: SubscriptionID
      x-oapi-codegen-extra-tags:
        validate: 'required,startswith=sub_'
        form: 'subscription_id'
        json: 'subscription_id'
    ItemState:
      description: >
        contains the user state for the item.
      type: object
      required:
        - item_id
        - state
      properties:
        item_id:
          $ref: '#/components/schemas/ItemID'
        state:
          $ref: '#/components/schemas/State'
      x-oapi-codegen-extra-tags:
        json: '-'
    UserID:
      description: is the unique ID of a user.
      type: string
      x-go-name: UserID
      x-oapi-codegen-extra-tags:
        json: 'user_id'
        validate: 'required'
    Category:
      description: >
        represents a taxonomy applied to an object.
      type: string
    CategoryCount:
      description: >
        holds a category and the count of its occurence. The count will be
        contextual. i.e., across subscriptions, items, etc.
      type: object
      required:
        - category
        - count
      properties:
        category:
          $ref: '#/components/schemas/Category'
        count:
          type: integer
          minimum: 0
    Timestamps:
      description: contains common (metadata) fields for database objects.
      type: object
      required:
        - created_at
      properties:
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
    # Objects.
    User:
      description: is a user of the application.
      type: object
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          required:
            - user_id
            - max_history
          properties:
            user_id:
              $ref: '#/components/schemas/UserID'
            subscriptions:
              description: >
                is the list of subscriptions for the user.
              type: array
              items:
                $ref: '#/components/schemas/SubscriptionDetails'
              x-go-type-skip-optional-pointer: true
            max_history:
              $ref: '#/components/schemas/MaxHistory'
            settings:
              $ref: '#/components/schemas/UserSettings'
    UserSettings:
      description: >
        contains user-specific settings for the application.
      type: object
      properties:
        theme:
          description: >
            the user interface theme chosen by the user.
          type: string
          default: dracula
          x-go-type-skip-optional-pointer: true
    ObjectCommon:
      description: contains common fields across objects.
      type: object
      required:
        - source_type
        - title
        - description
        - published
      properties:
        source_type:
          description: >
            indicates what type of source the object came from.
          type: string
          enum: ['RSS', 'Atom', 'JSONFeed']
        title:
          description: >
            is the title of the feed or item.
          type: string
          x-oapi-codegen-extra-tags:
            validate: 'required'
        description:
          description: >
            is a short summary or description of the feed or item.
          type: string
        url:
          description: >
            is the URL to the webpage for the feed or item. For a feed, this is most likely the webpage the feed is
            sourced from. For an item, this is most likely the webpage containing the full item contents.
          type: string
          x-go-name: URL
          x-oapi-codegen-extra-tags:
            validate: 'omitempty,url'
          x-go-type-skip-optional-pointer: true
        published:
          description: >
            is the datetime at which the feed or item was published.
          x-go-type: time.Time
        updated:
          description: >
            is the datetime at which the feed or item was updated.
          x-go-type: time.Time
          x-go-type-skip-optional-pointer: true
        categories:
          description: >
            is a list of categories that define a taxonomy for the feed or item.
          type: array
          items:
            $ref: '#/components/schemas/Category'
          x-oapi-codegen-extra-tags:
            validate: 'omitempty,unique'
          x-go-type-skip-optional-pointer: true
        authors:
          description: >
            is a list of people (names, nicknames and/or emails) who "authored" the object content.
          type: array
          items:
            type: string
          x-oapi-codegen-extra-tags:
            validate: 'omitempty,unique'
          x-go-type-skip-optional-pointer: true
        contributors:
          description: >
            is a list of people (names, nicknames and/or emails) who "contributed" the object content.
          type: array
          items:
            type: string
          x-oapi-codegen-extra-tags:
            validate: 'omitempty,unique'
          x-go-type-skip-optional-pointer: true
        image:
          $ref: '../models/feeds/types.yaml#/components/schemas/Image'
        language:
          type: string
          x-go-type-skip-optional-pointer: true
        copyright:
          type: string
          x-go-type-skip-optional-pointer: true
    UserSession:
      description: tracks a user session.
      type: object
      required:
        - token
        - data
        - expiry
      properties:
        token:
          description: the session token for the user.
          type: string
        data:
          description: the encoded session data.
          x-go-type: '[]byte'
        expiry:
          description: the time at which this session token expires.
          x-go-type: time.Time
    SubscriptionCustomisation:
      description: >
        represents the properties of a subscription a user can customize.
      type: object
      properties:
        user_nickname:
          description: >
            is a friendly name or nickname for the feed given by the user.
          type: string
          x-oapi-codegen-extra-tags:
            form: 'user_nickname'
            validate: 'omitempty'
          x-go-type-skip-optional-pointer: true
        user_categories:
          description: >
            is a user-defined list of Category names for the subscription.
          type: array
          items:
            $ref: '#/components/schemas/Category'
          x-oapi-codegen-extra-tags:
            json: 'user_categories'
            form: 'user_categories[]'
            validate: 'omitempty,unique'
          x-go-type-skip-optional-pointer: true
    SubscriptionState:
      description: >
        contains properties tracking the state of the subscription.
      type: object
      required:
        - marked_read
      properties:
        marked_read:
          description: records when the subscription was last marked read.
          x-go-type: 'time.Time'
          x-oapi-codegen-extra-tags:
            form: '-'
            validate: 'required'
        item_states:
          description: >
            contains states of items that the user has explicitly marked or saved.
          type: array
          items:
            $ref: '#/components/schemas/ItemState'
          x-oapi-codegen-extra-tags:
            form: '-'
            validate: 'omitempty,unique'
          x-go-type-skip-optional-pointer: true
        unread_count:
          description: >
            indicates how many items are unread for the subscription.
          type: integer
          minimum: 0
          x-oapi-codegen-extra-tags:
            json: '-'
            form: '-'
            validate: 'numeric,gte=0'
          x-go-type-skip-optional-pointer: true
    SubscriptionDetails:
      description: >
        contains all details that define a user subscription.
      type: object
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - $ref: '#/components/schemas/SubscriptionCustomisation'
        - $ref: '#/components/schemas/SubscriptionState'
        - type: object
          required:
            - subscription_id
            - feed_id
            - max_history
          properties:
            subscription_id:
              $ref: '#/components/schemas/SubscriptionID'
            feed_id:
              $ref: '#/components/schemas/FeedID'
            max_history:
              $ref: '#/components/schemas/MaxHistory'
    # Subscription:
    #   description: >
    #     represents a feed a user has subscribed to.
    #   type: object
    #   allOf:
    #     - $ref: '#/components/schemas/SubscriptionDetails'
    #     - $ref: '#/components/schemas/Feed'
    Feed:
      description: represents a feed object.
      type: object
      allOf:
        - $ref: '#/components/schemas/ObjectCommon'
        - type: object
          required:
            - feed_id
            - source
            - created_at
          properties:
            feed_id:
              $ref: '#/components/schemas/FeedID'
            source:
              description: >
                is a URL to the source Feed document.
              allOf:
                - $ref: '#/components/schemas/URL'
              x-go-name: SourceURL
              x-oapi-codegen-extra-tags:
                validate: 'required,url'
            created_at:
              $ref: '#/components/schemas/CreatedAt'
    Item:
      description: represents an individual item (e.g., an individual feed item).
      type: object
      allOf:
        - $ref: '#/components/schemas/ObjectCommon'
        - type: object
          required:
            - item_id
            - feed_id
            - feed_title
            - '@timestamp'
          properties:
            '@timestamp':
              $ref: '#/components/schemas/Timestamp'
            item_id:
              $ref: '#/components/schemas/ItemID'
            feed_id:
              $ref: '#/components/schemas/FeedID'
            feed_title:
              description: >
                is the title of the feed to which this item belongs.
              type: string
              x-oapi-codegen-extra-tags:
                validate: 'required'
            content:
              description: >
                contains the item content.
              type: string
              x-go-type-skip-optional-pointer: true
    Article:
      description: represents an individual item (e.g., an individual feed item) with additional user-specific fields.
      type: object
      allOf:
        - $ref: '#/components/schemas/ItemState'
        - type: object
          required:
            - subscription_id
            - feed_id
          properties:
            subscription_id:
              $ref: '#/components/schemas/SubscriptionID'
            subscription_title:
              type: string
            feed_id:
              $ref: '#/components/schemas/FeedID'
            item:
              description: >
                is the original item that the article represents.
              allOf:
                - $ref: '#/components/schemas/Item'
              x-oapi-codegen-extra-tags:
                json: '-'
                form: '-'
                validate: 'required'
