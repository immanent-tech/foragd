openapi: '3.0.3'
info:
  version: 1.0.0
  title: Common Models
  description: Common objects and fields.
components:
  schemas:
    # Common Fields.
    Timestamp:
      description: is when the document was created.
      x-go-type: 'time.Time'
      x-oapi-codegen-extra-tags:
        json: '@timestamp'
        validate: 'required'
    CreatedAt:
      description: records when the object was created in the database.
      x-go-type: 'time.Time'
      x-oapi-codegen-extra-tags:
        json: 'created_at'
        validate: 'required'
    UpdatedAt:
      description: records when the object was last updated in the database.
      x-go-type: 'time.Time'
      x-oapi-codegen-extra-tags:
        json: 'updated_at,omitempty'
        validate: 'omitnil'
    DeletedAt:
      description: records when the object was deleted.
      x-go-type: 'time.Time'
      x-oapi-codegen-extra-tags:
        json: 'deleted_at,omitempty'
        validate: 'omitnil'
      deprecated: true
    URL:
      description: is a URL.
      type: string
      x-go-name: URL
      x-oapi-codegen-extra-tags:
        validate: 'omitempty,url'
        json: 'url'
    Mark:
      description: >
        applies the given mark action to objects.
      type: string
      enum: ['read', 'unread']
      x-oapi-codegen-extra-tags:
        form: 'mark'
        validate: 'oneof=read unread'
    State:
      description: >
        Tracks the state of an object.
      type: string
      enum: ['read', 'unread', 'saved']
      default: 'unread'
      x-oapi-codegen-extra-tags:
        json: 'state'
        validate: 'oneof=read unread saved'
    FeedID:
      description: is the unique ID of a feed.
      type: string
      x-go-name: FeedID
      x-oapi-codegen-extra-tags:
        validate: 'required,startswith=feed_'
        json: 'feed_id'
        form: 'feed_id'
    ItemID:
      description: is the unique ID of an item.
      type: string
      x-go-name: ItemID
      x-oapi-codegen-extra-tags:
        validate: 'required,startswith=item_'
        json: 'item_id'
        form: 'item_id'
    SubscriptionID:
      description: is the unique ID of a subscription.
      type: string
      x-go-name: SubscriptionID
      x-oapi-codegen-extra-tags:
        validate: 'required,startswith=sub_'
        json: 'subscription_id'
        form: 'subscription_id'
    UserID:
      description: is the unique ID of a user.
      type: string
      x-go-name: UserID
      x-oapi-codegen-extra-tags:
        json: 'user_id'
        validate: 'required,startswith=user_'
        form: 'user_id'
    UserNickname:
      description: >
        is an alias or label the user has given themselves.
      type: string
      x-oapi-codegen-extra-tags:
        form: 'nickname'
    FavoriteID:
      description: is the unique ID of a Favorite.
      type: string
      x-go-name: FavoriteID
      x-oapi-codegen-extra-tags:
        validate: 'required,startswith=fav_'
        json: 'favorite_id'
        form: 'favorite_id'
    Nickname:
      description: >
        is an optional friendly name.
      type: string
      x-oapi-codegen-extra-tags:
        form: 'nickname'
    RemoteImage:
      description: >
        is a link to an image to represent the object.
      type: object
      required:
        - url
      properties:
        URL:
          $ref: '#/components/schemas/URL'
        title:
          description: >
            is a description of the image that could be used as alt text.
          type: string
    StoredImage:
      description: >
        is an image stored locally (i.e., the binary data to represent the image).
      type: object
      required:
        - data
      properties:
        data:
          x-go-type: image.Image
    Category:
      description: >
        represents a taxonomy applied to an object.
      type: string
    CategoryCount:
      description: >
        holds a category and the count of its occurence. The count will be
        contextual. i.e., across subscriptions, items, etc.
      type: object
      required:
        - category
        - count
      properties:
        category:
          $ref: '#/components/schemas/Category'
        count:
          type: integer
          minimum: 0
    # Objects.
    User:
      description: is a user of the application.
      type: object
      required:
        - created_at
        - user_id
        - external_user_id
        - provider
        - max_history
      properties:
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        user_id:
          $ref: '#/components/schemas/UserID'
        external_user_id:
          description: >
            is the ID of the user on the external backend that was used to create the account.
          type: string
          x-oapi-codegen-extra-tags:
            validate: 'required'
        provider:
          description: >
            is the backend provider that was used to create the account.
          type: string
          x-oapi-codegen-extra-tags:
            validate: 'required'
        nickname:
          $ref: '#/components/schemas/UserNickname'
        avatar_url:
          description: >
            is a link to an image file to user as an avatar for the user.
          type: string
          x-go-name: AvatarURL
          x-oapi-codegen-extra-tags:
            validate: 'omitempty,url'
        max_history:
          description: >
            is a duration representing the maximum time-frame over which objects contained within are available.
          type: string
          x-oapi-codegen-extra-tags:
            validate: 'required'
        settings:
          $ref: '#/components/schemas/UserSettings'
        subscriptions:
          description: >
            is a list of the states of all subscriptions the user has.
          x-go-type: '[]*SubscriptionMetadata'
          x-oapi-codegen-extra-tags:
            validate: 'omitempty,dive'
        favorites:
          description: >
            contains the user favorites.
          type: array
          x-go-type: '[]*Favorite'
          x-oapi-codegen-extra-tags:
            validate: 'omitempty,dive'
    EditUserRequest:
      description: >
        contains details for editing a user account.
      type: object
      properties:
        nickname:
          $ref: '#/components/schemas/UserNickname'
        nicknameErr:
          description: >
            represents an error in the nickname field.
          x-go-type: error
          x-oapi-codegen-extra-tags:
            form: '-'
            json: '-'
    UserSettings:
      description: >
        contains user-specific settings for the application.
      type: object
      properties:
        theme:
          description: >
            the user interface theme chosen by the user.
          type: string
          default: dracula
    Favorite:
      description: >
        is an object that the user has marked as a Favorite. Favorites  have higher visibility in the display and
        score higher in search results.
      type: object
      required:
        - type
        - created_at
        - object_id
      properties:
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        nickname:
          $ref: '#/components/schemas/Nickname'
        type:
          description: >
            is the type of Favorite.
          type: string
          enum: ['subscription', 'article', 'search']
        object_id:
          description: >
            an ID of the object that has been favorited.
          type: string
          x-go-name: ObjectID
        object_data:
          description: >
            contains the (optional) data pertaining to the favorite object.
          oneOf:
            - $ref: '#/components/schemas/FavoriteSearch'
            # - $ref: '#/components/schemas/FavoriteSubscription'
            - $ref: '#/components/schemas/FavoriteArticle'
    # FavoriteSubscription:
    #   description: >
    #     is a subscription that the user has marked as a Favorite.
    #   type: object
    #   allOf:
    #     - $ref: '#/components/schemas/ObjectCustomisation'
    FavoriteArticle:
      description: >
        is an article that the user has marked as a Favorite.
      type: object
      properties:
        subscription_id:
          $ref: '#/components/schemas/SubscriptionID'
    FavoriteSearch:
      description: >
        is a search that the user has marked as a Favorite.
      type: object
      allOf:
        - $ref: 'api.yaml#/components/schemas/SearchRequest'
    UserSession:
      description: tracks a user session.
      type: object
      required:
        - token
        - data
        - expiry
      properties:
        token:
          description: the session token for the user.
          type: string
        data:
          description: the encoded session data.
          x-go-type: '[]byte'
        expiry:
          description: the time at which this session token expires.
          x-go-type: time.Time
    ObjectCommon:
      description: contains common fields across objects.
      type: object
      required:
        - source_type
        - title
        - published
      properties:
        published:
          description: >
            is the datetime at which the feed or item was published.
          x-go-type: time.Time
        updated:
          description: >
            is the datetime at which the feed or item was updated.
          x-go-type: time.Time
          x-go-type-skip-optional-pointer: true
        source_type:
          description: >
            indicates what type of source the object came from.
          type: string
          enum: ['RSS', 'Atom', 'JSONFeed']
        title:
          description: >
            is the title of the feed or item.
          type: string
          x-oapi-codegen-extra-tags:
            validate: 'required'
        description:
          description: >
            is a short summary or description of the feed or item.
          type: string
        url:
          description: >
            is the URL to the webpage for the feed or item. For a feed, this is most likely the webpage the feed is
            sourced from. For an item, this is most likely the webpage containing the full item contents.
          type: string
          x-go-name: URL
          x-oapi-codegen-extra-tags:
            validate: 'omitempty,url'
          x-go-type-skip-optional-pointer: true
        categories:
          description: >
            is a list of categories that define a taxonomy for the feed or item.
          type: array
          items:
            $ref: '#/components/schemas/Category'
          x-oapi-codegen-extra-tags:
            validate: 'omitempty,unique'
          x-go-type-skip-optional-pointer: true
        authors:
          description: >
            is a list of people (names, nicknames and/or emails) who "authored" the object content.
          type: array
          items:
            type: string
          x-go-type-skip-optional-pointer: true
        contributors:
          description: >
            is a list of people (names, nicknames and/or emails) who "contributed" the object content.
          type: array
          items:
            type: string
          x-go-type-skip-optional-pointer: true
        language:
          type: string
          x-go-type-skip-optional-pointer: true
        copyright:
          type: string
          x-go-type-skip-optional-pointer: true
        image:
          $ref: '#/components/schemas/RemoteImage'
    Feed:
      description: represents a feed object.
      type: object
      allOf:
        - $ref: '#/components/schemas/ObjectCommon'
        - type: object
          required:
            - feed_id
            - source_urls
            - created_at
            - last_fetched
          properties:
            feed_id:
              $ref: '#/components/schemas/FeedID'
            source_urls:
              description: >
                is a list of URLs that point to the feed source.
              type: array
              items:
                $ref: '#/components/schemas/URL'
              x-go-name: SourceURLs
              x-oapi-codegen-extra-tags:
                validate: 'required,dive,url'
            created_at:
              $ref: '#/components/schemas/CreatedAt'
            last_fetched:
              description: >
                indicates when new items for the feed were last fetched.
              x-go-type: time.Time
    Item:
      description: represents an individual item (e.g., an individual feed item).
      type: object
      allOf:
        - $ref: '#/components/schemas/ObjectCommon'
        - type: object
          required:
            - item_id
            - feed_id
            - feed_title
            - Timestamp
          properties:
            Timestamp:
              $ref: '#/components/schemas/Timestamp'
            item_id:
              $ref: '#/components/schemas/ItemID'
            feed_id:
              $ref: '#/components/schemas/FeedID'
            feed_title:
              description: >
                is the title of the feed to which this item belongs.
              type: string
              x-oapi-codegen-extra-tags:
                validate: 'required'
            content:
              description: >
                contains the item content.
              type: string
              x-go-type-skip-optional-pointer: true
    SubscriptionMetadata:
      description: >
        contains the stored data that represents a subscription
      type: object
      required:
        - subscription_id
        - feed_id
      properties:
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        marked_read_at:
          description: >
            indicates when the subscription was last marked read. Any articles older than this timestamp are considered
            read, any newer unread.
          x-go-type: time.Time
        subscription_id:
          $ref: '#/components/schemas/SubscriptionID'
        feed_id:
          $ref: '#/components/schemas/FeedID'
        customisation:
          $ref: '#/components/schemas/SubscriptionCustomisation'
        settings:
          $ref: '#/components/schemas/SubscriptionSettings'
        item_states:
          description: >
            contains the states of items marked explicitly as read/unread/saved by the user.
          x-go-type: 'map[ItemID]ArticleState'
    SubscriptionCustomisation:
      description: >
        contains object fields that can be customised (overridden) by a user
      type: object
      properties:
        nickname:
          description: >
            is an optional alias or label for an object.
          type: string
          x-oapi-codegen-extra-tags:
            form: 'user_nickname'
          x-go-type-skip-optional-pointer: true
        categories:
          description: >
            is a custom list of categories for an object.
          type: array
          items:
            $ref: '#/components/schemas/Category'
          x-oapi-codegen-extra-tags:
            form: 'user_categories'
            validate: 'omitempty,unique'
          x-go-type-skip-optional-pointer: true
        image:
          description: >
            is a custom image to represent the object.
          oneOf:
            - $ref: '#/components/schemas/RemoteImage'
            - $ref: '#/components/schemas/StoredImage'
    SubscriptionSettings:
      description: >
        contains options that control how the subscription is stored/displayed.
      type: object
      properties:
        show_full_article_content:
          description: >
            toggles whether articles in the subscription should be always displayed with remote content.
          type: boolean
          x-oapi-codegen-extra-tags:
            form: "show_full_article_content"
    Subscription:
      description: >
        represents a feed a user has subscribed to.
      type: object
      required:
        - feed
        - metadata
      properties:
        feed:
          $ref: '#/components/schemas/Feed'
        metadata:
          $ref: '#/components/schemas/SubscriptionMetadata'
        unread_count:
          description: >
            is the value of items that are not explicitly marked unread by the user for this subscription.
          type: integer
          x-oapi-codegen-extra-tags:
            json: '-'
            validate: 'gte=0'
        favorite:
          description: >
            indicates whether this subscription has been marked as a Favorite by the user.
          type: boolean
          x-oapi-codegen-extra-tags:
            json: '-'
    SubscriptionRequest:
      description: >
        represents a request to create a subscription.
      type: object
      required:
        - URL
      properties:
        URL:
          description: is the URL of the feed data.
          type: string
          x-go-name: URL
          x-oapi-codegen-extra-tags:
            form: 'url'
            validate: 'required,url'
        URLErr:
          description: >
            is an error associated with the URL field.
          x-go-name: URLErr
          x-go-type: error
          x-oapi-codegen-extra-tags:
            form: '-'
            json: '-'
        nickname:
          description: a custom name for the subscription. Overrides the feed name.
          type: string
          x-oapi-codegen-extra-tags:
            form: 'user_nickname'
        nicknameErr:
          description: >
            is an error associated with the nickname field.
          x-go-type: error
          x-oapi-codegen-extra-tags:
            form: '-'
            json: '-'
        categories:
          description: a list custom categories for the subscription. Combined with the feed's own categories.
          type: array
          items:
            $ref: '#/components/schemas/Category'
          x-go-type-skip-optional-pointer: true
          x-oapi-codegen-extra-tags:
            form: 'user_categories'
        categoriesErr:
          description: >
            is an error associated with the categories field.
          x-go-type: error
          x-oapi-codegen-extra-tags:
            form: '-'
            json: '-'
    EditSubscriptionRequest:
      description: >
        is the request details for editing a subscription.
      type: object
      allOf:
        - $ref: '#/components/schemas/SubscriptionCustomisation'
        - $ref: '#/components/schemas/SubscriptionSettings'
        - type: object
          required:
            - subscription_id
          properties:
            subscription_id:
              $ref: '#/components/schemas/SubscriptionID'
            nicknameErr:
              description: >
                is an error associated with the nickname field.
              x-go-type: error
              x-oapi-codegen-extra-tags:
                form: '-'
                json: '-'
            categoriesErr:
              description: >
                is an error associated with the categories field.
              x-go-type: error
              x-oapi-codegen-extra-tags:
                form: '-'
                json: '-'
            imageErr:
              description: >
                is an error associated with the image field.
              x-go-type: error
              x-oapi-codegen-extra-tags:
                form: '-'
                json: '-'
            suggestedCategories:
              description: >
                is a list of suggested categories for the subscription.
              type: array
              items:
                $ref: '#/components/schemas/Category'
              x-oapi-codegen-extra-tags:
                form: '-'
                json: '-'
              x-go-type-skip-optional-pointer: true
    ArticleMetadata:
      description: >
        contains the stored data that represents an article.
      type: object
      required:
        - state
        - subscription_id
      properties:
        subscription_id:
          $ref: '#/components/schemas/SubscriptionID'
        state:
          $ref: '#/components/schemas/ArticleState'
    ArticleSettings:
      description: >
        contains settings related to the display of the article.
      type: object
      properties:
        show_full_content:
          description: >
            indicates whether the full article content should be fetched and displayed instead of any content from the
            feed item itself.
          type: boolean
    ArticleState:
      description: >
        tracks the state of an article.
      type: object
      required:
        - read
      properties:
        read:
          description: >
            indicates whether the object has been read (true) or is unread (false).
          type: boolean
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
    Article:
      description: >
        is the representation of an item from the user's perspective. It holds the original item and additional fields
        to track the state of the item from the perspective of the user.
      type: object
      allOf:
        - $ref: '#/components/schemas/ArticleMetadata'
        - $ref: '#/components/schemas/ArticleSettings'
        - type: object
          required:
            - item
          properties:
            item:
              $ref: '#/components/schemas/Item'
            favorite:
              description: >
                indicates whether this subscription has been marked as a Favorite by the user.
              type: boolean
              x-oapi-codegen-extra-tags:
                json: '-'
            content:
              description: >
                contains the full article content, when it has been fetched from the origin link.
              type: string
    ArticleArchive:
      description: >
        represents an item that has been archived to avoid deletion (i.e. favorited by a user).
      type: object
      allOf:
        - $ref: '#/components/schemas/Item'
        - type: object
          required:
            - user_id
            - subscription_id
          properties:
            user_id:
              $ref: '#/components/schemas/UserID'
            subscription_id:
              $ref: '#/components/schemas/SubscriptionID'
    MarkArticleRequest:
      description: >
        represents a user request for marking an article as read or unread.
      type: object
      required:
        - subscription_id
        - mark
        - item_id
        - view
      properties:
        subscription_id:
          $ref: '#/components/schemas/SubscriptionID'
        item_id:
          $ref: '#/components/schemas/ItemID'
        mark:
          $ref: '#/components/schemas/Mark'
    JobState:
      description: >
        represents the stored state of a scheduled job.
      type: object
      required:
        - updated_at
      properties:
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        job_data:
          x-go-type: json.RawMessage
    APIError:
      description: >
        represents an error returned from any API within the service/application.
      type: object
      properties:
        internal_error:
          description: >
            is the low-level, internal error.
          x-go-type: error
        status_code:
          description: >
            is the status code associated with the error. Usually, this is a HTTP status code.
          type: integer

