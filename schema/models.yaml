openapi: '3.0.3'
info:
  version: 1.0.0
  title: Common Models
  description: Common objects and fields.
paths: {}
components:
  schemas:
    # Common Fields.
    Timestamp:
      description: is when the document was created.
      x-go-type: 'time.Time'
      x-oapi-codegen-extra-tags:
        json: '@timestamp'
        validate: 'required'
    CreatedAt:
      description: records when the object was created in the database.
      x-go-type: 'time.Time'
      x-oapi-codegen-extra-tags:
        json: 'created_at'
        validate: 'required'
    UpdatedAt:
      description: records when the object was last updated in the database.
      x-go-type: 'time.Time'
      x-oapi-codegen-extra-tags:
        json: 'updated_at,omitempty'
        validate: 'omitnil'
    DeletedAt:
      description: records when the object was deleted.
      x-go-type: 'time.Time'
      x-oapi-codegen-extra-tags:
        json: 'deleted_at,omitempty'
        validate: 'omitnil'
      deprecated: true
    URL:
      description: is a URL.
      type: string
      x-go-name: URL
      x-oapi-codegen-extra-tags:
        validate: 'omitempty,url'
        json: 'url'
    Mark:
      description: >
        applies the given mark action to objects.
      type: string
      enum: ['read', 'unread']
      x-oapi-codegen-extra-tags:
        form: 'mark'
        validate: 'oneof=read unread'
    State:
      description: >
        Tracks the state of an object.
      type: string
      enum: ['read', 'unread', 'saved']
      default: 'unread'
      x-oapi-codegen-extra-tags:
        json: 'state'
        validate: 'oneof=read unread saved'
    FeedID:
      description: is the unique ID of a feed.
      type: string
      x-go-name: FeedID
      x-oapi-codegen-extra-tags:
        validate: 'required,startswith=feed_'
        json: 'feed_id'
        form: 'feed_id'
    ItemID:
      description: is the unique ID of an item.
      type: string
      x-go-name: ItemID
      x-oapi-codegen-extra-tags:
        validate: 'required,startswith=item_'
        json: 'item_id'
        form: 'item_id'
    SubscriptionID:
      description: is the unique ID of a subscription.
      type: string
      x-go-name: SubscriptionID
      x-oapi-codegen-extra-tags:
        validate: 'required,startswith=sub_'
        json: 'subscription_id'
        form: 'subscription_id'
    UserID:
      description: is the unique ID of a user.
      type: string
      x-go-name: UserID
      x-oapi-codegen-extra-tags:
        json: 'user_id'
        validate: 'required'
        form: 'user_id'
    FavoriteID:
      description: is the unique ID of a Favorite.
      type: string
      x-go-name: FavoriteID
      x-oapi-codegen-extra-tags:
        validate: 'required,startswith=fav_'
        json: 'favorite_id'
        form: 'favorite_id'
    Nickname:
      description: >
        is an optional friendly name.
      type: string
      x-oapi-codegen-extra-tags:
        form: 'nickname'
    Category:
      description: >
        represents a taxonomy applied to an object.
      type: string
    CategoryCount:
      description: >
        holds a category and the count of its occurence. The count will be
        contextual. i.e., across subscriptions, items, etc.
      type: object
      required:
        - category
        - count
      properties:
        category:
          $ref: '#/components/schemas/Category'
        count:
          type: integer
          minimum: 0
    Timestamps:
      description: contains common (metadata) fields for database objects.
      type: object
      required:
        - created_at
      properties:
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
    # Objects.
    User:
      description: is a user of the application.
      type: object
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          required:
            - user_id
            - external_user_id
            - provider
            - max_history
          properties:
            user_id:
              $ref: '#/components/schemas/UserID'
            external_user_id:
              description: >
                is the ID of the user on the external backend that was used to create the account.
              type: string
              x-oapi-codegen-extra-tags:
                validate: 'required'
            provider:
              description: >
                is the backend provider that was used to create the account.
              x-oapi-codegen-extra-tags:
                validate: 'required'
            max_history:
              description: >
                is a duration representing the maximum time-frame over which objects contained within are available.
              type: string
              x-oapi-codegen-extra-tags:
                validate: 'required'
            settings:
              $ref: '#/components/schemas/UserSettings'
            subscriptions:
              description: >
                is a list of the states of all subscriptions the user has.
              type: array
              items:
                $ref: '#/components/schemas/SubscriptionFeedRelation'
            favorites:
              description: >
                contains the user favorites.
              type: array
              items:
                $ref: '#/components/schemas/Favorite'
              x-oapi-codegen-extra-tags:
                validate: 'omitempty,dive'
    UserSettings:
      description: >
        contains user-specific settings for the application.
      type: object
      properties:
        theme:
          description: >
            the user interface theme chosen by the user.
          type: string
          default: dracula
    Favorite:
      description: >
        is an object that the user has marked as a Favorite. Favorites  have higher visibility in the display and
        score higher in search results.
      type: object
      required:
        - type
        - created_at
        - object_id
      properties:
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        nickname:
          $ref: '#/components/schemas/Nickname'
        type:
          description: >
            is the type of Favorite.
          type: string
          enum: ['subscription', 'article', 'search']
        object_id:
          description: >
            an ID of the object that has been favorited.
          type: string
          x-go-name: ObjectID
        object_data:
          description: >
            contains the (optional) data pertaining to the favorite object.
          oneOf:
            - $ref: '#/components/schemas/FavoriteSearch'
            # - $ref: '#/components/schemas/FavoriteSubscription'
            - $ref: '#/components/schemas/FavoriteArticle'
    FavoriteSubscription:
      description: >
        is a subscription that the user has marked as a Favorite.
      type: object
      allOf:
        - $ref: '#/components/schemas/ObjectCustomisation'
    FavoriteArticle:
      description: >
        is an article that the user has marked as a Favorite.
      type: object
      properties:
        subscription_id:
          $ref: '#/components/schemas/SubscriptionID'
    FavoriteSearch:
      description: >
        is a search that the user has marked as a Favorite.
      type: object
      allOf:
        - $ref: 'api.yaml#/components/schemas/SearchRequest'
    UserSession:
      description: tracks a user session.
      type: object
      required:
        - token
        - data
        - expiry
      properties:
        token:
          description: the session token for the user.
          type: string
        data:
          description: the encoded session data.
          x-go-type: '[]byte'
        expiry:
          description: the time at which this session token expires.
          x-go-type: time.Time
    ObjectState:
      description: >
        tracks the state of an object.
      type: object
      required:
        - read
        - starred
      properties:
        read:
          description: >
            indicates whether the object has been read (true) or is unread (false).
          type: boolean
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
    ObjectTimestamps:
      description: >
        contains timestamps for objects.
      type: object
      required:
        - published
      properties:
        published:
          description: >
            is the datetime at which the feed or item was published.
          x-go-type: time.Time
        updated:
          description: >
            is the datetime at which the feed or item was updated.
          x-go-type: time.Time
          x-go-type-skip-optional-pointer: true
    ObjectImage:
      description: >
        is a link to an image to represent the object.
      type: object
      required:
        - url
      properties:
        URL:
          $ref: '#/components/schemas/URL'
        title:
          description: >
            is a description of the image that could be used as alt text.
          type: string
    ObjectCommon:
      description: contains common fields across objects.
      type: object
      required:
        - source_type
        - title
      properties:
        source_type:
          description: >
            indicates what type of source the object came from.
          type: string
          enum: ['RSS', 'Atom', 'JSONFeed']
        title:
          description: >
            is the title of the feed or item.
          type: string
          x-oapi-codegen-extra-tags:
            validate: 'required'
        description:
          description: >
            is a short summary or description of the feed or item.
          type: string
        url:
          description: >
            is the URL to the webpage for the feed or item. For a feed, this is most likely the webpage the feed is
            sourced from. For an item, this is most likely the webpage containing the full item contents.
          type: string
          x-go-name: URL
          x-oapi-codegen-extra-tags:
            validate: 'omitempty,url'
          x-go-type-skip-optional-pointer: true
        categories:
          description: >
            is a list of categories that define a taxonomy for the feed or item.
          type: array
          items:
            $ref: '#/components/schemas/Category'
          x-oapi-codegen-extra-tags:
            validate: 'omitempty,unique'
          x-go-type-skip-optional-pointer: true
        authors:
          description: >
            is a list of people (names, nicknames and/or emails) who "authored" the object content.
          type: array
          items:
            type: string
          x-go-type-skip-optional-pointer: true
        contributors:
          description: >
            is a list of people (names, nicknames and/or emails) who "contributed" the object content.
          type: array
          items:
            type: string
          x-go-type-skip-optional-pointer: true
        image:
          $ref: '#/components/schemas/ObjectImage'
        language:
          type: string
          x-go-type-skip-optional-pointer: true
        copyright:
          type: string
          x-go-type-skip-optional-pointer: true
    ObjectCustomisation:
      description: >
        contains object fields that can be customised (overridden) by a user
      type: object
      properties:
        title:
          description: >
            is a friendly name or nickname for an object.
          type: string
          x-oapi-codegen-extra-tags:
            form: 'user_nickname'
            validate: 'omitempty'
          x-go-type-skip-optional-pointer: true
        categories:
          description: >
            is a custom list of categories for an object.
          type: array
          items:
            $ref: '#/components/schemas/Category'
          x-oapi-codegen-extra-tags:
            form: 'user_categories'
            validate: 'omitempty,unique'
          x-go-type-skip-optional-pointer: true
    Feed:
      description: represents a feed object.
      type: object
      allOf:
        - $ref: '#/components/schemas/ObjectCommon'
        - $ref: '#/components/schemas/ObjectTimestamps'
        - type: object
          required:
            - feed_id
            - source_url
            - created_at
          properties:
            feed_id:
              $ref: '#/components/schemas/FeedID'
            source_url:
              description: >
                is a URL to the source Feed document.
              allOf:
                - $ref: '#/components/schemas/URL'
              x-go-name: SourceURL
              x-oapi-codegen-extra-tags:
                validate: 'required,url'
            created_at:
              $ref: '#/components/schemas/CreatedAt'
    Item:
      description: represents an individual item (e.g., an individual feed item).
      type: object
      allOf:
        - $ref: '#/components/schemas/ObjectCommon'
        - $ref: '#/components/schemas/ObjectTimestamps'
        - type: object
          required:
            - item_id
            - feed_id
            - feed_title
            - Timestamp
          properties:
            Timestamp:
              $ref: '#/components/schemas/Timestamp'
            item_id:
              $ref: '#/components/schemas/ItemID'
            feed_id:
              $ref: '#/components/schemas/FeedID'
            feed_title:
              description: >
                is the title of the feed to which this item belongs.
              type: string
              x-oapi-codegen-extra-tags:
                validate: 'required'
            content:
              description: >
                contains the item content.
              type: string
              x-go-type-skip-optional-pointer: true
    SubscriptionFeedRelation:
      description: >
        links the IDs of a subscription and a feed.
      type: object
      required:
        - subscription_id
        - feed_id
      properties:
        subscription_id:
          $ref: '#/components/schemas/SubscriptionID'
        feed_id:
          $ref: '#/components/schemas/FeedID'
    UserSubscriptionFeedRelation:
      description: >
        links the IDs of a user to their subscriptions.
      type: object
      allOf:
        - $ref: '#/components/schemas/SubscriptionFeedRelation'
        - type: object
          required:
            - user_id
          properties:
            user_id:
              $ref: '#/components/schemas/UserID'
    SubscriptionState:
      description: >
        contains the data that represents the state and customisation applied to a user subscription.
      type: object
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - $ref: '#/components/schemas/UserSubscriptionFeedRelation'
        - type: object
          required:
            - state
          properties:
            state:
              $ref: '#/components/schemas/ObjectState'
            customisation:
              $ref: '#/components/schemas/ObjectCustomisation'
            item_states:
              description: >
                contains the states of items marked explicitly as read/unread/saved by the user.
              x-go-type: 'map[ItemID]ObjectState'
      x-omitzero: false
    Subscription:
      description: >
        represents a feed a user has subscribed to.
      type: object
      required:
        - state
        - feed
        - unread_count
      properties:
        state:
          $ref: '#/components/schemas/SubscriptionState'
        feed:
          $ref: '#/components/schemas/Feed'
        unread_count:
          description: >
            is the value of items that are not explicitly marked unread by the user for this subscription.
            Calculated dynamically at runtime.
          type: integer
          x-oapi-codegen-extra-tags:
            json: '-'
            validate: 'gte=0'
        Favorite:
          description: >
            indicates whether this subscription has been marked as a Favorite by the user.
          type: boolean
    Article:
      description: >
        is the representation of an item from the user's perspective. It holds the original item and additional fields
        to track the state of the item from the perspective of the user.
      type: object
      required:
        - subscription_id
      properties:
        item:
          $ref: '#/components/schemas/Item'
        subscription_id:
          $ref: '#/components/schemas/SubscriptionID'
        subscription_customisation:
          $ref: '#/components/schemas/ObjectCustomisation'
        state:
          $ref: '#/components/schemas/ObjectState'
        Favorite:
          description: >
            indicates whether this article has been marked as a Favorite by the user.
          type: boolean
    ArticleArchive:
      description: >
        represents an item that has been archived to avoid deletion (i.e. favorited by a user).
      type: object
      allOf:
        - $ref: '#/components/schemas/Item'
        - type: object
          required:
            - user_id
            - subscription_id
          properties:
            user_id:
              $ref: '#/components/schemas/UserID'
            subscription_id:
              $ref: '#/components/schemas/SubscriptionID'
