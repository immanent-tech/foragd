<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#161f3d"/>
    </linearGradient>
    <radialGradient id="glowGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4a83e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f4a83e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d39a5c"/>
      <stop offset="100%" stop-color="#7c4f24"/>
    </linearGradient>
    <linearGradient id="woodRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8b272"/>
      <stop offset="100%" stop-color="#9c6a35"/>
    </linearGradient>
    <clipPath id="sieveClip">
      <path d="M470,170 Q476,196 520,236 L680,236 Q724,196 730,170 Z"/>
    </clipPath>
    <filter id="softShadow2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4a83e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f4a83e" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="680" fill="url(#bgGrad2)"/>

  <!-- faint star/speck texture -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="90" cy="60" r="1.4"/>
    <circle cx="160" cy="40" r="1"/>
    <circle cx="60" cy="180" r="1.2"/>
    <circle cx="1000" cy="80" r="1.3"/>
    <circle cx="1080" cy="150" r="1"/>
    <circle cx="1130" cy="60" r="1.2"/>
    <circle cx="980" cy="640" r="1.1"/>
    <circle cx="1140" cy="500" r="1.3"/>
    <circle cx="50" cy="500" r="1.2"/>
    <circle cx="120" cy="640" r="1"/>
    <circle cx="640" cy="40" r="1.1"/>
    <circle cx="300" cy="300" r="1"/>
  </g>

  <!-- ambient glow -->
  <ellipse cx="610" cy="420" rx="380" ry="280" fill="url(#glowGrad2)"/>

  <!-- ungrouped grains scattered above the sieve -->
  <g opacity="0.9">
    <circle cx="500" cy="118" r="5.5" fill="#f4a83e"/>
    <circle cx="540" cy="100" r="5" fill="#5fb6d9"/>
    <circle cx="585" cy="124" r="5" fill="#7fd9a8"/>
    <circle cx="620" cy="98" r="5.5" fill="#e6739a"/>
    <circle cx="655" cy="120" r="5" fill="#f4a83e"/>
    <circle cx="695" cy="104" r="5" fill="#5fb6d9"/>
    <circle cx="465" cy="140" r="4.5" fill="#7fd9a8"/>
    <circle cx="720" cy="138" r="4.5" fill="#e6739a"/>
  </g>

  <!-- sorting streams from sieve to jars -->
  <g fill="none" stroke-linecap="round">
    <path d="M560,236 C520,330 430,400 392,500" stroke="#f4a83e" stroke-width="2.5" opacity="0.55"/>
    <path d="M602,238 C602,330 602,420 602,500" stroke="#5fb6d9" stroke-width="2.5" opacity="0.55"/>
    <path d="M642,236 C690,330 770,400 808,500" stroke="#7fd9a8" stroke-width="2.5" opacity="0.55"/>
  </g>
  <g>
    <circle cx="470" cy="380" r="4" fill="#f4a83e"/>
    <circle cx="430" cy="450" r="3.5" fill="#f4a83e"/>
    <circle cx="602" cy="360" r="4" fill="#5fb6d9"/>
    <circle cx="602" cy="440" r="3.5" fill="#5fb6d9"/>
    <circle cx="735" cy="380" r="4" fill="#7fd9a8"/>
    <circle cx="775" cy="450" r="3.5" fill="#7fd9a8"/>
  </g>

  <!-- faint discarded trail (filtered out) -->
  <g>
    <path d="M700,210 C780,230 860,260 930,290" fill="none" stroke="#7e8aab" stroke-width="2" opacity="0.3" stroke-dasharray="2 6" stroke-linecap="round"/>
    <circle cx="800" cy="232" r="3" fill="#7e8aab" opacity="0.5"/>
    <circle cx="870" cy="262" r="2.5" fill="#7e8aab" opacity="0.35"/>
    <circle cx="930" cy="290" r="2" fill="#7e8aab" opacity="0.2"/>
  </g>

  <!-- the sieve -->
  <g filter="url(#softShadow2)">
    <path d="M470,170 Q476,196 520,236 L680,236 Q724,196 730,170 Z" fill="url(#woodGrad)" stroke="#5e3c1d" stroke-width="2"/>
    <g clip-path="url(#sieveClip)">
      <g fill="#3c2a16" opacity="0.55">
        <circle cx="500" cy="190" r="3"/><circle cx="520" cy="190" r="3"/><circle cx="540" cy="190" r="3"/><circle cx="560" cy="190" r="3"/><circle cx="580" cy="190" r="3"/><circle cx="600" cy="190" r="3"/><circle cx="620" cy="190" r="3"/><circle cx="640" cy="190" r="3"/><circle cx="660" cy="190" r="3"/><circle cx="680" cy="190" r="3"/><circle cx="700" cy="190" r="3"/>
        <circle cx="510" cy="206" r="3"/><circle cx="530" cy="206" r="3"/><circle cx="550" cy="206" r="3"/><circle cx="570" cy="206" r="3"/><circle cx="590" cy="206" r="3"/><circle cx="610" cy="206" r="3"/><circle cx="630" cy="206" r="3"/><circle cx="650" cy="206" r="3"/><circle cx="670" cy="206" r="3"/><circle cx="690" cy="206" r="3"/>
        <circle cx="525" cy="222" r="3"/><circle cx="545" cy="222" r="3"/><circle cx="565" cy="222" r="3"/><circle cx="585" cy="222" r="3"/><circle cx="605" cy="222" r="3"/><circle cx="625" cy="222" r="3"/><circle cx="645" cy="222" r="3"/><circle cx="665" cy="222" r="3"/>
      </g>
    </g>
    <ellipse cx="600" cy="170" rx="170" ry="40" fill="none" stroke="url(#woodRimGrad)" stroke-width="9"/>
    <ellipse cx="600" cy="167" rx="150" ry="28" fill="#2e2010" opacity="0.4"/>
  </g>

  <!-- magnifying glass over the curated piles -->
  <g opacity="0.95">
    <line x1="765" y1="565" x2="815" y2="615" stroke="#9c6a35" stroke-width="16" stroke-linecap="round"/>
    <line x1="765" y1="565" x2="815" y2="615" stroke="#e8b272" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    <circle cx="650" cy="470" r="150" fill="url(#lensGrad)" stroke="#f4a83e" stroke-width="5" opacity="0.9"/>
    <g stroke="#f4a83e" stroke-width="3" stroke-linecap="round" opacity="0.5">
      <line x1="595" y1="375" x2="705" y2="375"/>
      <line x1="595" y1="397" x2="690" y2="397"/>
      <line x1="595" y1="419" x2="665" y2="419"/>
    </g>
  </g>

  <!-- three jars: grouped, unified feeds -->
  <!-- left jar -->
  <g transform="translate(392,560)">
    <ellipse cx="0" cy="-72" rx="62" ry="14" fill="#9c6a35"/>
    <path d="M-64,-66 Q-64,80 0,80 Q64,80 64,-66 Z" fill="#f4a83e" opacity="0.14" stroke="#f4a83e" stroke-width="2.5" stroke-opacity="0.55"/>
    <ellipse cx="0" cy="-66" rx="64" ry="15" fill="none" stroke="#f4a83e" stroke-width="2.5" stroke-opacity="0.55"/>
    <circle cx="-22" cy="20" r="6" fill="#f4a83e"/>
    <circle cx="14" cy="36" r="5.5" fill="#f4a83e"/>
    <circle cx="-6" cy="48" r="5" fill="#f4a83e"/>
    <circle cx="28" cy="8" r="5" fill="#f4a83e"/>
    <circle cx="-30" cy="-4" r="5" fill="#f4a83e"/>
  </g>

  <!-- center jar: saved as a live subscription -->
  <g transform="translate(602,560)">
    <ellipse cx="0" cy="-72" rx="66" ry="15" fill="#9c6a35"/>
    <path d="M-68,-66 Q-68,84 0,84 Q68,84 68,-66 Z" fill="#5fb6d9" opacity="0.14" stroke="#5fb6d9" stroke-width="2.5" stroke-opacity="0.6"/>
    <ellipse cx="0" cy="-66" rx="68" ry="16" fill="none" stroke="#5fb6d9" stroke-width="2.5" stroke-opacity="0.6"/>
    <circle cx="-24" cy="22" r="6" fill="#5fb6d9"/>
    <circle cx="16" cy="38" r="5.5" fill="#5fb6d9"/>
    <circle cx="-4" cy="52" r="5" fill="#5fb6d9"/>
    <circle cx="30" cy="10" r="5" fill="#5fb6d9"/>
    <circle cx="-32" cy="-2" r="5" fill="#5fb6d9"/>
    <circle cx="4" cy="6" r="5" fill="#5fb6d9"/>
    <!-- bookmark ribbon -->
    <path d="M-14,-66 h28 v44 l-14,-12 l-14,12 Z" fill="#f4a83e"/>
    <!-- live-sync badge -->
    <circle cx="60" cy="-92" r="13" fill="#0b1020" stroke="#f4a83e" stroke-width="2"/>
    <path d="M54,-97 a8,8 0 1 1 -2,11" fill="none" stroke="#f4a83e" stroke-width="2" stroke-linecap="round"/>
    <path d="M52,-99 l2,6 l-7,-1 Z" fill="#f4a83e"/>
  </g>

  <!-- right jar -->
  <g transform="translate(812,560)">
    <ellipse cx="0" cy="-72" rx="62" ry="14" fill="#9c6a35"/>
    <path d="M-64,-66 Q-64,80 0,80 Q64,80 64,-66 Z" fill="#7fd9a8" opacity="0.14" stroke="#7fd9a8" stroke-width="2.5" stroke-opacity="0.55"/>
    <ellipse cx="0" cy="-66" rx="64" ry="15" fill="none" stroke="#7fd9a8" stroke-width="2.5" stroke-opacity="0.55"/>
    <circle cx="-20" cy="18" r="6" fill="#7fd9a8"/>
    <circle cx="18" cy="34" r="5.5" fill="#7fd9a8"/>
    <circle cx="-2" cy="48" r="5" fill="#7fd9a8"/>
    <circle cx="26" cy="6" r="5" fill="#7fd9a8"/>
    <circle cx="-28" cy="-6" r="5" fill="#7fd9a8"/>
  </g>

  <!-- no algorithm / no sponsored badges -->
  <g transform="translate(95,605)">
    <circle r="26" fill="#16203b" stroke="#2c3a64" stroke-width="1.5"/>
    <g fill="none" stroke="#aebbe0" stroke-width="1.8">
      <circle cx="-9" cy="-8" r="4"/>
      <circle cx="9" cy="-8" r="4"/>
      <circle cx="0" cy="9" r="4"/>
      <line x1="-9" y1="-8" x2="9" y2="-8"/>
      <line x1="-9" y1="-8" x2="0" y2="9"/>
      <line x1="9" y1="-8" x2="0" y2="9"/>
    </g>
    <line x1="-15" y1="15" x2="15" y2="-15" stroke="#e0703a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(1105,605)">
    <circle r="26" fill="#16203b" stroke="#2c3a64" stroke-width="1.5"/>
    <path d="M-12,-2 l14,-8 v22 l-14,-8 Z" fill="none" stroke="#aebbe0" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M-12,-2 h-4 v8 h4 Z" fill="none" stroke="#aebbe0" stroke-width="1.8"/>
    <path d="M2,14 q4,6 0,10" fill="none" stroke="#aebbe0" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-15" y1="15" x2="15" y2="-15" stroke="#e0703a" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
