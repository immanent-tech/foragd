<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#161f3d"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4a83e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f4a83e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d39a5c"/>
      <stop offset="100%" stop-color="#7c4f24"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8b272"/>
      <stop offset="100%" stop-color="#9c6a35"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4a83e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f4a83e" stop-opacity="0.65"/>
    </linearGradient>
    <clipPath id="basketClip">
      <path d="M740,325 Q745,342 800,470 L920,470 Q975,342 980,325 Z"/>
    </clipPath>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="680" fill="url(#bgGrad)"/>

  <!-- faint star/speck texture -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="90" cy="60" r="1.4"/>
    <circle cx="160" cy="40" r="1"/>
    <circle cx="60" cy="180" r="1.2"/>
    <circle cx="1000" cy="80" r="1.3"/>
    <circle cx="1080" cy="150" r="1"/>
    <circle cx="1130" cy="60" r="1.2"/>
    <circle cx="980" cy="600" r="1.1"/>
    <circle cx="1100" cy="560" r="1.3"/>
    <circle cx="50" cy="600" r="1.2"/>
    <circle cx="120" cy="640" r="1"/>
    <circle cx="640" cy="40" r="1.1"/>
    <circle cx="720" cy="610" r="1"/>
  </g>

  <!-- glow behind basket -->
  <ellipse cx="860" cy="380" rx="320" ry="280" fill="url(#glowGrad)"/>

  <!-- connecting tributary paths (back to front, longest first for layering) -->
  <g fill="none" stroke-linecap="round">
    <path d="M289.3,622.7 C524.65,622.7 642.33,345 760,345" stroke="url(#pathGrad)" stroke-width="2.5"/>
    <path d="M247.2,519.1 C503.6,519.1 631.3,345 760,345" stroke="url(#pathGrad)" stroke-width="2.5"/>
    <path d="M218.8,396.8 C489.4,396.8 624.5,345 760,345" stroke="url(#pathGrad)" stroke-width="2.5"/>
    <path d="M208.7,274.3 C484.35,274.3 622.18,345 760,345" stroke="url(#pathGrad)" stroke-width="2.5"/>
    <path d="M231.7,142.2 C495.85,142.2 627.93,345 760,345" stroke="url(#pathGrad)" stroke-width="2.5"/>
  </g>

  <!-- flowing particles along the tributaries -->
  <g>
    <circle cx="453.0" cy="525.8" r="4" fill="#f4a83e" opacity="0.85"/>
    <circle cx="595.3" cy="442.1" r="3.5" fill="#7fd9a8" opacity="0.8"/>

    <circle cx="426.7" cy="458.5" r="4" fill="#7fd9a8" opacity="0.85"/>
    <circle cx="580.5" cy="406.6" r="3.5" fill="#f4a83e" opacity="0.8"/>

    <circle cx="408.2" cy="378.7" r="4" fill="#f4a83e" opacity="0.85"/>
    <circle cx="570.6" cy="362.9" r="3.5" fill="#f4a83e" opacity="0.8"/>

    <circle cx="401.6" cy="299.0" r="4" fill="#7fd9a8" opacity="0.85"/>
    <circle cx="566.0" cy="320.3" r="3.5" fill="#f4a83e" opacity="0.8"/>

    <circle cx="416.6" cy="213.2" r="4" fill="#f4a83e" opacity="0.85"/>
    <circle cx="575.1" cy="274.0" r="3.5" fill="#7fd9a8" opacity="0.8"/>
  </g>

  <!-- feed signal arcs rising from the basket, nodding to "feed reader" -->
  <g fill="none" stroke="#f4a83e" stroke-linecap="round" opacity="0.55">
    <path d="M820,250 A60,60 0 0 1 900,250" stroke-width="3"/>
    <path d="M834,266 A40,40 0 0 1 886,266" stroke-width="3"/>
    <circle cx="860" cy="282" r="5" fill="#f4a83e" stroke="none"/>
  </g>

  <!-- basket -->
  <g filter="url(#softShadow)">
    <!-- handle -->
    <path d="M793,300 Q860,210 927,300" fill="none" stroke="#9c6a35" stroke-width="9" stroke-linecap="round"/>
    <path d="M793,300 Q860,210 927,300" fill="none" stroke="#e8b272" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- body -->
    <path d="M740,325 Q745,342 800,470 L920,470 Q975,342 980,325 Z" fill="url(#basketGrad)" stroke="#5e3c1d" stroke-width="2"/>

    <!-- weave texture -->
    <g clip-path="url(#basketClip)" stroke="#5e3c1d" stroke-width="2" opacity="0.45">
      <line x1="700" y1="325" x2="900" y2="525"/>
      <line x1="730" y1="325" x2="930" y2="525"/>
      <line x1="760" y1="325" x2="960" y2="525"/>
      <line x1="790" y1="325" x2="990" y2="525"/>
      <line x1="820" y1="325" x2="1020" y2="525"/>
      <line x1="850" y1="325" x2="1050" y2="525"/>
      <line x1="1020" y1="325" x2="820" y2="525"/>
      <line x1="990" y1="325" x2="790" y2="525"/>
      <line x1="960" y1="325" x2="760" y2="525"/>
      <line x1="930" y1="325" x2="730" y2="525"/>
      <line x1="900" y1="325" x2="700" y2="525"/>
      <line x1="870" y1="325" x2="670" y2="525"/>
    </g>

    <!-- rim -->
    <ellipse cx="860" cy="325" rx="120" ry="30" fill="none" stroke="url(#rimGrad)" stroke-width="8"/>
    <ellipse cx="860" cy="323" rx="104" ry="20" fill="#3c2a16"/>
  </g>

  <!-- overflow accents: leaves and berries spilling over the rim -->
  <g>
    <path d="M790,300 q-22,-8 -34,10 q22,8 34,-10 Z" fill="#7fd9a8" opacity="0.9"/>
    <path d="M930,295 q22,-10 36,6 q-22,10 -36,-6 Z" fill="#7fd9a8" opacity="0.9"/>
    <circle cx="805" cy="288" r="7" fill="#f4a83e"/>
    <circle cx="822" cy="278" r="6" fill="#e0703a"/>
    <circle cx="915" cy="282" r="6.5" fill="#f4a83e"/>
  </g>

  <!-- source nodes -->
  <!-- Website -->
  <g transform="translate(200,130)">
    <circle r="34" fill="#16203b" stroke="#2c3a64" stroke-width="1.5"/>
    <g fill="none" stroke="#aebbe0" stroke-width="1.8">
      <circle r="16"/>
      <ellipse rx="7" ry="16"/>
      <line x1="-16" y1="0" x2="16" y2="0"/>
    </g>
    <circle cx="24" cy="-24" r="9" fill="#0b1020" stroke="#f4a83e" stroke-width="1.5"/>
    <path d="M24,-28 v8 M20,-24 h8" stroke="#f4a83e" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Blog / article -->
  <g transform="translate(175,270)">
    <circle r="34" fill="#16203b" stroke="#2c3a64" stroke-width="1.5"/>
    <g fill="none" stroke="#aebbe0" stroke-width="1.6">
      <path d="M-11,-16 h16 l6,6 v26 h-22 Z"/>
      <path d="M5,-16 v6 h6"/>
      <line x1="-7" y1="-2" x2="9" y2="-2"/>
      <line x1="-7" y1="4" x2="9" y2="4"/>
      <line x1="-7" y1="10" x2="3" y2="10"/>
    </g>
    <circle cx="24" cy="-24" r="9" fill="#0b1020" stroke="#f4a83e" stroke-width="1.5"/>
    <path d="M24,-28 v8 M20,-24 h8" stroke="#f4a83e" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Video channel -->
  <g transform="translate(185,400)">
    <circle r="34" fill="#16203b" stroke="#2c3a64" stroke-width="1.5"/>
    <rect x="-17" y="-13" width="34" height="26" rx="7" fill="none" stroke="#aebbe0" stroke-width="1.6"/>
    <path d="M-5,-7 l13,7 l-13,7 Z" fill="#aebbe0"/>
    <circle cx="24" cy="-24" r="9" fill="#0b1020" stroke="#f4a83e" stroke-width="1.5"/>
    <path d="M24,-28 v8 M20,-24 h8" stroke="#f4a83e" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Community / subreddit -->
  <g transform="translate(215,530)">
    <circle r="34" fill="#16203b" stroke="#2c3a64" stroke-width="1.5"/>
    <path d="M-17,-12 h34 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-19 l-9,8 v-8 h-6 a4,4 0 0 1 -4,-4 v-12 a4,4 0 0 1 4,-4 Z"
          fill="none" stroke="#aebbe0" stroke-width="1.6"/>
    <circle cx="-7" cy="-2" r="2.2" fill="#aebbe0"/>
    <circle cx="1" cy="-2" r="2.2" fill="#aebbe0"/>
    <circle cx="9" cy="-2" r="2.2" fill="#aebbe0"/>
    <circle cx="24" cy="-24" r="9" fill="#0b1020" stroke="#f4a83e" stroke-width="1.5"/>
    <path d="M24,-28 v8 M20,-24 h8" stroke="#f4a83e" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Email newsletter -->
  <g transform="translate(260,640)">
    <circle r="34" fill="#16203b" stroke="#2c3a64" stroke-width="1.5"/>
    <rect x="-17" y="-11" width="34" height="22" rx="3" fill="none" stroke="#aebbe0" stroke-width="1.6"/>
    <path d="M-17,-11 l17,13 l17,-13" fill="none" stroke="#aebbe0" stroke-width="1.6"/>
    <circle cx="24" cy="-24" r="9" fill="#0b1020" stroke="#f4a83e" stroke-width="1.5"/>
    <path d="M24,-28 v8 M20,-24 h8" stroke="#f4a83e" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
