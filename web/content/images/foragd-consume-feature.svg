<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#161f3d"/>
    </linearGradient>
    <radialGradient id="glowGrad3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4a83e" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f4a83e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lanternGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8b272"/>
      <stop offset="100%" stop-color="#9c6a35"/>
    </linearGradient>
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4a83e" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f4a83e" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="-180" y="-150" width="360" height="300" rx="24"/>
    </clipPath>
    <filter id="softShadow3" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="blurClutter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="680" fill="url(#bgGrad3)"/>

  <!-- faint star/speck texture -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="600" cy="30" r="1.2"/>
    <circle cx="40" cy="40" r="1.1"/>
    <circle cx="1160" cy="40" r="1.1"/>
    <circle cx="40" cy="650" r="1.1"/>
    <circle cx="1160" cy="650" r="1.1"/>
    <circle cx="300" cy="650" r="1"/>
    <circle cx="900" cy="650" r="1"/>
  </g>

  <!-- ambient warm glow behind the page -->
  <ellipse cx="600" cy="380" rx="360" ry="300" fill="url(#glowGrad3)"/>

  <!-- distractions, faded and pushed into the shadows -->
  <g filter="url(#blurClutter)" opacity="0.55">
    <!-- top-left banner ad -->
    <g transform="translate(150,110) rotate(-6)">
      <rect x="-60" y="-20" width="120" height="40" rx="4" fill="none" stroke="#5b6788" stroke-width="2"/>
      <line x1="-60" y1="-20" x2="60" y2="20" stroke="#5b6788" stroke-width="1.5"/>
      <line x1="-60" y1="20" x2="60" y2="-20" stroke="#5b6788" stroke-width="1.5"/>
    </g>
    <!-- top-right popup -->
    <g transform="translate(1040,130) rotate(8)">
      <rect x="-46" y="-34" width="92" height="68" rx="6" fill="none" stroke="#5b6788" stroke-width="2"/>
      <circle cx="34" cy="-22" r="9" fill="none" stroke="#5b6788" stroke-width="2"/>
      <line x1="30" y1="-26" x2="38" y2="-18" stroke="#5b6788" stroke-width="1.5"/>
      <line x1="38" y1="-26" x2="30" y2="-18" stroke="#5b6788" stroke-width="1.5"/>
      <line x1="-30" y1="0" x2="20" y2="0" stroke="#5b6788" stroke-width="2"/>
      <line x1="-30" y1="14" x2="10" y2="14" stroke="#5b6788" stroke-width="2"/>
    </g>
    <!-- bottom-left sidebar widgets -->
    <g transform="translate(140,560)">
      <rect x="-50" y="-34" width="100" height="22" rx="3" fill="none" stroke="#5b6788" stroke-width="2"/>
      <rect x="-50" y="-6" width="100" height="22" rx="3" fill="none" stroke="#5b6788" stroke-width="2"/>
      <rect x="-50" y="22" width="100" height="22" rx="3" fill="none" stroke="#5b6788" stroke-width="2"/>
    </g>
    <!-- bottom-right tracker dots -->
    <g transform="translate(1050,570)">
      <circle cx="-20" cy="0" r="6" fill="none" stroke="#5b6788" stroke-width="2"/>
      <circle cx="6" cy="-14" r="6" fill="none" stroke="#5b6788" stroke-width="2"/>
      <circle cx="26" cy="10" r="6" fill="none" stroke="#5b6788" stroke-width="2"/>
      <line x1="-20" y1="0" x2="6" y2="-14" stroke="#5b6788" stroke-width="1.5"/>
      <line x1="6" y1="-14" x2="26" y2="10" stroke="#5b6788" stroke-width="1.5"/>
    </g>
  </g>

  <!-- lantern -->
  <g transform="translate(600,108)" filter="url(#softShadow3)">
    <line x1="0" y1="-78" x2="0" y2="-38" stroke="#9c6a35" stroke-width="3"/>
    <path d="M-14,-38 h28 l4,10 h-36 Z" fill="url(#lanternGrad)" stroke="#5e3c1d" stroke-width="1.5"/>
    <rect x="-22" y="-28" width="44" height="46" rx="8" fill="#2e2010" stroke="url(#lanternGrad)" stroke-width="4"/>
    <line x1="0" y1="-26" x2="0" y2="16" stroke="#5e3c1d" stroke-width="2" opacity="0.6"/>
    <ellipse cx="0" cy="-4" rx="11" ry="15" fill="#f4a83e"/>
    <ellipse cx="0" cy="-2" rx="6" ry="9" fill="#ffd9a0"/>
    <path d="M-14,18 h28 l-4,8 h-20 Z" fill="url(#lanternGrad)" stroke="#5e3c1d" stroke-width="1.5"/>
    <g stroke="#f4a83e" stroke-width="2" stroke-linecap="round" opacity="0.5">
      <line x1="-34" y1="-2" x2="-44" y2="-8"/>
      <line x1="34" y1="-2" x2="44" y2="-8"/>
    </g>
  </g>

  <!-- light cone -->
  <path d="M600,150 L420,232 L780,232 Z" fill="url(#coneGrad)"/>

  <!-- the article card: light theme (left) / dark theme (right) -->
  <g transform="translate(600,380)" filter="url(#softShadow3)">
    <rect x="-180" y="-150" width="360" height="300" rx="24" fill="#11182c"/>
    <g clip-path="url(#cardClip)">
      <rect x="-180" y="-150" width="180" height="300" fill="#f3ead9"/>

      <!-- light-theme content -->
      <rect x="-156" y="-118" width="58" height="40" rx="4" fill="none" stroke="#c9a36a" stroke-width="2"/>
      <path d="M-150,-104 l10,-8 l10,8 M-146,-98 l6,-14 l6,14" stroke="#c9a36a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <rect x="-84" y="-114" width="64" height="9" rx="2" fill="#2b2316"/>
      <rect x="-156" y="-58" width="136" height="6" rx="2" fill="#3a3120"/>
      <rect x="-156" y="-40" width="136" height="6" rx="2" fill="#3a3120"/>
      <rect x="-156" y="-22" width="110" height="6" rx="2" fill="#3a3120"/>
      <rect x="-156" y="0" width="136" height="6" rx="2" fill="#3a3120"/>
      <rect x="-156" y="18" width="136" height="6" rx="2" fill="#3a3120"/>
      <rect x="-156" y="36" width="90" height="6" rx="2" fill="#3a3120"/>
      <rect x="-156" y="64" width="136" height="6" rx="2" fill="#3a3120"/>
      <rect x="-156" y="82" width="120" height="6" rx="2" fill="#3a3120"/>

      <!-- dark-theme content (mirrored) -->
      <rect x="98" y="-118" width="58" height="40" rx="4" fill="none" stroke="#465482" stroke-width="2"/>
      <path d="M104,-104 l10,-8 l10,8 M108,-98 l6,-14 l6,14" stroke="#465482" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <rect x="20" y="-114" width="64" height="9" rx="2" fill="#dbe3fa"/>
      <rect x="20" y="-58" width="136" height="6" rx="2" fill="#7c8ab8"/>
      <rect x="20" y="-40" width="136" height="6" rx="2" fill="#7c8ab8"/>
      <rect x="20" y="-22" width="110" height="6" rx="2" fill="#7c8ab8"/>
      <rect x="20" y="0" width="136" height="6" rx="2" fill="#7c8ab8"/>
      <rect x="20" y="18" width="136" height="6" rx="2" fill="#7c8ab8"/>
      <rect x="20" y="36" width="90" height="6" rx="2" fill="#7c8ab8"/>
      <rect x="20" y="64" width="136" height="6" rx="2" fill="#7c8ab8"/>
      <rect x="20" y="82" width="120" height="6" rx="2" fill="#7c8ab8"/>
    </g>
    <!-- theme divider / toggle track -->
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#f4a83e" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="0" r="13" fill="#0b1020" stroke="#f4a83e" stroke-width="2.5"/>
    <path d="M-5,0 a5,5 0 1 0 7,-7 a6.5,6.5 0 1 1 -7,7 Z" fill="#f4a83e"/>
    <rect x="-180" y="-150" width="360" height="300" rx="24" fill="none" stroke="#2c3a64" stroke-width="2"/>
  </g>

  <!-- save / theme / share badges -->
  <g transform="translate(470,610)">
    <circle r="26" fill="#16203b" stroke="#2c3a64" stroke-width="1.5"/>
    <path d="M-10,-14 h20 v26 l-10,-9 l-10,9 Z" fill="none" stroke="#f4a83e" stroke-width="2"/>
  </g>

  <g transform="translate(600,610)">
    <circle r="26" fill="#16203b" stroke="#2c3a64" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="13" fill="none" stroke="#aebbe0" stroke-width="2"/>
    <path d="M0,-13 A13,13 0 0 1 0,13 Z" fill="#aebbe0"/>
  </g>

  <g transform="translate(730,610)">
    <circle r="26" fill="#16203b" stroke="#2c3a64" stroke-width="1.5"/>
    <circle cx="-10" cy="0" r="5" fill="none" stroke="#aebbe0" stroke-width="2"/>
    <circle cx="9" cy="-10" r="5" fill="none" stroke="#aebbe0" stroke-width="2"/>
    <circle cx="9" cy="10" r="5" fill="none" stroke="#aebbe0" stroke-width="2"/>
    <line x1="-6" y1="-2" x2="5" y2="-8" stroke="#aebbe0" stroke-width="2"/>
    <line x1="-6" y1="2" x2="5" y2="8" stroke="#aebbe0" stroke-width="2"/>
  </g>
</svg>
